<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="border:2px solid var(--ochre);padding:14px 16px 16px;background:var(--card)">
  <div style="font:640 1.6rem/1.1 var(--fs);letter-spacing:.01em;color:var(--ochre)">⚠ NOT CONFIRMED</div>
  <div style="height:1px;background:var(--rule);margin:10px 0 10px"></div>
  <div style="font:400 1.02rem/1.6 var(--fd);color:var(--muted);max-width:56ch">A Bo5 can end anywhere from 20:00 to 22:00, and several Daejeon kitchens close by 23:00. Post-match dinner times could not be pinned.</div>
  <div style="margin-top:11px;font:640 .82rem/1.3 var(--fs);letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)">What to do instead — call Gobang, 042-863-2104, before you go in</div>
</div>
<p class="note">The product's entire claim rests on this block being as loud as a fact.</p></body></html>
