<!-- @dsCard group="Type" viewport="700x180" subtitle="Uppercase + tracking = data. Sentence case = prose" name="Kicker, control, label" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:11px">
  <span style="font:640 .625rem/1 var(--fs);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)">FIELD NOTE · panel kicker · 0.625rem / .22em</span>
  <span style="font:640 .75rem/1 var(--fs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)">CONTROL · tabs, buttons, pills · 0.75rem / .08em</span>
  <span style="font:640 .66rem/1 var(--fs);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">LABEL · chrome only · 0.66rem / .16em</span>
</div>
<p class="note">The kicker names the KIND of thing inside, not the title — it is the only thing visible when a panel is collapsed. Verification marks never live at Label size.</p></body></html>
