<!-- @dsCard group="Type" viewport="700x215" subtitle="Four sizes of one idea — dot, chip, stamp, reading" name="The notation ladder" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <span style="display:inline-block;width:1em;height:1em;border-radius:999px;border:1px solid var(--rule2)"></span>
  <span style="font:640 .75rem/1 var(--fs);letter-spacing:.08em;color:var(--ochre);border:1px solid currentColor;border-radius:999px;padding:5px 11px">⚠ UNCONFIRMED</span>
  <span style="font:640 .75rem/1 var(--fs);letter-spacing:.08em;color:var(--ochre);border:1px solid currentColor;border-radius:999px;padding:5px 11px">≈ APPROX.</span>
  <span style="font:640 .82rem/1 var(--fs);letter-spacing:.08em;text-transform:uppercase;color:var(--aink);border:1px solid currentColor;padding:3px 8px">✓ checked 18 jul 2026</span>
</div>
<p class="note">Smallness is not what identifies a mark as notation — the data face, the tracking and the stamp grammar are. Any flag the reader can tap renders at Control size or larger, never below.</p></body></html>
