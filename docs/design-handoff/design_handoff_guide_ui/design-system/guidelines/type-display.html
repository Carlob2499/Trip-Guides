<!-- @dsCard group="Type" viewport="700x210" subtitle="Literata. One display per page" name="Display & headline" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="font:640 3.4rem/0.98 var(--fd);letter-spacing:-.014em">South Korea</div>
<div style="font:400 2rem/1.15 var(--fd);margin-top:10px">Daejeon — MSI, and the KTX down</div>
<p class="note">Display <code>clamp(2.5rem, 6vw, 4.8rem)</code>/0.98/-0.014em · Headline <code>clamp(1.5rem, 4vw, 2.2rem)</code>/1.15. Every clamp's middle term carries a rem component so the reader's own font-size setting still moves the type.</p></body></html>
