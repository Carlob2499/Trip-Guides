<!-- @dsCard group="Type" viewport="700x185" subtitle="Coordinates, totals and gaps at heading scale. Tabular, floors at 24px" name="Reading scale" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="font:640 2.4rem/1.1 var(--fs);letter-spacing:.01em;color:var(--aink)">Seoul · Daejeon · Busan</div>
<div style="font:640 2rem/1.1 var(--fs);font-variant-numeric:tabular-nums;color:var(--aink);margin-top:6px">23 days out</div>
<p class="note">Reading scale is structure, not decoration — it is the largest non-title type on the masthead. R5 spends it on the trip's cities and its live state; R4 spent it on coordinates. Shrinking it to a caption is the single most likely drift in the system.</p></body></html>
