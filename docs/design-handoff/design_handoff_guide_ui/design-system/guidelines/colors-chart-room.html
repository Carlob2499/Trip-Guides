<!-- @dsCard group="Colors" viewport="700x150" subtitle="Night. Only the ink re-maps — never the accent" name="Chart room surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#0f1317;color:#e8ece3"><b>bg</b><i>#0f1317</i></div>
  <div class="sw" style="background:#242c34;color:#e8ece3"><b>card</b><i>#242c34</i></div>
  <div class="sw" style="background:#1a2129;color:#e8ece3"><b>sunken</b><i>#1a2129</i></div>
  <div class="sw" style="background:#38414b;color:#e8ece3"><b>rule</b><i>#38414b</i></div>
  <div class="sw" style="background:#4e5865;color:#e8ece3"><b>rule2</b><i>#4e5865</i></div>
  <div class="sw" style="background:#e8ece3;color:#0f1317"><b>ink</b><i>#e8ece3</i></div>
  <div class="sw" style="background:#9aa392;color:#0f1317"><b>muted</b><i>#9aa392</i></div>
</div></body></html>
