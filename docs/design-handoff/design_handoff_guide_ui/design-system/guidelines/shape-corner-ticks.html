<!-- @dsCard group="Shape" viewport="700x210" subtitle="The only thing that carries them is a plate" name="Corner ticks mean evidence" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="position:relative;width:230px;height:118px;background:var(--sunken);border:1px solid var(--rule2)">
  <span style="position:absolute;left:-1px;top:-1px;width:16px;height:16px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)"></span>
  <span style="position:absolute;right:-1px;top:-1px;width:16px;height:16px;border-right:2px solid var(--accent);border-top:2px solid var(--accent)"></span>
  <span style="position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent)"></span>
  <span style="position:absolute;right:-1px;bottom:-1px;width:16px;height:16px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)"></span>
  <span style="position:absolute;left:10px;bottom:9px;font:640 .66rem/1 var(--fs);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--card);padding:4px 7px">plate · commons</span>
</div>
<p class="note">A photograph without ticks has not been placed yet; a UI panel with them is lying about what it contains. No scrim, no graticule, and type never sits on the photograph.</p></body></html>
