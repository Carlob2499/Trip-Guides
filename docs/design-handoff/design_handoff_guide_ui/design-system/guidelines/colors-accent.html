<!-- @dsCard group="Colors" viewport="700x185" subtitle="Identity, accent-as-text, text-on-accent — three colours, never blended" name="The accent has three jobs" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#9c4421;color:#f0d2c7;height:92px"><b>--accent</b><i>#9c4421 · identity, never re-maps</i></div>
  <div class="sw" style="background:#f8faf3;color:#80371b;height:92px;border-color:#80371b"><b>--aink</b><i>#80371b light / #c78f78 dark</i></div>
  <div class="sw" style="background:#9c4421;color:#f0d2c7;height:92px"><b>--on-aink</b><i>#f0d2c7 · never re-maps</i></div>
</div>
<p class="note">Never hand-blend a fourth at a call site — a <code>color-mix</code> invented in a rule carries no contrast contract. Tint a ground no more than 18% toward the accent.</p></body></html>
