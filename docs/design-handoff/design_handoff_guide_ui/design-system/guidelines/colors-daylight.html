<!-- @dsCard group="Colors" viewport="700x150" subtitle="The three-surface ramp plus its two hairline weights" name="Daylight surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#dfe3d9;color:#171d24"><b>bg</b><i>#dfe3d9</i></div>
  <div class="sw" style="background:#f8faf3;color:#171d24"><b>card</b><i>#f8faf3</i></div>
  <div class="sw" style="background:#d2d7c8;color:#171d24"><b>sunken</b><i>#d2d7c8</i></div>
  <div class="sw" style="background:#bec6b2;color:#171d24"><b>rule</b><i>#bec6b2</i></div>
  <div class="sw" style="background:#a3ac98;color:#171d24"><b>rule2</b><i>#a3ac98</i></div>
  <div class="sw" style="background:#171d24;color:#f8faf3"><b>ink</b><i>#171d24</i></div>
  <div class="sw" style="background:#4e5747;color:#f8faf3"><b>muted</b><i>#4e5747</i></div>
</div></body></html>
