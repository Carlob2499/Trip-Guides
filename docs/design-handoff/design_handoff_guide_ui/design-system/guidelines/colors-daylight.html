<!-- @dsCard group="Colors" viewport="700x150" subtitle="The three-surface ramp plus its two hairline weights" name="Daylight surfaces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#e3e7dc;color:#0f141a"><b>bg</b><i>#e3e7dc</i></div>
  <div class="sw" style="background:#fbfcf6;color:#0f141a"><b>card</b><i>#fbfcf6</i></div>
  <div class="sw" style="background:#ced5c4;color:#0f141a"><b>sunken</b><i>#ced5c4</i></div>
  <div class="sw" style="background:#a9b39b;color:#0f141a"><b>rule</b><i>#a9b39b</i></div>
  <div class="sw" style="background:#8a9480;color:#0f141a"><b>rule2</b><i>#8a9480</i></div>
  <div class="sw" style="background:#0f141a;color:#fbfcf6"><b>ink</b><i>#0f141a</i></div>
  <div class="sw" style="background:#3c4534;color:#fbfcf6"><b>muted</b><i>#3c4534</i></div>
</div></body></html>
