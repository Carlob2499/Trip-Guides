<!-- @dsCard group="Brand" viewport="700x175" subtitle="There is no logo file. Set the name in type" name="The wordmark" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="display:flex;align-items:center;gap:14px">
  <span style="position:relative;display:block;width:26px;height:23px;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:22px solid var(--accent)"><span style="position:absolute;left:-3px;top:13px;display:block;width:6px;height:6px;background:var(--bg)"></span></span>
  <span style="font:700 2rem/1 var(--fs);letter-spacing:.24em;color:var(--ink);padding-left:.24em">WAYPOINT</span>
</div>
<div style="font:640 .625rem/1 var(--fs);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:12px">VERIFIED FIELD GUIDES</div>
<p class="note">The benchmark mark is a 26×23px oxide triangle built from borders, with a 6px <code>--bg</code> dot. Never draw or approximate a mark — the sources contain no logo.</p></body></html>
