<!-- @dsCard group="Shape" viewport="700x165" subtitle="0 on anything holding content. 999px on anything you press" name="Radius is binary" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row" style="align-items:center">
  <span style="display:flex;align-items:center;justify-content:center;width:150px;height:64px;background:var(--card);border:1px solid var(--rule);font:640 .75rem/1 var(--fs);letter-spacing:.08em">CONTAINER · 0</span>
  <span style="display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 26px;border-radius:999px;background:var(--accent);color:var(--on-aink);font:640 .75rem/1 var(--fs);letter-spacing:.08em">CONTROL · 999px</span>
  <span style="display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--rule2);color:var(--ink);font:640 .75rem/1 var(--fs);letter-spacing:.08em">PRESSABLE</span>
</div>
<p class="note">There is no 4px, 8px or 12px anywhere in this product. A rounded card is the single fastest way to make this design stop looking like itself.</p></body></html>
