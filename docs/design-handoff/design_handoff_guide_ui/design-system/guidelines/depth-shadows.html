<!-- @dsCard group="Depth" viewport="700x180" subtitle="Flat at rest. Evidence goes down, not up" name="Shadows are a response" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <span style="flex:1 1 120px;height:74px;background:var(--card);border:1px solid var(--rule);box-shadow:0 1px 3px rgba(16,20,24,.06);display:flex;align-items:flex-end;padding:9px;font:400 10px/1.3 var(--fs);color:var(--muted)">rest · 0 1px 3px .06</span>
  <span style="flex:1 1 120px;height:74px;background:var(--card);border:1px solid var(--rule);box-shadow:0 8px 28px rgba(16,20,24,.14);transform:translateY(-4px);display:flex;align-items:flex-end;padding:9px;font:400 10px/1.3 var(--fs);color:var(--muted)">hover · lift + −4px</span>
  <span style="flex:1 1 120px;height:74px;background:var(--card);border:1px solid var(--rule);box-shadow:0 -12px 34px rgba(16,20,24,.24);display:flex;align-items:flex-end;padding:9px;font:400 10px/1.3 var(--fs);color:var(--muted)">sheet · throws up</span>
  <span style="flex:1 1 120px;height:74px;background:var(--card);border:1px solid var(--rule);box-shadow:0 0 0 3px rgba(156,68,33,.22);display:flex;align-items:flex-end;padding:9px;font:400 10px/1.3 var(--fs);color:var(--muted)">focus · offsetless halo</span>
</div></body></html>
