<!-- @dsCard group="Brand" viewport="700x185" subtitle="Unicode and CSS primitives. No icon library, no emoji" name="The glyph set" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="display:flex;flex-wrap:wrap;gap:14px 22px;font:400 12px/1.4 var(--fs);color:var(--muted)">
  <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">✓</b><i style="font-style:normal;font-size:10px">checked</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">⚠</b><i style="font-style:normal;font-size:10px">unconfirmed</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">≈</b><i style="font-style:normal;font-size:10px">approximate</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">⠿</b><i style="font-style:normal;font-size:10px">drag</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">−</b><i style="font-style:normal;font-size:10px">collapse</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">＋</b><i style="font-style:normal;font-size:10px">add</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">☰</b><i style="font-style:normal;font-size:10px">menu</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">↗</b><i style="font-style:normal;font-size:10px">leaves the app</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">→</b><i style="font-style:normal;font-size:10px">navigate</i></span><span style="display:flex;flex-direction:column;align-items:center;gap:5px"><b style="font:400 22px/1 var(--fs);color:var(--ink)">▾</b><i style="font-style:normal;font-size:10px">unfolds in place</i></span>
</div>
<p class="note">Nothing has to load before a mark can render, and every glyph inherits the notation face and its tracking. No hand-drawn SVG icons exist in the product, and none should be added.</p></body></html>
