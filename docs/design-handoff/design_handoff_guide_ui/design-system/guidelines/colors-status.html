<!-- @dsCard group="Colors" viewport="700x175" subtitle="Three, and no more. Emergency red is never derived from a guide accent" name="Status pigments" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#396345;color:#fff;height:82px"><b>green</b><i>#396345 · done, confirmed</i></div>
  <div class="sw" style="background:#7f4a07;color:#fff;height:82px"><b>ochre</b><i>#7f4a07 · stale, unconfirmed</i></div>
  <div class="sw" style="background:#b3261e;color:#fff;height:82px"><b>crit</b><i>#b3261e · SOS only</i></div>
</div>
<p class="note">Dark equivalents: green #6aab76, ochre #d9923f, crit #ef8a83. Never a coloured dot without the word — the word is the accessible carrier.</p></body></html>
