<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div class="row" style="align-items:flex-end">
  <span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:4px;height:4px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">4</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:8px;height:8px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">8</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:12px;height:12px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">12</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:16px;height:16px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">16</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:20px;height:20px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">20</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:26px;height:26px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">26</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:34px;height:34px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">34</span></span><span style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="display:block;width:44px;height:44px;background:var(--accent)"></span><span style="font:400 10px/1 var(--fs);color:var(--muted);font-variant-numeric:tabular-nums">44</span></span>
</div>
<p class="note">Panel padding is <code>16px 20px 18px</code> open, <code>12px 16px</code> collapsed. Grid gap 16px, 18px above 1100px. Tap targets never below 44px; 52px for gloved or wet hands.</p></body></html>
