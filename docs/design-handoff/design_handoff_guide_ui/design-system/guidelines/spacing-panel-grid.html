<!-- @dsCard group="Spacing" viewport="700x215" subtitle="Stretch, don't stagger. Collapsed sorts after open" name="The panel grid" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}
*{box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sw{flex:1 1 90px;min-width:90px;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px 9px;border:1px solid var(--rule2)}
.sw b{font:700 10px/1.3 var(--fs);letter-spacing:.1em;text-transform:uppercase}
.sw i{font:400 10px/1.3 var(--fs);font-style:normal;opacity:.75;font-variant-numeric:tabular-nums}
.note{font:400 11px/1.45 var(--fs);color:var(--muted);margin:10px 0 0;max-width:62ch}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:16px;align-items:stretch">
  <span style="background:var(--card);border:1px solid var(--rule);padding:12px;height:96px;font:640 .625rem/1 var(--fs);letter-spacing:.22em;color:var(--accent)">OPEN</span>
  <span style="background:var(--card);border:1px solid var(--rule);padding:12px;height:96px;font:640 .625rem/1 var(--fs);letter-spacing:.22em;color:var(--accent)">OPEN</span>
  <span style="background:var(--card);border:1px solid var(--rule);padding:12px;height:96px;font:640 .625rem/1 var(--fs);letter-spacing:.22em;color:var(--accent)">OPEN</span>
  <span style="grid-column:1/-1;background:var(--card);border:1px solid var(--rule);padding:12px 16px;font:640 .625rem/1 var(--fs);letter-spacing:.22em;color:var(--muted)">COLLAPSED — sorts last, so no row is ever mixed</span>
</div>
<p class="note">Never let a collapsed panel share a row with an open one. Sort by state before you sort by order — that is the whole answer to "why is there dead space".</p></body></html>
