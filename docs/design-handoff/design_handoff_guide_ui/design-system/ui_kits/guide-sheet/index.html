<!-- @startingPoint section="Waypoint" subtitle="Masthead plate, spine rail, day scrubber, panel grid" viewport="1400x900" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guide sheet — Waypoint</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--aink);text-decoration:none}
a:hover{color:var(--accent)}
button{font-family:inherit}
</style></head><body data-field="day">
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="GuideSheet.jsx"></script>
<script type="text/babel" data-presets="react">

function MissingBundle() {
  return (
    <div style={{padding:"40px 30px",maxWidth:640}}>
      <span className="wp-kicker">Bundle not built</span>
      <h1 className="wp-headline" style={{margin:"7px 0 10px"}}>This kit composes the design system's components</h1>
      <p className="wp-body" style={{margin:0}}>
        It renders once <code>_ds_bundle.js</code> exists. The compiler writes that file when this
        project's file type is set to <b>Design System</b> in the Share menu — it bundles every
        component with a sibling <code>.d.ts</code> and exposes them on a namespace.
      </p>
      <p className="wp-body" style={{margin:"12px 0 0"}}>
        Until then, the working prototypes at the project root render the same screens without it:
        <br /><code>Waypoint Guide Desktop.dc.html</code> · <code>Waypoint Guide Mobile.dc.html</code> · <code>Waypoint Arrival.dc.html</code>
      </p>
    </div>
  );
}

const Ready = window.Waypoint && window.Waypoint.Panel && window.GuideSheet;
ReactDOM.createRoot(document.getElementById("root")).render(Ready ? <window.GuideSheet /> : <MissingBundle />);
</script>
</body></html>
