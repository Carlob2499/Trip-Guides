<!-- @dsCard group="Components" viewport="700x230" subtitle="Spine rail, day scrubber, and the thumb bar" name="Navigation" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}*{box-sizing:border-box}</style>
</head><body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const W = window.Waypoint || {};
function Demo() {
  if (!W.SpineRail) return <p style={{font:"400 12px/1.5 var(--fs)",color:"var(--muted)"}}>Bundle not built yet.</p>;
  const { SpineRail, DayScrubber, ThumbBar } = W;
  const [g, setG] = React.useState("Days");
  const [d, setD] = React.useState(4);
  const days = [1,2,3,4,5,6,7,8].map(n => ({ n, label: "Jul " + (7+n) }));
  return (
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <SpineRail stations={["Plan","Essentials","Transit","Days","Sights","Food","Sources","Field log","Tools"]} value={g} onChange={setG} />
      <DayScrubber days={days} value={d} onChange={setD} />
      <div style={{position:"relative",height:64,width:402,border:"1px solid var(--rule)"}}>
        <ThumbBar slots={[{name:"Days"},{name:"Food & shopping",label:"Food"},{name:"Journey"},{name:"Tools"}]} value="Days" onSelect={()=>{}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
