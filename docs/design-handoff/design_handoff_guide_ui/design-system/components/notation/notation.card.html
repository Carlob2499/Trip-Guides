<script type="text/babel" data-presets="react">
const W = window.Waypoint || {};
function Demo() {

  const { Stamp, FlagChip, ProvenanceDot, Reading, GapBlock } = W;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <p className="wp-body" style={{margin:0}}>Airport Limousine 6002 is ₩17,000 per person<ProvenanceDot /> and runs every 15 minutes.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
        <FlagChip kind="approx" onClick={()=>{}} />
        <FlagChip kind="unconfirmed" onClick={()=>{}} />
        <FlagChip kind="checked" label="confirmed" />
        <Stamp>✓ checked 18 jul 2026</Stamp>
        <Stamp tone="ochre">⚠ ageing — 12 days left</Stamp>
      </div>
      <Reading>37.57°N 126.98°E</Reading>
      <GapBlock body="Post-match dinner times could not be pinned." whatToDo="What to do instead — call Gobang, 042-863-2104, before you go in" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
