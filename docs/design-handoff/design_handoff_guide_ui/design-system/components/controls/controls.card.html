<!-- @dsCard group="Components" viewport="700x220" subtitle="Pills, status stamps, and the segmented switch" name="Controls" -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--fs);padding:18px 20px}*{box-sizing:border-box}</style>
</head><body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const W = window.Waypoint || {};
function Demo() {
  if (!W.Button) return <p style={{font:"400 12px/1.5 var(--fs)",color:"var(--muted)"}}>Bundle not built yet.</p>;
  const { Button, StatusStamp, Segmented } = W;
  const [mode, setMode] = React.useState("World");
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
        <Button>Open this sheet →</Button>
        <Button variant="secondary">Tools</Button>
        <Button variant="quiet">Skip</Button>
        <Button variant="critical">SOS</Button>
        <Button size="lg">＋ Add expense</Button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
        <StatusStamp status="complete" />
        <StatusStamp status="progress" />
        <StatusStamp status="upcoming" />
        <Segmented options={["World","Table"]} value={mode} onChange={setMode} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
