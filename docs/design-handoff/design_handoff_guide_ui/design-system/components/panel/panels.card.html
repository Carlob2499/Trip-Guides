      <Panel kicker="FIELD NOTE" title="Getting around" onToggle={() => {}}>

      <Panel kicker="EMERGENCY" title="One source, two doors" stamp="✓ checked 18 jul 2026" onToggle={() => {}}>

      <Panel kicker="TOKYO" collapsed onToggle={() => {}} />
