name: Recert (self-freshening)

# DETECTION ONLY. This workflow finds what has gone stale and hands each guide to change.yml; it
# no longer runs an agent of its own. The recert agent, its prompt and its landing logic were the
# change lifecycle wearing a third costume — same edit, same continuity sweep, same verify loop —
# so they moved there and this kept the half nothing else does: noticing.
#
# (Name kept: "recert" is what the repo, the docs and the skill call this. The file is the
# detector now, but the concept is unchanged.)
#
# Two jobs:
#   audit    the weekly no-LLM accuracy report — dead links, missing photos, third-party API
#            health, stale stamps → one tracking issue, updated in place. Reports only.
#   detect   every guide with a fact past its shelf life → one change.yml run each, source
#            `staleness`. Those runs ALWAYS open a PR for a human, never auto-merge: nobody asked
#            for them (the rule is enforced in scripts/pipeline/plan.mjs, not here).
#
# Drafts are the research pass's job, not this one — check-staleness skips them.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — fx facts (7-day shelf life) are caught within the week
  workflow_dispatch:
    inputs:
      slug:
        description: "Recert just this guide (leave blank to sweep ALL stale guides)."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  actions: write # dispatches change.yml per stale guide

jobs:
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run content audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The Places canary verifies the venue verifier is still wired — key valid, SKU access
          # intact. It skips cleanly when unset, so a fork without the secret stays green.
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: node scripts/audit/run-audit.mjs

  detect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # One change run per stale guide, so each lands its own reviewable PR — a single sweeping
      # PR across several guides would be unreviewable and unrevertable per-guide.
      - name: Dispatch a change run per stale guide
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: node scripts/recert.mjs --dispatch
