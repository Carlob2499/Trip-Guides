name: Tests

on:
  pull_request:
    paths-ignore: [learnings/**, guides-intake/**, "**.md"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:invariants
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  z06-permission-smoke:
    if: github.head_ref == 'proof/z06-cancellation-grace'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Prove write-token boundary before cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 90 --repo "$GITHUB_REPOSITORY" --body "<!-- waypoint-v2-z06:${GITHUB_RUN_ID}:permission-smoke -->
          Z06 permission smoke passed in Tests run ${GITHUB_RUN_ID}; actions:write and issues:write job registered."
