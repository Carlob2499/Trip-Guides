name: Tests

# Manual diagnostic copy of the deterministic code gate. Pull-request enforcement moved to the
# always-reporting Required gate so docs/content PRs cannot leave a path-filtered required status
# pending, and code PRs do not pay for the same full suite twice. deploy.yml still runs the safety
# set on pushes to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # scripts/fetch-media.mjs downloads the guides' photographs into the build so no reader
      # ever hotlinks Wikimedia. Without a cache every CI run re-downloads all of them, which
      # is slow here and rude to Commons — the exact rate-limit concern that made the old code
      # hotlink at read time in the first place. Keyed on the guide content, so the fetch runs
      # again only when a guide actually changes a photograph.
      - name: Cache guide photographs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .media-cache
          key: media-${{ hashFiles('src/content/guides/**/*.json') }}
          restore-keys: |
            media-
      - run: npm ci
      - run: npm run check:invariants
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
