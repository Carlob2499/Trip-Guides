name: Tests

# Runs the Vitest suite + the Astro/TS type check + the coverage gate on every PR
# (and on pushes to main) so a broken test, a type error, OR a coverage regression
# in the pure-logic core blocks the merge instead of only surfacing later in the
# Pages deploy. Deploy.yml also runs `npm test`, but only after a push to main.
#
# paths-ignore may only skip paths `eslint .` does not lint (#39): docs/** left this
# list because eslint DELIBERATELY lints docs/mockups/*.mjs, so a docs-only push could
# turn main's lint red with every CI signal green — the failure then landed on the next
# unrelated src/ commit. Md-only commits still skip via "**.md".
# scripts/__tests__/lint-ci-scope.test.mjs asserts lint scope ⊆ CI scope and fails on
# the commit that creates a divergence; change either list only in step with the other.
on:
  pull_request:
    paths-ignore: [learnings/**, guides-intake/**, "**.md"]
  push:
    branches: [main]
    paths-ignore: [learnings/**, guides-intake/**, "**.md"]

permissions:
  contents: read

# M1: cancel a superseded run for the same ref — a rapid follow-up push shouldn't burn CI
# minutes finishing a run whose result no longer matters.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gates the class astro check and Vitest structurally cannot see: unused bindings,
      # unreachable code, accidental globals. Its first pass found a live ReferenceError in
      # graduate-guide.mjs that 832 green tests could not — the CLI called an isValidSlug the
      # module only re-exported and never imported. Wired in only once it was at zero, so a
      # red run always means a new regression.
      - run: npm run lint
      - run: npm run typecheck
      # A5: `npm test` + `npm run coverage` both ran the full vitest suite (coverage is a
      # superset — it runs every test AND instruments it) — dropped the bare run since
      # coverage already exercises every test.
      # Gates only src/lib/** + every feature's model/ silo (see vitest.config.ts) —
      # the pure-logic core the project actually invests test coverage in. UI glue
      # (DOM IIFEs, untestable as-is per CLAUDE.md's sealed-silo split) is measured
      # but never gated, so this never blocks on the intentional 0% there.
      - run: npm run coverage
