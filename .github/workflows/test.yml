name: Tests

# Manual diagnostic copy of the deterministic code gate. Pull-request enforcement moved to the
# always-reporting Required gate so docs/content PRs cannot leave a path-filtered required status
# pending, and code PRs do not pay for the same full suite twice. deploy.yml still runs the safety
# set on pushes to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:invariants
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
