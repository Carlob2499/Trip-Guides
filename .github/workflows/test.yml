name: Tests

on:
  pull_request:
    paths-ignore: [learnings/**, guides-intake/**, "**.md"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:invariants
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  z06-cancellation-proof:
    if: github.head_ref == 'proof/z06-cancellation-grace'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Announce cancellation proof start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 90 --repo "$GITHUB_REPOSITORY" --body "<!-- waypoint-v2-z06:${GITHUB_RUN_ID}:start -->
          Z06 real cancellation proof started in Tests run ${GITHUB_RUN_ID}."

      - name: Simulated agent requests cancellation and remains active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'partial simulated agent output\n' > "$RUNNER_TEMP/agent-output.log"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          sleep 60

      - name: Always control-plane witness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 90 --repo "$GITHUB_REPOSITORY" --body "<!-- waypoint-v2-z06:${GITHUB_RUN_ID}:always -->
          Z06 post-cancellation always() control-plane step ran."

      - name: Cancelled escalation witness
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 90 --repo "$GITHUB_REPOSITORY" --body "<!-- waypoint-v2-z06:${GITHUB_RUN_ID}:escalate -->
          Z06 PASS witness: cancelled() escalation step ran inside GitHub's cancellation grace window."
