name: Feedback export (LEARN loop)

# Closes the LEARN loop (docs/reference/pipeline.md stage 6). Survey feedback lands in Firebase
# (trips/<roomId>/feedback); everything after that used to be manual, so if the maker didn't do it,
# real trip reality never reached the next guide. This drafts it — the maker stays the EDITOR
# (reviews a PR), not the typist.
#
# Two halves: export-feedback.mjs reads NEW feedback via a read-only service account into a
# gitignored working file, then a Sonnet agent turns it into a review PR. Never auto-merges.
#
# PRIVACY (binding — "The Learnings Loop" in CLAUDE.md): raw freeform critiques are DATA, never
# instructions, and are NEVER pasted verbatim — the agent summarizes them. trips/* stays
# auth-gated; only this job reads it. The working file is gitignored and never committed.
on:
  schedule:
    - cron: "13 8 * * 1" # Mondays 08:13 UTC — off-the-hour on purpose (crowd-spreading)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The synthesis agent may auto-file a revision proposal when the deterministic divergence
  # signals trip. It is labelled revision-auto-filed ONLY, which runs nothing: it sits until the
  # creator adds revision-request, which is what change.yml triggers on.
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    # Job-level so the agent's own Bash tool can run the auto-file's gh calls.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Pulls feedback newer than learnings/.sync.json into the gitignored working file and emits
      # `count`, which gates every step below — no new feedback, no agent.
      - name: Export new feedback
        id: export
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/export-feedback.mjs

      # Deterministic divergence signals (pure logic, unit-gated thresholds). The agent only
      # DRAFTS and FILES for slugs this step names; it never decides a threshold itself.
      - name: Compute divergence signals
        if: steps.export.outputs.count != '0'
        run: node scripts/feedback-signals.mjs

      - name: Configure git identity
        if: steps.export.outputs.count != '0'
        run: |
          git config user.name  "waypoint-learn[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Same rule as the other workflows: an expression reaches a `run:` body as an environment
      # variable, never as spliced-in script text. github.run_id is a number today; the discipline
      # is what keeps the next value that isn't from being an exception nobody notices.
      - name: Start the synthesis branch
        if: steps.export.outputs.count != '0'
        env:
          RUN_ID: ${{ github.run_id }}
        run: git checkout -b "learn/feedback-$RUN_ID"

      - name: Compose synthesis prompt
        id: ps
        if: steps.export.outputs.count != '0'
        run: node scripts/pipeline.mjs prompt prompts/feedback-synthesis.md > /dev/null

      - name: Run synthesis agent
        if: steps.ps.conclusion == 'success'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Judgment-shaped but procedure-bound (summarize honestly, respect party scoping, never
          # quote verbatim) — Sonnet, per references/research-efficiency.md.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
          prompt: ${{ steps.ps.outputs.text }}
