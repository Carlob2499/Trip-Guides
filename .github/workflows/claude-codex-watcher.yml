name: Claude ↔ Codex review watcher

# THE CLAUDE HALF of the reciprocal Claude<->Codex PR review loop (Waypoint work order,
# 2026-08-23). Codex runs its OWN independent, external watcher against this repo's PRs —
# nothing in this file configures, triggers, or is called by Codex's side. What this workflow
# does is react to Codex's side of the protocol: when a PR's bounded `codex-review-next`
# section says CLAUDE_ACTION_REQUIRED: yes at the PR's CURRENT head, fix exactly what the work
# order describes, push to the SAME PR branch, and mark the new head ready for Codex's next
# pass. See docs/reference/pipeline.md's "workflow set" table and CONTEXT.md's Decisions entry
# for the full contract; scripts/codex-watcher.mjs carries every behavioral rule as pure,
# independently tested functions — this file is intentionally thin.
#
# TRUST MODEL, revision 4 (CodeQL finding on revision 3, PR #78, 2026-08-23 — see CONTEXT.md's
# Decisions entry for the full revision history). Revision 3 dropped `pull_request_target` for
# `workflow_run`, per Codex's correction — necessary, but not sufficient on its own: CodeQL's
# "Checkout of untrusted code in a privileged context" query correctly kept firing, because
# `workflow_run` is EXACTLY as dangerous as `pull_request_target` if the job that checks out
# and executes PR-controlled code (npm ci, the agent) is the SAME job that holds
# `contents: write` — the ambient GITHUB_TOKEN is write-capable for that whole job regardless
# of which individual step's `env:` happens to reference it; scoping env vars per-step (what
# revision 3 did) is a real mitigation but not one CodeQL's static model — or the underlying
# threat model — credits, because nothing stops a compromised dependency from reading the
# runner's ambient token directly. The fix has to be a real GitHub Actions JOB boundary:
#   - `claude-codex-signal.yml` — UNPRIVILEGED. Triggers on `pull_request: edited`
#     (Codex's PR-body edit). No secrets, no write token, does nothing but exist and
#     complete. Nothing it computes is trusted by THIS workflow.
#   - THIS workflow's `validate` job — triggers on `workflow_run` (fires when the signal
#     workflow completes) + a schedule fallback + workflow_dispatch, all of which are
#     unconditionally default-branch-pinned (no PR-ref concept at all). Permissions are
#     `contents: read, pull-requests: read` — genuinely read-only at the JOB level, so the
#     ambient token cannot push even if something in the checked-out PR content tried. This
#     is the ONLY job that ever checks out PR content (pinned to the exact sha Codex
#     reviewed, into its own `pr-workspace/` path, fork PRs refused by `isEligible` before
#     anything else runs), runs `npm ci` against it, or runs the isolated fix agent (whose
#     container gets ONLY `CLAUDE_CODE_OAUTH_TOKEN`, never a GitHub credential). On success it
#     strips scratch state (`.git`, `.codex-work-order.md`) and uploads the validated tree —
#     files only, as a build artifact — for the next job to pick up. It never has a
#     write-capable credential to leak in the first place.
#   - THIS workflow's `publish` job — `contents: write, pull-requests: write`. It NEVER checks
#     out or executes PR content: it downloads the artifact `validate` produced (or finds none,
#     if `validate` wasn't eligible or failed, and cleanly does nothing), checks out a FRESH
#     control-plane copy pinned to the pre-fix sha, copies the artifact's files onto it via
#     `rsync` (never merging git history), and does only deterministic `git add/commit/push` —
#     the only job, and the only step within it, that ever holds a push-capable credential, and
#     it never runs a single line of PR-controlled code.
on:
  workflow_run:
    workflows: ["Claude ↔ Codex review signal"]
    types: [completed]
  schedule:
    # Modest fallback only — the primary trigger is the signal workflow above, which fires the
    # moment Codex's bot edits a PR body. Off-the-hour, matching this repo's other schedule
    # crons (recert.yml, pretrip-check.yml, feedback-export.yml). schedule/workflow_dispatch/
    # workflow_run runs are ALWAYS the default branch's own copy of this file, so they need no
    # special handling for the trust model above.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to check (manual/test invocation)."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── discover: which PR number(s) does THIS firing need to check? ────────────────────────
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      # No explicit `ref:` — `workflow_run`/`schedule`/`workflow_dispatch` all check out the
      # DEFAULT branch unconditionally (there is no PR-ref concept for any of these triggers),
      # so the candidate-listing logic below is always the trusted copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List the PR(s) this firing should check
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Only populated when the signal run was itself a pull_request event on a same-repo
          # (non-fork) PR — GitHub's own doing, not something this workflow computes. Treated
          # as a HINT to re-verify below (via `check`'s own live gh pr view + isCrossRepository
          # check), never as ground truth on its own — a fork PR simply yields no number here,
          # which is defense in depth on top of the explicit fork check, not a substitute for it.
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$RUN_CONCLUSION" != "success" ]; then
              echo "[codex-watcher] signal run did not succeed (conclusion: $RUN_CONCLUSION) — nothing to check." >&2
              echo "prs=[]" >> "$GITHUB_OUTPUT"
            elif [ -z "$RUN_PR_NUMBER" ] || [ "$RUN_PR_NUMBER" = "null" ]; then
              echo "[codex-watcher] signal run had no associated same-repo PR (fork PR, or unavailable) — nothing to check." >&2
              echo "prs=[]" >> "$GITHUB_OUTPUT"
            else
              echo "prs=[$RUN_PR_NUMBER]" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # DISPATCH_PR is free-text input from whoever ran this manually — validate it's a
            # bare integer before it goes anywhere near a shell/JSON string.
            if ! [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]; then
              echo "[codex-watcher] --pr must be a plain PR number, got: $DISPATCH_PR" >&2
              exit 1
            fi
            echo "prs=[$DISPATCH_PR]" >> "$GITHUB_OUTPUT"
          else
            # Scheduled fallback: the SAME eligibility function used everywhere else decides
            # which open, same-repo PRs actually have unprocessed, current-head work orders —
            # so this can never re-execute one the event trigger already handled, and never
            # touches a fork PR or a stale-head work order.
            CANDIDATES=$(node scripts/codex-watcher.mjs list-candidates)
            echo "prs=$CANDIDATES" >> "$GITHUB_OUTPUT"
          fi

  # ── validate: per-PR, READ-ONLY. The only job that ever checks out PR content or runs the
  # agent — CodeQL's "privileged context" concern (job holds a write-capable token while
  # checking out/executing PR-controlled code) cannot apply here because this job's own
  # `permissions:` cap the ambient token to read-only, full stop. ──────────────────────────
  validate:
    needs: discover
    if: needs.discover.outputs.prs != '[]' && needs.discover.outputs.prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.discover.outputs.prs) }}
    # ONE job per PR NUMBER, ever in flight, shared with `publish` below (same group name) —
    # this is what makes "no two Claude watcher jobs for the same PR run concurrently"
    # mechanical rather than assumed, across BOTH stages and regardless of what triggered them.
    # Matches the guide-<slug> convention research-pass-v2.yml and change.yml already use.
    concurrency:
      group: codex-watcher-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ matrix.pr }}
    steps:
      # TRUSTED CONTROL PLANE — no explicit `ref:`, so this checkout is always the default
      # branch (workflow_run/schedule/workflow_dispatch have no PR-ref concept at all),
      # regardless of what PR #<matrix.pr> itself changed. Every decision-making step below
      # (eligibility, prompt composition, section building, the PR body write) runs from THIS
      # checkout, at repo root — never from PR-controlled content.
      - name: Checkout the TRUSTED control plane (default branch only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Ground truth, never the (possibly-stale-by-now) event payload: re-fetch the PR live.
      # isCrossRepository is gh's own fork check — a fork PR is refused here, structurally,
      # before anything else in this job runs. Every one of the work order's 8 eligibility
      # conditions is decided by ONE function (scripts/codex-watcher.mjs's isEligible) so
      # there is a single source of truth, independently unit-tested. This step's token is
      # read-only in effect (a `gh pr view` call) and is the ONLY credential present anywhere
      # near PR content until the final push step, far below.
      - name: Check eligibility against LIVE PR state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/codex-watcher.mjs check --pr "$PR"

      - name: Not eligible — clean no-op
        if: steps.check.outputs.eligible != 'true'
        # A block scalar, not a one-line `run: echo "... #$PR ..."` — YAML treats a bare
        # ` #` in an UNQUOTED plain scalar as a comment start and truncates the value right
        # there (observed live: the step failed with "unexpected EOF looking for matching
        # quote" because everything from ` #$PR` onward was silently dropped by the parser).
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "[codex-watcher] PR #$PR — not eligible: $REASON"

      # ── everything below runs ONLY when eligible ──────────────────────────────────────
      # PR-CONTROLLED CONTENT, pinned to the EXACT commit Codex reviewed (never the floating
      # branch head, which could have moved between the check above and this checkout) — and
      # in its OWN path, never overwriting the trusted root checkout. No credential is passed
      # to this step; `actions/checkout` handles its own transient auth internally and
      # `persist-credentials: false` means nothing is left behind for a later step to find.
      - name: Checkout the PR's exact reviewed content (untrusted, credential-free)
        if: steps.check.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.check.outputs.head }}
          path: pr-workspace
          persist-credentials: false

      # The work order rides the DATA channel as a named file (this repo's own prompt-safety
      # rule, scripts/pipeline/prompt.mjs's header comment) — Codex's text is never
      # concatenated into the prompt template itself, only referenced by path. Written into
      # pr-workspace (where the agent's mount is rooted) so the agent can read it; excluded
      # from collection below so it can never reach a real commit.
      - name: Write the work order as a file the agent reads (never inlined into the prompt)
        if: steps.check.outputs.eligible == 'true'
        run: |
          node -e '
            const r = JSON.parse(require("child_process").execSync(`node scripts/codex-watcher.mjs check --pr ${process.env.PR}`, {encoding:"utf8"}));
            require("fs").writeFileSync("pr-workspace/.codex-work-order.md", (r.workOrderText || "") + "\n");
          '

      # TRUSTED: composed from the control-plane's own (default-branch) prompts/codex-work-order.md
      # — a PR cannot rewrite the instructions its own fix agent is given.
      - name: Compose the agent prompt
        if: steps.check.outputs.eligible == 'true'
        id: prompt
        env:
          WP_PR: ${{ matrix.pr }}
          WP_WORK_ORDER_ID: ${{ steps.check.outputs.work_order_id }}
        run: node scripts/pipeline.mjs prompt prompts/codex-work-order.md > /dev/null

      - name: Replace the PR workspace's history with an unprivileged local sandbox
        if: steps.check.outputs.eligible == 'true'
        working-directory: pr-workspace
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      # EXIT INTEGRITY (same wrapper research-pass-v2.yml's agent steps use): a Claude process
      # that exits nonzero must be recorded as a failed step, never masked by a `| tee` that
      # only reports ITS OWN exit code. No GitHub credential of any kind reaches this
      # container — only CLAUDE_CODE_OAUTH_TOKEN.
      - name: Run the fix agent (isolated — no GitHub credential reaches this container)
        if: steps.check.outputs.eligible == 'true'
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: claude-sonnet-5
          WP_EFFORT: high
          WP_TOOLS: Read(//workspace/**),Edit(//workspace/**),Glob,Grep
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-logged-command.sh" "$RUNNER_TEMP/agent-output.log" \
            docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE/pr-workspace",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      # CREDENTIAL-FREE by construction (this job's own permissions, not step discipline):
      # PR-controlled package.json scripts, test code, and build tooling run here. A gate
      # failure fails this step (bash's default -e) and nothing downstream — the artifact
      # upload below, and everything in `publish` — ever runs.
      - name: Run the repo's gates against the agent's result
        if: steps.check.outputs.eligible == 'true' && steps.agent.outcome == 'success'
        id: gates
        working-directory: pr-workspace
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # Strip every trace of PR-controlled git history and scratch state before the artifact
      # ever leaves this job: `.git` here is the historyless agent sandbox from the step
      # above (never the real thing — `publish` gets a REAL history from its own fresh
      # checkout), and `.codex-work-order.md` must never reach a commit (Codex P1 finding) —
      # excluded here as the primary defense, with the `publish` job's own rsync exclude and
      # `.gitignore` as further-defense-in-depth layers, not the only line. The metadata file
      # carries only already-validated, already-typed identifiers (a commit sha, a branch
      # name, a work-order id) — never anything PR-authored/free-form.
      - name: Strip scratch state and write metadata for the publish job
        if: steps.check.outputs.eligible == 'true' && steps.gates.outcome == 'success'
        env:
          META_HEAD: ${{ steps.check.outputs.head }}
          META_HEAD_REF: ${{ steps.check.outputs.head_ref }}
          META_WORK_ORDER_ID: ${{ steps.check.outputs.work_order_id }}
        run: |
          rm -rf pr-workspace/.git
          rm -f pr-workspace/.codex-work-order.md
          node -e '
            const fs = require("fs");
            fs.writeFileSync("pr-workspace/.codex-meta.json", JSON.stringify({
              head: process.env.META_HEAD,
              headRef: process.env.META_HEAD_REF,
              workOrderId: process.env.META_WORK_ORDER_ID,
            }));
          '

      # The ONLY thing that crosses the job boundary — files, never a credential, never git
      # history. `publish` (a separate job, separate runner, no filesystem in common) picks
      # this up by name. `if-no-files-found: error` means a broken exclude/path here fails
      # loudly instead of silently uploading nothing.
      - name: Upload the validated file tree for the publish job
        if: steps.check.outputs.eligible == 'true' && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-pr-${{ matrix.pr }}
          path: pr-workspace
          retention-days: 1
          if-no-files-found: error

  # ── publish: per-PR, the ONLY job with a write-capable credential. It never checks out or
  # executes PR content — only files an already-gated `validate` run produced. ──────────────
  publish:
    needs: [discover, validate]
    if: needs.discover.outputs.prs != '[]' && needs.discover.outputs.prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.discover.outputs.prs) }}
    # SAME group name as `validate` — a scheduled-fallback run's publish stage and an
    # event-triggered run's publish stage for the same PR queue behind each other exactly
    # like their validate stages do; this is one shared lock across both stages of a run.
    concurrency:
      group: codex-watcher-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ matrix.pr }}
    steps:
      # TRUSTED CONTROL PLANE, default-branch-pinned — needed for scripts/codex-watcher.mjs's
      # build-section/update-pr, which this job runs at the end. Never touches PR content.
      - name: Checkout the TRUSTED control plane (default branch only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No artifact means `validate` was ineligible, found no changes, or failed a gate —
      # any of those is a clean no-op here, never an error. continue-on-error is scoped to
      # exactly this one step; every step after it is explicitly gated on its outcome.
      - name: Download the validated file tree (if validate produced one)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-pr-${{ matrix.pr }}
          path: validated

      - name: Nothing to publish — clean no-op
        if: steps.download.outcome != 'success'
        run: |
          echo "[codex-watcher] PR #$PR — no validated artifact (not eligible, no changes, or a gate failed upstream)."

      - name: Read the validated tree's metadata
        if: steps.download.outcome == 'success'
        id: meta
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("validated/.codex-meta.json", "utf8"));
            const out = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            out.write(`head=${m.head}\n`);
            out.write(`head_ref=${m.headRef}\n`);
            out.write(`work_order_id=${m.workOrderId}\n`);
          '

      # A FRESH, UNTOUCHED control-plane checkout, pinned to the pre-fix commit `validate`
      # reviewed — no PR-controlled script has EVER run against this directory's `.git` (this
      # job never checked out PR content at all), so nothing could have planted a hook/config
      # here that the credentialed step below might trigger.
      - name: Checkout a fresh control-plane copy for the push
        if: steps.download.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.meta.outputs.head }}
          path: push-workspace
          persist-credentials: false

      # Copies FILES only — the artifact already has no `.git` and no `.codex-work-order.md`
      # (stripped in `validate`), and the excludes here are further defense in depth, not the
      # only line, matching this file's existing layered-exclusion pattern.
      - name: Copy the validated file tree onto the fresh checkout
        if: steps.download.outcome == 'success'
        run: |
          rsync -a --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.astro' \
            --exclude='coverage' --exclude='.codex-work-order.md' --exclude='.codex-meta.json' \
            validated/ push-workspace/

      # PARTIAL OR UNVALIDATED OUTPUT IS NEVER PUSHED (nothing reaches this job unless
      # `validate`'s gates already passed), and this step is pure git plumbing — no npm/
      # build/test ever runs in this job at all. This is the ONLY step in the ONLY job that
      # holds a push-capable credential.
      - name: Commit and push (the only step with a write-capable credential)
        if: steps.download.outcome == 'success'
        id: finish
        working-directory: push-workspace
        env:
          PUSH_TOKEN: ${{ github.token }}
          WORK_ORDER_ID: ${{ steps.meta.outputs.work_order_id }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
        run: |
          if git diff --quiet; then
            echo "[codex-watcher] agent made no file changes — nothing to push." >&2
            exit 1
          fi
          DIFFSTAT=$(git diff --shortstat | sed 's/^ *//')
          echo "diffstat=$DIFFSTAT" >> "$GITHUB_OUTPUT"
          git config user.name "waypoint-codex-watcher[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(codex-watcher): address work order $WORK_ORDER_ID"
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git push origin "HEAD:$HEAD_REF"
          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Every field here is CONTROL-PLANE composed, deterministic text — never the agent's own
      # free-form output pasted verbatim — so nothing the agent wrote can forge a marker or
      # otherwise corrupt the bounded-section protocol on the next parse. Runs from repo ROOT
      # (the trusted default-branch checkout), using its own copy of codex-watcher.mjs.
      #
      # SCRIPT-INJECTION HYGIENE (CodeQL, PR #78 live finding): every ${{ steps.*.outputs.* }}
      # a script needs is assigned through `env:` and read back as a shell variable — NEVER
      # interpolated directly into `run:` text. GitHub substitutes `${{ }}` into the script
      # BEFORE the shell parses it, so a value containing shell metacharacters would otherwise
      # execute as code, not data — `env:` assignment is immune because the shell, not the
      # expression engine, is what does the (safe, literal) variable expansion.
      - name: Mark the new HEAD ready for Codex
        if: steps.finish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ORDER_ID: ${{ steps.meta.outputs.work_order_id }}
          NEW_HEAD: ${{ steps.finish.outputs.new_head }}
          DIFFSTAT: ${{ steps.finish.outputs.diffstat }}
        run: |
          node scripts/codex-watcher.mjs build-section \
            --head "$NEW_HEAD" \
            --work-order "$WORK_ORDER_ID" \
            --summary "Addressed Codex work order $WORK_ORDER_ID. $DIFFSTAT" \
            --validation "lint, typecheck, test, and build all passed in a read-only (no write-token) job before a separate, write-capable job that never checked out PR content pushed the validated tree." \
            --uncertainty "None beyond what Codex's next independent review of this head surfaces." \
            > /tmp/claude-section.txt
          node scripts/codex-watcher.mjs update-pr --pr "$PR" --section-file /tmp/claude-section.txt
