name: Deploy intake worker

# Deploys the site's backend Worker (worker/) to Cloudflare (W5). INERT until configured: if the
# CLOUDFLARE_API_TOKEN secret isn't set, every step is skipped and the job passes green — so this
# can sit in the repo doing nothing until the owner opts in (create a free Cloudflare account → add
# the API token secret). The site on GitHub Pages is untouched either way.
#
# NO `paths:` FILTER, deliberately. The bundle is not worker/ — esbuild follows the Worker's
# imports out into the repo and pulls in scripts/intake-proxy.mjs, scripts/intake-schema.mjs,
# scripts/worker-api.mjs, scripts/lib/slug.mjs and src/lib/modify-schema.mjs. A filter has to list
# every one of those, and it silently stops listing them the moment an import is added — which is
# how a security fix to the deployed auth gate gets written, merged, and never deployed, with a
# green pipeline the whole way. Every push to main redeploys; a no-op deploy costs seconds and
# nothing else, and "the fix is live" stops depending on a list somebody has to remember.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Is Cloudflare configured?
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — the zero-click proxy stays off. Add the secret to enable it."
          fi
      - if: steps.cfg.outputs.go == 'true'
        uses: actions/checkout@v7
      - if: steps.cfg.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.go == 'true'
        run: npm ci
      # wrangler-action installs + runs wrangler; workingDirectory points it at worker/wrangler.toml.
      # The Worker's `import "../scripts/intake-proxy.mjs"` bundles fine — esbuild follows it out of
      # worker/ into the repo (that's why npm ci above installs zod for the bundle), along with
      # scripts/worker-api.mjs, scripts/lib/slug.mjs and src/lib/modify-schema.mjs. That reach is
      # exactly why this workflow has no `paths:` filter — see the header.
      - if: steps.cfg.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional but recommended: with an account id, wrangler skips its /memberships lookup
          # entirely. That lookup needs a User→Memberships:Read permission the "Edit Cloudflare
          # Workers" token template does NOT grant, and it's a common source of confusing auth
          # failures. Unset → wrangler falls back to the lookup (previous behavior).
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v4 defaults to wrangler v4 already; the pin stays explicit so the CLI major
          # can never drift with an action bump (CLAUDE.md: explicit over ambient).
          wranglerVersion: "4"
          workingDirectory: worker
          # `--config` stays explicit even though the vestigial root `wrangler.jsonc` (an earlier
          # hosting experiment that once won config discovery and tried to deploy the whole site)
          # has been deleted — "explicit over ambient" (CLAUDE.md Boundary Check #4): any future
          # stray config must never silently repoint this deploy again.
          command: deploy --config wrangler.toml
