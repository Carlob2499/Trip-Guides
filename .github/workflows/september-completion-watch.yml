name: September completion watch

# Temporary September operator helper.
#
# This workflow does two bounded things that the external completion operator cannot safely
# synthesize from a chat session alone:
#   1. once main becomes protected, dispatch the existing zero-model protected-landing proof once;
#   2. on/after Sep 2, dispatch the exact frozen Kumamoto r3 acceptance once, then re-dispatch
#      ONLY a durably recorded usage-limit interruption at most once per hourly wake.
#
# It never edits research artifacts, extends caps, retries quality failures, changes the selector,
# publishes, cuts over V2, or repairs pipeline code. The durable V2 run state remains authoritative.
# Remove this workflow after the September completion program reaches a terminal state.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: september-completion-watch
  cancel-in-progress: false

jobs:
  protected-main-proof:
    name: Protected-main proof watch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the zero-model proof once protection is live
        shell: bash
        run: |
          set -euo pipefail

          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
          if [[ "$protected" != "true" ]]; then
            echo "main is not protected yet; issue #130 remains owner/settings blocked."
            exit 0
          fi

          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow protected-landing-live-proof.yml \
            --branch main \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt)"

          active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
          if [[ "$active" -gt 0 ]]; then
            echo "A protected-main proof is already active; not dispatching a competing copy."
            exit 0
          fi

          passed="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")"
          if [[ "$passed" -gt 0 ]]; then
            echo "Protected-main live proof already passed; no repeat."
            exit 0
          fi

          attempted="$(jq 'length' <<<"$runs")"
          if [[ "$attempted" -gt 0 ]]; then
            echo "A prior protected-main proof completed without success; refusing blind hourly retries."
            exit 0
          fi

          echo "main is protected and no proof has run; dispatching the existing zero-model live proof."
          gh workflow run protected-landing-live-proof.yml --repo "$GITHUB_REPOSITORY" --ref main

  kumamoto-acceptance:
    name: Kumamoto r3 acceptance / usage-limit watch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NOT_BEFORE: "2026-09-02"
      CANDIDATE_REF: acceptance/v2-kumamoto-20260902-r3
      CANDIDATE_SHA: 56e513000792bc71bf4e18c0a0909724fe5cebac
      ACCEPTED_BASE: 57e320535d1cb6e861a5001f8c26cc718dcfd93d
      ENGINE: ${{ vars.WAYPOINT_RESEARCH_ENGINE }}
    steps:
      - name: Check out current authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh date, authority, selector, and drift firewall
        id: firewall
        shell: bash
        run: |
          set -euo pipefail

          today="$(TZ=America/New_York date +%F)"
          if [[ "$today" < "$NOT_BEFORE" ]]; then
            echo "Kumamoto is date-gated until $NOT_BEFORE America/New_York; no model dispatch."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$ENGINE" ]]; then
            echo "::error::WAYPOINT_RESEARCH_ENGINE is set to '$ENGINE'; frozen acceptance requires it to remain unset."
            exit 1
          fi

          git fetch --no-tags origin main "$CANDIDATE_REF"

          candidate_actual="$(git rev-parse "origin/$CANDIDATE_REF")"
          if [[ "$candidate_actual" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Frozen candidate moved: expected $CANDIDATE_SHA, found $candidate_actual. Refusing dispatch."
            exit 1
          fi

          main_actual="$(git rev-parse origin/main)"
          echo "Current main: $main_actual"
          echo "Frozen candidate: $candidate_actual"

          # Current authority must still explicitly name r3 as dispatch authority. A later
          # handoff change can revoke this without mutating the frozen candidate branch.
          if ! grep -F "Current dispatch authority is rebuilt r3" docs/handoff.md >/dev/null ||
             ! grep -F "$CANDIDATE_REF" docs/handoff.md >/dev/null ||
             ! grep -F "$CANDIDATE_SHA" docs/handoff.md >/dev/null; then
            echo "::error::Current handoff no longer names frozen Kumamoto r3 as dispatch authority."
            exit 1
          fi

          # Conservative model-burn firewall. These paths can alter the research contract,
          # model input, durable state, retry accounting, evidence gate, or protected landing.
          # Authority-only Markdown is intentionally not blanket-blocked; the exact handoff
          # assertion above owns the current-candidate decision.
          sensitive=0
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|CLAUDE.md|CONTEXT.md|\
              .github/workflows/research-pass-v2.yml|\
              .github/workflows/new-guide.yml|\
              .github/workflows/required-gate.yml|\
              .github/workflows/september-freeze.yml|\
              scripts/pipeline-v2.mjs|\
              scripts/pipeline.mjs|\
              scripts/run-logged-command.sh|\
              scripts/check-project-invariants.mjs|\
              scripts/protected-pr-gate.mjs|\
              scripts/land-branch.sh|\
              scripts/pipeline/v2/*|\
              scripts/pipeline/landing.mjs|\
              scripts/pipeline/scaffold.mjs|\
              prompts/research-*-v2.md)
                echo "::error::Acceptance-sensitive drift since $ACCEPTED_BASE: $path"
                sensitive=1
                ;;
              *)
                echo "Non-sensitive drift: $path"
                ;;
            esac
          done < <(git diff --name-only "$ACCEPTED_BASE..origin/main")

          if [[ "$sensitive" -ne 0 ]]; then
            echo "::error::Kumamoto r3 is not automatically dispatchable after acceptance-sensitive drift. Preserve it and rebuild/re-preflight under current authority."
            exit 1
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Do not overlap a legitimate acceptance run
        if: steps.firewall.outputs.eligible == 'true'
        id: active
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow research-pass-v2.yml \
            --branch "$CANDIDATE_REF" \
            --limit 30 \
            --json databaseId,status,conclusion,headSha,createdAt)"
          active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" -gt 0 ]]; then
            echo "A Kumamoto acceptance workflow is already active; this hourly wake will not compete."
          fi

      - name: Dispatch once or resume only a proven usage-limit
        if: steps.firewall.outputs.eligible == 'true' && steps.active.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail

          research_ref="refs/heads/research-v2/kumamoto"
          research_sha="$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$research_ref" | awk '{print $1}')"

          prior_runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow research-pass-v2.yml \
            --branch "$CANDIDATE_REF" \
            --limit 30 \
            --json databaseId,status,conclusion,headSha,createdAt)"

          if [[ -z "$research_sha" ]]; then
            if [[ "$(jq 'length' <<<"$prior_runs")" -gt 0 ]]; then
              echo "::error::A prior r3 workflow exists but research-v2/kumamoto does not. Refusing to manufacture a second initial run."
              exit 1
            fi

            echo "No prior run exists. Dispatching the exact pre-registered Kumamoto r3 acceptance."
            gh workflow run research-pass-v2.yml --repo "$GITHUB_REPOSITORY" \
              --ref "$CANDIDATE_REF" \
              -f slug=kumamoto \
              -f section="" \
              -f model=claude-sonnet-5 \
              -f effort=high \
              -f critic_model=claude-opus-5
            exit 0
          fi

          state_file="$RUNNER_TEMP/run.v2.json"
          gh api "repos/${GITHUB_REPOSITORY}/contents/guides-intake/kumamoto/run.v2.json?ref=research-v2/kumamoto" \
            --jq '.content' | tr -d '\n' | base64 --decode > "$state_file"

          run_id="$(jq -r '.runId // empty' "$state_file")"
          status="$(jq -r '.status // "unknown"' "$state_file")"
          failure_class="$(jq -r '.failure.class // empty' "$state_file")"
          next_stage="$(jq -r '.resume.nextStage // empty' "$state_file")"
          attempts="$(jq -r '.attempts.total // 0' "$state_file")"
          cap="$(jq -r '.attempts.cap // 0' "$state_file")"
          auto_retries="$(jq -r '.attempts.autoRetries // 0' "$state_file")"
          auto_cap="$(jq -r '.attempts.autoRetryCap // 0' "$state_file")"

          echo "Durable run: $run_id; status=$status; next=$next_stage; failure=$failure_class; attempts=$attempts/$cap; auto-retries=$auto_retries/$auto_cap"

          if [[ "$status" == "complete" || "$status" == "stuck" ]]; then
            echo "Run is terminal for this watcher; no dispatch."
            exit 0
          fi

          if [[ "$failure_class" != "usage-limit" ]]; then
            echo "Run is not stopped on a proven usage-limit. Quality/deterministic/unknown failures are never blindly retried by this watcher."
            exit 0
          fi

          model="$(jq -r '.inputs.model // empty' "$state_file")"
          effort="$(jq -r '.inputs.effort // empty' "$state_file")"
          critic="$(jq -r '.inputs.criticModel // empty' "$state_file")"
          section="$(jq -r '.inputs.section // ""' "$state_file")"

          if [[ "$model" != "claude-sonnet-5" || "$effort" != "high" || "$critic" != "claude-opus-5" || -n "$section" ]]; then
            echo "::error::Durable inputs no longer match the frozen Kumamoto contract; refusing automatic resume."
            exit 1
          fi

          echo "Proven usage-limit interruption. Re-dispatching the SAME slug on the SAME frozen control ref; durable run state will resume the failed stage and enforce existing budgets."
          gh workflow run research-pass-v2.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$CANDIDATE_REF" \
            -f slug=kumamoto \
            -f section="$section" \
            -f model="$model" \
            -f effort="$effort" \
            -f critic_model="$critic"
