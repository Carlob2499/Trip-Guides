name: Project invariants

# Manual lightweight architecture/authority diagnostic. Every pull request now runs these
# invariants inside the always-reporting Required gate, so this workflow no longer emits a second
# path-selected PR status that would be unsafe to require globally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/check-project-invariants.mjs
