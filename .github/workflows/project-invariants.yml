name: Project invariants

# Lightweight guard for architecture/authority files that the full Tests workflow may
# intentionally skip when a PR changes only Markdown. This uses only Node built-ins, so it
# needs no npm install and stays cheap enough to run whenever a protected contract moves.
on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - PRODUCT.md
      - package.json
      - docs/README.md
      - docs/handoff.md
      - docs/reference/**
      - docs/pipeline v2/DECISIONS.md
      - docs/pipeline v2/IMPLEMENTATION_STATE.md
      - docs/pipeline v2/SEPTEMBER_TRACKER.md
      - scripts/check-project-invariants.mjs
      - scripts/check-september-freeze.mjs
      - scripts/__tests__/september-freeze.test.mjs
      - .github/workflows/project-invariants.yml
      - .github/workflows/september-freeze.yml
      - .github/workflows/ensure-labels.yml
      - .github/workflows/new-guide.yml
      - .github/workflows/research-pass.yml
      - .github/workflows/research-pass-v2.yml
      - .github/workflows/mutation.yml
      - scripts/pipeline.mjs
      - scripts/pipeline-v2.mjs
      - src/features/trip-split/**
      - src/features/itinerary/**
      - src/features/maps/**
      - src/features/sos/**
      - public/sw.js
      - docs/design-handoff/**
      - src/content/guides/uruguay/_guide.json
      # Active reciprocal-review control-plane paths stay in the trigger list intentionally.
      # Any change to them must re-run the invariants that protect the revision-4 trust boundary.
      - .github/workflows/claude-codex-watcher.yml
      - .github/workflows/claude-codex-signal.yml
      - scripts/codex-watcher.mjs
      - scripts/__tests__/codex-watcher.test.mjs
      - scripts/__tests__/codex-watcher-workflow.test.mjs
      - prompts/codex-work-order.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/check-project-invariants.mjs
