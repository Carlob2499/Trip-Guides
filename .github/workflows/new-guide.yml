name: New guide scaffold

# Fires when the "new-guide" label lands on an issue. The New-guide issue form
# (.github/ISSUE_TEMPLATE/new-guide.yml) auto-applies that label, so submitting the form is
# enough; ensure-labels.yml creates the label itself.
#
# The scaffold is quarantined twice: draft content is hidden from normal discovery, and the files
# land through a dedicated scaffold branch/PR only after the exact head passes the repository's
# required gate, freeze policy, and platform Analyze checks. Research starts only after that PR is
# merged to main.
on:
  issues:
    types: [labeled]

# Least privilege for the protected scaffold PR, issue reply/close, and research dispatch.
permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: write
  actions: write

# The scaffold serialization group lives on the scaffold JOB, not the workflow: the run may also
# contain the full V2 research pipeline, and a workflow-level group would hold the new-guide slot
# for research's whole multi-hour duration. The job-level group serializes only scaffold landing.

jobs:
  scaffold:
    # A single GLOBAL group, not per-issue: the country isn't known until issue-to-scaffold.mjs
    # parses the body INSIDE the job, so two different issues for the same country can't be told
    # apart by a pre-job key. Scaffolds are fast and infrequent; serialization preserves slug
    # collision safety. Queue, never cancel — scaffold landing is not safe to interrupt halfway.
    concurrency:
      group: new-guide-scaffold
      cancel-in-progress: false
    # The public issue form auto-labels submissions. Only the owner/collaborators may turn that
    # label into a write-token scaffold + model spend; outsider issues remain readable for a
    # maintainer to dispatch deliberately.
    if: >-
      github.event.label.name == 'new-guide' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.gen.outputs.slug }}
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # issue-to-scaffold.mjs → scaffold-guide.mjs → intake-schema.mjs imports zod.
      - run: npm ci

      - name: Parse issue and generate scaffold
        id: gen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/issue-to-scaffold.mjs

      # Deterministic date/party/person contradiction checks against the fresh intake doc, stamped
      # in BEFORE the commit so the first commit already carries anything found. Always exits 0 —
      # a hit becomes a traveler question the research pass surfaces later, not a failed scaffold.
      - name: Check intake for contradictions
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: node scripts/audit/check-intake-contradictions.mjs --slug "${SLUG}" --write

      - name: Configure git identity
        run: |
          git config user.name  "waypoint-scaffold[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Commit to an isolated branch, rebase onto current main, open the scaffold PR, explicitly
      # dispatch the unattended required/freeze checks, wait for all exact-head checks, merge, then
      # reply to and close the intake issue. scripts/pipeline/scaffold.mjs owns the transaction.
      #
      # `country` is whatever the filer typed into a PUBLIC issue form (or sent through the
      # Worker's anonymous intake), so it reaches this step as an environment variable and is read
      # as "$COUNTRY". Written as `${{ }}` inside the script it would be text spliced into the
      # command line before bash parsed it — i.e. a destination name is code.
      - name: Land scaffold through protected checks
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          COUNTRY: ${{ steps.gen.outputs.country }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          node scripts/pipeline.mjs scaffold --slug "$SLUG" \
            --country "$COUNTRY" --issue "$ISSUE"

      # `issue` threads the intake issue through so the research pass can surface any questions it
      # had to assume its way past back to the person who filed it. A notification channel only —
      # research never waits on an answer. V1 carries it per dispatch; V3 records it durably in
      # run.v2.json at init, so resumes/retries never need it re-threaded.
      #
      # THE CUTOVER SWITCH. One repository variable, WAYPOINT_RESEARCH_ENGINE, selects the
      # research engine: unset or anything but "v3" keeps V1. Setting it to "v3" after independent
      # V3 acceptance routes /new to the reusable research-v3 job below. The called run executes
      # under this workflow's trusted issues event, allowing product landing intent; manual V3
      # workflow_dispatch remains draft-only. V1 stays intact as the explicit rollback path.
      - name: Auto-start the research pass (V1 engine)
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
          ENGINE: ${{ vars.WAYPOINT_RESEARCH_ENGINE }}
        run: |
          if [ "$ENGINE" = "v3" ]; then
            echo "V3 engine selected — the research-v3 job takes over via workflow_call (the trusted product invocation)."
          else
            gh workflow run research-pass.yml -f slug="$SLUG" \
              -f issue="$ISSUE"
          fi

  # Trusted V3 product invocation. workflow_call — not `gh workflow run` — preserves the structural
  # distinction from manual draft-only workflow_dispatch. The V3 workflow refreshes trusted main
  # after the scaffold job, so it sees the check-gated scaffold merge before initializing the run.
  research-v3:
    needs: scaffold
    if: vars.WAYPOINT_RESEARCH_ENGINE == 'v3'
    permissions:
      checks: read
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: guide-${{ needs.scaffold.outputs.slug }}
      cancel-in-progress: false
    uses: ./.github/workflows/research-pass-v3.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      issue: ${{ format('{0}', github.event.issue.number) }}
    secrets: inherit
