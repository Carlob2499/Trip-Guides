name: New guide scaffold

# Fires when the "new-guide" label lands on an issue. The New-guide issue form
# (.github/ISSUE_TEMPLATE/new-guide.yml) auto-applies that label, so submitting the form is
# enough; ensure-labels.yml creates the label itself.
#
# The scaffold commits straight to main — no branch, no PR. A scaffold is `draft: true`, and the
# draft quarantine (content.config.ts / GuideLayout.astro) already keeps unverified guides off the
# hub grid and out of search, so a review gate here was ceremony.
on:
  issues:
    types: [labeled]

# Least privilege: commit to main, comment/close the issue, dispatch research-pass.yml.
permissions:
  contents: write
  issues: write
  actions: write

# The scaffold serialization group lives on the scaffold JOB, not the workflow (hardening
# pass): the run now contains the full called V2 research pipeline, and a workflow-level group
# would hold the new-guide slot for the research's whole multi-hour duration — every later
# scaffold queued behind someone else's research. The job-level group keeps the original
# guarantee (scaffold commits to main never interleave) at the original cost.

jobs:
  scaffold:
    # A single GLOBAL group, not per-issue: the country isn't known until issue-to-scaffold.mjs
    # parses the body INSIDE the job, so two different issues for the same country can't be told
    # apart by a pre-job key — and when they ran concurrently both computed the same uniqueSlug
    # from independent checkouts and the second `git pull --rebase` hit an add/add conflict.
    # Scaffolds are fast and infrequent; serializing them trades a little parallelism for
    # correctness. Queue, never cancel — a scaffold commit is not idempotent to interrupt.
    concurrency:
      group: new-guide-scaffold
      cancel-in-progress: false
    # The public issue form auto-labels submissions. Only the owner/collaborators may turn that
    # label into a write-token scaffold + Claude spend; outsider issues remain readable for a
    # maintainer to dispatch deliberately.
    if: >-
      github.event.label.name == 'new-guide' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.gen.outputs.slug }}
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # issue-to-scaffold.mjs → scaffold-guide.mjs → intake-schema.mjs imports zod.
      - run: npm ci

      - name: Parse issue and generate scaffold
        id: gen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/issue-to-scaffold.mjs

      # Deterministic date/party/person contradiction checks against the fresh intake doc, stamped
      # in BEFORE the commit so the first commit already carries anything found. Always exits 0 —
      # a hit becomes a traveler question the research pass surfaces later, not a failed scaffold.
      - name: Check intake for contradictions
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: node scripts/audit/check-intake-contradictions.mjs --slug "${SLUG}" --write

      - name: Configure git identity
        run: |
          git config user.name  "waypoint-scaffold[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Commit + rebase + push, then reply to the filer and close the issue. The reply text lives
      # in scripts/pipeline/scaffold.mjs, where it can be tested and grepped.
      #
      # `country` is whatever the filer typed into a PUBLIC issue form (or sent through the
      # Worker's anonymous intake), so it reaches this step as an environment variable and is read
      # as "$COUNTRY". Written as `${{ }}` inside the script it would be text spliced into the
      # command line before bash parsed it — i.e. a destination name is code.
      - name: Land the scaffold on main
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          COUNTRY: ${{ steps.gen.outputs.country }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          node scripts/pipeline.mjs scaffold --slug "$SLUG" \
            --country "$COUNTRY" --issue "$ISSUE"

      # `issue` threads the intake issue through so the research pass can surface any questions it
      # had to assume its way past back to the person who filed it. A notification channel only —
      # research never waits on an answer. V1 carries it per dispatch; V2 records it durably in
      # run.v2.json at init, so V2 resumes/retries never need it re-threaded.
      #
      # THE CUTOVER SWITCH (Pipeline V2 finalization). One repository variable,
      # WAYPOINT_RESEARCH_ENGINE, selects the research engine: unset or anything but "v2" keeps
      # V1 — the production default is never switched silently. Setting it to "v2" (a deliberate,
      # reviewable repo-settings change reserved for after independent V2 acceptance) routes /new
      # to the V2 pipeline through the research-v2 JOB below — a workflow_call, the TRUSTED
      # product invocation (hardening pass): the called run executes under this workflow's own
      # "issues" event, which is what lets V2's init mint product (auto) landing intent. A
      # manual dispatch of research-pass-v2 is a workflow_dispatch and can only ever
      # create a draft-only (pr) run, whatever ref or selector it runs under. Landing authority
      # is still never a typed input anywhere. V1 stays intact and dispatchable either way —
      # nothing here deletes or bypasses it.
      - name: Auto-start the research pass (V1 engine)
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
          ENGINE: ${{ vars.WAYPOINT_RESEARCH_ENGINE }}
        run: |
          if [ "$ENGINE" = "v2" ]; then
            echo "V2 engine selected — the research-v2 job takes over via workflow_call (the trusted product invocation)."
          else
            gh workflow run research-pass.yml -f slug="$SLUG" \
              -f issue="$ISSUE"
          fi

  # The trusted V2 product invocation (hardening pass). workflow_call — not `gh workflow run` —
  # so the V2 pipeline can distinguish this product entry point structurally: the called run's
  # github.event_name is "issues" (this workflow's own trigger), which ordinary
  # workflow_dispatch cannot impersonate, and only workflows committed to the default branch
  # run on the default-branch ref at all. The job-level concurrency mirrors the V2 workflow's
  # own guide-<slug> group (a reusable workflow's workflow-level concurrency is not applied on
  # call), so V1/V2 research and change runs on one slug still queue instead of interleaving.
  research-v2:
    needs: scaffold
    if: vars.WAYPOINT_RESEARCH_ENGINE == 'v2'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: guide-${{ needs.scaffold.outputs.slug }}
      cancel-in-progress: false
    uses: ./.github/workflows/research-pass-v2.yml
    with:
      slug: ${{ needs.scaffold.outputs.slug }}
      issue: ${{ format('{0}', github.event.issue.number) }}
    secrets: inherit
