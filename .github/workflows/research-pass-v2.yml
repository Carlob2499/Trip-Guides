            --agent-log "$RUNNER_TEMP/agent-output.log" \
            --branch "$BRANCH"

      # BOUNDED AUTOMATIC REPAIR (reliability pass, 2026-08-22). This gate used to read one
      # ephemeral step output — `void == 'true'` — so the commonest repairable failure there is,
      # an ordinary deterministic gate failure, never reached the retry command at all. The
      # DURABLE run state now decides: the recorded failure class must be auto-retryable
      # (gate-failure/void-run only), actionable validator findings must exist for this
      # runId/stage, and the attempt + auto-retry budgets must both have room. `void_retry` is
      # still accepted as a workflow input for compatibility, but it is no longer consulted —
      # run.v2.json's own autoRetries counter is what bounds the loop across dispatches.
      - name: Bounded automatic repair retry (durable run state decides)
        # failure() and cancelled() are DISJOINT status functions: on a cancelled run failure()
