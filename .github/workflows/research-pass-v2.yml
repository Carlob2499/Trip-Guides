name: Research pass (V2)

# PIPELINE V2 — the stage-per-job research pipeline beside V1, selected for /new by the
# WAYPOINT_RESEARCH_ENGINE repository variable (integration week, I01–I06).
# (docs/pipeline v2/DECISIONS.md is the authority; docs/pipeline v2/IMPLEMENTATION_STATE.md the
# build record.) Differences from research-pass.yml that are the POINT of this workflow:
#
#   · ONE JOB PER STAGE. The workflow — never the agent — validates each stage's owed artifact,
#     commits it, and checkpoints run.v2.json (begin-stage before the agent, finish-stage after).
#   · FAILURE CLASSES NAME A PLANE (reliability pass, 2026-08-22 — the Portugal scar). Every
#     agent invocation runs through scripts/run-logged-command.sh, so a nonzero Claude process is
#     a nonzero STEP while the combined stdout/stderr still lands in agent-output.log; a `| tee`
#     wrapper used to report tee's success instead, and a session-limited reconcile was recorded
#     GREEN. A failed agent process therefore never reaches the normal collect/verify path — its
#     workspace is partial attempt evidence, and `record-agent-failure` classifies it from the
#     step conclusion plus the CLI's own printed diagnostic (usage-limit / cancelled /
#     agent-failure / unknown). finish-stage judges only output from a process that RETURNED, so
#     it can say void-run or gate-failure and never `agent-failure`.
#   · AUTOMATIC REPAIR IS DECIDED BY DURABLE STATE, not by a step output. run.v2.json's recorded
#     failure class, the active validator findings for the runId/stage, and the attempt +
#     auto-retry budgets decide; a repair re-dispatch reuses the SAME slug, so the same runId,
#     branch, intake and landMode are resumed and completed stages are skipped. A run that will
#     not repair itself escalates visibly (Actions error + one deduped issue comment).
#   · MECHANICAL PASS-B ISOLATION. The passB job checks out the run's recorded BASELINE commit
#     (fetch-depth 1): Pass A's outputs are absent from its world, not merely forbidden. The
#     collect step then checks out the run branch separately, validates passB.v2.json
#     (fail-closed schema + origin/reconciliation rules) and transfers it.
#   · MECHANICAL CRITIC BLINDNESS. The critic input excludes evidence/run state and its fetch
#     permissions name only pre-verified source domains. Every agent runs in a pinned container
#     that mounts only /workspace; a fresh host checkout collects only stage-owned artifacts.
#   · PUBLICATION AUTHORITY IS INFRASTRUCTURE, NEVER AN INPUT (correction + hardening passes).
#     landMode is DERIVED at init from THREE facts — trusted provenance (the run was invoked
#     through new-guide.yml's workflow_call, so github.event_name is the caller's "issues",
#     never "workflow_dispatch"), the default-branch ref, AND the WAYPOINT_RESEARCH_ENGINE
#     selector being "v2" — recorded once, immutable, and re-checked as landing-time authority
#     by the land job. A MANUAL workflow_dispatch therefore ALWAYS creates a landMode=pr run,
#     even on the default branch with the selector live: only the trusted /new product flow can
#     mint auto authority, and no input anyone can type changes that. "pr" runs (canaries,
#     tests, every manual and feature-ref dispatch) ALWAYS land a draft PR with the real
#     evidence-gate scorecard as body and can never publish. "auto" runs publish through the
#     SAME evidence-gated `pipeline.mjs land` machinery V1 uses, as a TWO-PHASE transaction:
#     gate verdict rides the merge; the publication fact is finalized only after gh CONFIRMS the
#     merge (schema-refused earlier). V1 dispatch (new-guide.yml → research-pass.yml) is
#     untouched either way.
#
# Resumable: run.v2.json records per-stage status and the resume point; each stage job is
# skipped when routing says it is already complete, so a re-dispatch continues, never restarts.
on:
  # THE TRUSTED PRODUCT ENTRY POINT (hardening pass): new-guide.yml calls this workflow via
  # workflow_call, which ordinary workflow_dispatch cannot impersonate — a called run executes
  # under the CALLER's event ("issues"), and only workflows already committed to the default
  # branch can call it from that ref. Init derives landMode from exactly that provenance.
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      section:
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: claude-sonnet-5
      effort:
        required: false
        type: string
        default: medium
      critic_model:
        required: false
        type: string
        default: claude-opus-5
      critic_effort:
        required: false
        type: string
        default: ""
      issue:
        required: false
        type: string
        default: ""
      void_retry:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      slug:
        description: "Guide slug (must already be scaffolded — V2 researches an existing scaffold)."
        required: true
        type: string
      section:
        description: "Section focus for a scoped pass. Leave blank for a full pass."
        required: false
        type: string
        default: ""
      model:
        description: "Research model for Pass A (Pass B remains Sonnet). Reconcile + critic use critic_model as the judgment model."
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-5
        default: claude-sonnet-5
      effort:
        description: "Default reasoning effort for all agent stages. Medium is the V2 baseline; use High/XHigh only for an explicit difficult-run escalation."
        required: false
        type: choice
        options:
          - high
          - xhigh
          - medium
        default: medium
      critic_model:
        description: "Judgment model for Reconcile + the fresh-context critic."
        required: false
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
        default: claude-opus-5
      critic_effort:
        description: "Optional effort override for Reconcile + Critic. Leave blank to inherit research effort; use high/xhigh only for an explicit judgment escalation."
        required: false
        type: string
        default: ""
      issue:
        description: "Intake issue number for traveler-question continuity (set automatically by new-guide.yml). Blank on a resume: the run's durable record already carries it."
        required: false
        type: string
        default: ""
      # There is deliberately NO `land` input (correction pass): landing authority is never a
      # dispatch input anyone can type. Product intent is DERIVED inside setup from two
      # infrastructure facts — the dispatch ref is the default branch AND the
      # WAYPOINT_RESEARCH_ENGINE selector is "v2" — and re-checked at landing time, so a manual
      # or feature-ref dispatch structurally cannot request auto publication.
      void_retry:
        description: "Internal — set by the bounded auto-retry. Leave false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # the bounded auto-retry re-dispatches this workflow

env:
  WAYPOINT_PIPELINE_V2: "1"
  SLUG: ${{ inputs.slug }}
  SECTION: ${{ inputs.section }}

# SAME guide-<slug> group as V1 research AND the change lifecycle, deliberately: any two runs
# on one slug — V1 research, V2 research, or a change — queue behind each other instead of
# interleaving (M6's exclusion boundary).
concurrency:
  group: guide-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  # ── setup: branch, init/resume, budget, route ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      should_run: ${{ steps.budget.outputs.should_run }}
      next: ${{ steps.route.outputs.next }}
      baseline: ${{ steps.route.outputs.baseline }}
      run_id: ${{ steps.route.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
    steps:
      # Phase-4 runtime guard: even if the REAL workflow file ever lands on the default branch,
      # a dispatch on that ref cannot start research (and spends nothing). The escape hatch is a
      # deliberate repository variable — the cutover switch, set only after independent review.
      - name: Guard — research never starts from the default branch
        if: github.ref_name == github.event.repository.default_branch && vars.WAYPOINT_RESEARCH_ENGINE != 'v2'
        run: |
          echo "::error::research-pass-v2 was dispatched on the default branch. The default-branch copy of this workflow is an inert registration stub; run the real pipeline from its feature branch, or set the WAYPOINT_RESEARCH_ENGINE repository variable to v2 after an accepted cutover. No research was started and nothing was spent."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The trusted product entry (new-guide.yml's workflow_call) runs a REUSED workflow at the
      # CALLER's triggering SHA — the issue-label event's SHA, which predates the scaffold job's
      # own commit to the default branch (both jobs are steps of the SAME workflow run). The
      # checkout above therefore lands on pre-scaffold main, and this run's slug is invisible to
      # V2 init even though the scaffold already exists on the real remote default branch
      # (first production canary, malta/#69, run 32454262582 — recorded live evidence). A
      # workflow_dispatch's checked-out ref is the developer's own choice and must never be
      # silently replaced, so this refresh runs ONLY for the non-dispatch (trusted) path — before
      # setup-node/npm ci, so nothing installs or runs against the stale pre-scaffold tree.
      - name: Refresh the trusted product checkout to the post-scaffold default branch
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE"
          git checkout -B "$BASE" FETCH_HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resume or start the V2 research branch
        id: branch
        # A resumed branch owns durable run artifacts, not the version of the control-plane code.
        # Synchronize the dispatch checkout into it before init/budget/route, then push that head
        # because every later stage runs in a fresh job and re-checks out the remote run branch.
        run: node scripts/pipeline.mjs branch --slug "$SLUG" --prefix research-v2 --sync-current

      # issue is recorded durably at init (blank = inherit on a resume) so retries and
      # answer-redispatches never re-thread it. Landing intent is DERIVED, never typed, by the
      # tested deriveLandIntent(): auto ONLY for the trusted product invocation — the event is
      # NOT workflow_dispatch (new-guide.yml's workflow_call runs under its own "issues" event;
      # every manual/developer dispatch IS workflow_dispatch) AND the ref is the default branch
      # AND the selector is "v2". A maintainer typing `gh workflow run` on main with the
      # selector live still creates a draft-only (pr) run. --branch-fresh tells init whether the
      # research branch was just created (any state found then is default-branch HISTORY: a
      # merged prior run starts a NEW run with the old one archived and its mutable artifacts
      # removed from the fresh branch; anything else fresh is refused).
      - name: Init or resume the V2 run
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BRANCH_RESUMED: ${{ steps.branch.outputs.resumed }}
          ISSUE: ${{ inputs.issue }}
          ENGINE: ${{ vars.WAYPOINT_RESEARCH_ENGINE }}
          ON_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LAND=$(node scripts/pipeline-v2.mjs land-intent --slug "$SLUG" \
            --event-name "$EVENT_NAME" --on-default "$ON_DEFAULT" --engine "$ENGINE")
          FRESH=false
          if [ "$BRANCH_RESUMED" = "false" ]; then FRESH=true; fi
          node scripts/pipeline-v2.mjs init --slug "$SLUG" --section "$SECTION" --branch "$BRANCH" \
            --model "${{ inputs.model || 'claude-sonnet-5' }}" --effort "${{ inputs.effort || 'medium' }}" \
            --critic-model "${{ inputs.critic_model || 'claude-opus-5' }}" \
            --critic-effort "${{ inputs.critic_effort }}" \
            --issue "$ISSUE" --land "$LAND" --branch-fresh "$FRESH"

      - name: Attempt budget (bounded)
        id: budget
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline-v2.mjs budget --slug "$SLUG" --branch "$BRANCH"

      - name: File the stuck issue past the cap
        if: steps.budget.outputs.should_run == 'false'
        run: node scripts/pipeline.mjs gate stuck --slug "$SLUG"

      - name: Preflight — check intake for contradictions
        if: steps.budget.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline.mjs gate preflight --slug "$SLUG" --branch "$BRANCH"

      - name: Route to next stage
        id: route
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline-v2.mjs route --slug "$SLUG"

  # ── Pass A ─────────────────────────────────────────────────────────────────
  passA:
    needs: setup
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.next == 'passA'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      # issues: write is REQUIRED by the stop/escalation step, and a job-level permissions
      # block sets every omitted scope to `none` — the workflow-level grant does not survive
      # the override. Without it `gh issue comment` 403s in exactly the failure path the
      # escalation exists to make visible (Codex review B1). Least privilege: the token is
      # still never passed into the agent container.
      issues: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkpoint stage start
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage passA \
            --model "${{ inputs.model || 'claude-sonnet-5' }}" \
            --effort "${{ inputs.effort || 'medium' }}" \
            --branch "$BRANCH"

      - name: Remove repository credentials before untrusted research input is read
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage passA

      - name: Generate the machine-contract capsule
        id: contract
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage passA

      - name: Compose Pass A prompt
        id: prompt
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_SECTION: ${{ inputs.section || 'full pass — all sections' }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-passA-v2.md > /dev/null

      - name: Replace repository history with an unprivileged local workspace
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Pass A
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          WP_EFFORT: ${{ inputs.effort || 'medium' }}
          WP_TOOLS: Read(//workspace/**),Edit(//workspace/**),Glob,Grep,WebSearch,WebFetch
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**),WebFetch(domain:r.jina.ai),WebFetch(domain:webcache.googleusercontent.com),WebFetch(domain:cachedview.nl),WebFetch(domain:12ft.io),WebFetch(domain:web.archive.org),WebFetch(domain:translate.googleusercontent.com)
        # EXIT INTEGRITY (Portugal scar, 2026-08-22): `docker run ... | tee` reports TEE's status,
        # so a Claude process that printed "You've hit your session limit" and exited nonzero was
        # recorded as a SUCCESSFUL step and the partial workspace went on to be verified. The
        # wrapper keeps the identical combined-output log while propagating the PRODUCER's status.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-logged-command.sh" "$RUNNER_TEMP/agent-output.log" \
            docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      - name: Checkout a fresh control-plane copy after Pass A
        if: always()
        id: collect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      # Validate the owed artifact, commit the work, checkpoint completion — or record the
      # failure (void → one bounded auto-retry below).
      # set +e: a failed collection must still reach finish-stage, which records the failure
      # (with the validator's field-level findings as durable retry feedback) and pushes it —
      # aborting on collect left the stage "running" and the feedback unpushed (canary attempt 2).
      - name: Validate, commit, checkpoint
        # PARTIAL OUTPUT IS NOT SUCCESSFUL OUTPUT: an agent process that did not return cleanly
        # leaves attempt evidence, never a stage to validate. Explicit, not ambient.
        if: success() && steps.agent.outcome == 'success'
        id: finish
        working-directory: collect
        run: |
          npm ci
          git config user.name "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          node scripts/pipeline-v2.mjs collect-stage --slug "$SLUG" --stage passA --from "$GITHUB_WORKSPACE" --branch "$BRANCH"
          COLLECT=$?
          SCOPED=()
          if [ -n "$SECTION" ]; then SCOPED=(--scoped); fi
          node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage passA \
            --branch "$BRANCH" "${SCOPED[@]}"
          FINISH=$?
          if [ "$COLLECT" -ne 0 ] || [ "$FINISH" -ne 0 ]; then exit 1; fi

      - name: Record agent failure honestly
        if: (failure() || cancelled()) && steps.collect.outcome == 'success' && steps.finish.conclusion != 'failure'
        working-directory: collect
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/pipeline-v2.mjs record-agent-failure --slug "$SLUG" --stage passA \
            --agent-conclusion "${{ steps.agent.conclusion }}" \
            --agent-log "$RUNNER_TEMP/agent-output.log" \
            --branch "$BRANCH"

      # BOUNDED AUTOMATIC REPAIR (reliability pass, 2026-08-22). This gate used to read one
      # ephemeral step output — `void == 'true'` — so the commonest repairable failure there is,
      # an ordinary deterministic gate failure, never reached the retry command at all. The
      # DURABLE run state now decides: the recorded failure class must be auto-retryable
      # (gate-failure/void-run only), actionable validator findings must exist for this
      # runId/stage, and the attempt + auto-retry budgets must both have room. `void_retry` is
      # still accepted as a workflow input for compatibility, but it is no longer consulted —
      # run.v2.json's own autoRetries counter is what bounds the loop across dispatches.
      - name: Bounded automatic repair retry (durable run state decides)
        # failure() and cancelled() are DISJOINT status functions: on a cancelled run failure()
        # is false, so gating on it alone skipped both this decision and the escalation below —
        # leaving `cancelled` recorded but silent, against the contract (Codex review B3). The
        # state machine still REFUSES cancelled; asking it is what produces the visible stop.
        if: failure() || cancelled()
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --stage passA --branch "$BRANCH"

      - name: Re-dispatch the repair attempt once
        if: failure() && steps.retry.outputs.allowed == 'true'
        id: redispatch
        continue-on-error: true
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104. The re-dispatch carries the SAME slug, so setup resumes the
        # SAME runId, branch, intake and landMode, and every completed stage is skipped.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f critic_effort="${{ inputs.critic_effort }}" -f void_retry=true

      # THE STOP IS VISIBLE (reliability pass). A run that will not repair itself files one
      # Actions error and, when the run knows its intake issue, one deduped issue comment naming
      # the stage, class, finding count, why no retry happened and the exact safe recovery.
      # A repair that was ELIGIBLE but whose re-dispatch failed is also a stop: the auto-retry
      # reservation is already durably consumed and no repair run exists, so skipping the notice
      # here would bypass the visible-stop contract on a control-plane failure (Codex review B2).
      - name: Escalate — this run stopped and needs a human
        if: (failure() || cancelled()) && (steps.retry.outputs.allowed != 'true' || steps.redispatch.outcome == 'failure')
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pipeline-v2.mjs escalate --slug "$SLUG" --stage passA \
            --dispatch-failed "${{ steps.redispatch.outcome == 'failure' }}"

  # ── Pass B — mechanically isolated ─────────────────────────────────────────
  passB:
    needs: [setup, passA]
    # Runs when routing says passB is next, whether passA ran this dispatch or a previous one.
    if: >-
      always() && needs.setup.outputs.should_run == 'true' &&
      (needs.passA.result == 'success' || (needs.passA.result == 'skipped' && needs.setup.outputs.next == 'passB'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      # issues: write is REQUIRED by the stop/escalation step, and a job-level permissions
      # block sets every omitted scope to `none` — the workflow-level grant does not survive
      # the override. Without it `gh issue comment` 403s in exactly the failure path the
      # escalation exists to make visible (Codex review B1). Least privilege: the token is
      # still never passed into the agent container.
      issues: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      # Control-plane world, used ONLY to checkpoint stage start; deleted before the agent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: .control
      # No `cache: npm` here: this job's first checkout lands in .control/, so there is no
      # package-lock.json at the workspace root and the cache resolver would fail the job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Checkpoint stage start (control-plane checkout)
        working-directory: .control
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage passB \
            --model claude-sonnet-5 --effort "${{ inputs.effort || 'medium' }}" \
            --branch "$BRANCH"
      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        working-directory: .control
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage passB

      - name: Generate the machine-contract capsule
        id: contract
        working-directory: .control
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage passB

      - name: Remove the control-plane world before the agent
        run: rm -rf .control

