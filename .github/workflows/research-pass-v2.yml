    permissions:
      contents: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
