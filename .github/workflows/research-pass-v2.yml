        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Compose critic prompt
        id: prompt
        if: steps.begin.outputs.replay != 'true'
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-critic-v2.md > /dev/null

      - name: Replace git history with a local-only sandbox repository
        if: steps.begin.outputs.replay != 'true'
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Critic
        id: agent
        if: steps.begin.outputs.replay != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: ${{ inputs.critic_model || 'claude-opus-5' }}
          WP_EFFORT: ${{ inputs.critic_effort || inputs.effort || 'medium' }}
          WP_TOOLS: ${{ steps.fetch_policy.outputs.tools }}
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**)
        # EXIT INTEGRITY (Portugal scar, 2026-08-22): `docker run ... | tee` reports TEE's status,
        # so a Claude process that printed "You've hit your session limit" and exited nonzero was
        # recorded as a SUCCESSFUL step and the partial workspace went on to be verified. The
        # wrapper keeps the identical combined-output log while propagating the PRODUCER's status.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-logged-command.sh" "$RUNNER_TEMP/agent-output.log" \
            docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      - name: Checkout a fresh control-plane copy after the critic
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      # Deterministic tail the V1 critic used to run itself: palette + composition are code.
      - name: Collect allowed output, compose, validate, commit, checkpoint
        # PARTIAL OUTPUT IS NOT SUCCESSFUL OUTPUT (see Pass A).
        if: success() && (steps.agent.outcome == 'success' || steps.begin.outputs.replay == 'true')
        id: finish
        working-directory: collect
        run: |
          set +e
          npm ci
          RC=$?
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # RETAINED CRITIC OUTPUT (paid-work scar, R-A). The critic's output lives in the agent
          # sandbox and reaches this trusted checkout only through the copies below, so a
          # truth-gate exit placed BEFORE them left the collect tree clean: verify-failed found
          # nothing in scope, committed nothing, and the retry re-spent the whole paid pass.
          #
          # Retaining the GUIDE edits is safe only because the gate no longer diffs against this
          # working tree: reconcile-critic-truth reads its pre-critic baseline out of the commit
          # PINNED ON THE CRITIC STAGE ITSELF (run.v2.json stages.critic.baseline), so the next
          # attempt still compares against the ORIGINAL guide. A retained edit can never satisfy
          # the gate by being compared against itself, and a rejected handoff stays repairable
          # without regenerating the guide work. Scope unchanged: the critic's own allowed paths
          # — guide dir, ledger, patterns fragment — nothing wider.
          retain_critic_output() {
            rsync -a --delete "$GITHUB_WORKSPACE/src/content/guides/$SLUG/" "src/content/guides/$SLUG/" || return 1
            cp "$GITHUB_WORKSPACE/guides-intake/$SLUG/ledger.md" "guides-intake/$SLUG/ledger.md" || return 1
            cp "$GITHUB_WORKSPACE/guides-intake/$SLUG/pipeline-patterns.fragment.md" "guides-intake/$SLUG/pipeline-patterns.fragment.md" || return 1
            # The handoff is what a malformed-handoff failure has to REPAIR, so retain it when it
            # exists — otherwise the next critic reconstructs previous values it can no longer see.
            # Optional on purpose: "no handoff at all" is itself one of the failures being retained.
            if [ -f "$GITHUB_WORKSPACE/guides-intake/$SLUG/critic-corrections.v2.json" ]; then
              cp "$GITHUB_WORKSPACE/guides-intake/$SLUG/critic-corrections.v2.json" "guides-intake/$SLUG/critic-corrections.v2.json" || return 1
            fi
          }
          if [ "$RC" -eq 0 ]; then
            node scripts/pipeline-v2.mjs reconcile-critic-truth --slug "$SLUG" --from "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/critic-truth-out.txt"
            TRUTH_RC="${PIPESTATUS[0]}"
            if [ "$TRUTH_RC" -ne 0 ]; then
              retain_critic_output || echo "[critic] retention incomplete — recording findings anyway"
              # EXIT 3: the corrections reached evidence, but a supersession only the EVIDENCE
              # OWNER can decide is outstanding. The blind critic cannot write that relation, so
              # retrying it would spend the run's one quality retry on a stage that must fail
              # again — this routes the findings to reconcile and re-queues the critic with its
              # retained work and its pinned baseline. Any other nonzero is the critic's own.
              if [ "$TRUTH_RC" -eq 3 ]; then
                node scripts/pipeline-v2.mjs needs-reconcile --slug "$SLUG" \
                  --file "$RUNNER_TEMP/critic-truth-out.txt" --branch "$BRANCH"
              else
                node scripts/pipeline-v2.mjs verify-failed --slug "$SLUG" --stage critic \
                  --file "$RUNNER_TEMP/critic-truth-out.txt" --branch "$BRANCH"
              fi
              exit 1
            fi
          fi
          if [ "$RC" -eq 0 ]; then retain_critic_output; RC=$?; fi
          if [ "$RC" -eq 0 ]; then node scripts/pipeline-v2.mjs compound-patterns --slug "$SLUG"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then npm run extract-palette -- --slug "$SLUG"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then node scripts/compose-guide.mjs --slug "$SLUG" --write; RC=$?; fi
          # Composition renumbers group files under the tab budget; coverage refs follow their
          # anchors to the composed filenames (deterministic, fail-closed — canary scar). A remap
          # failure keeps the stage's work + findings exactly like a verify failure (second scar:
          # a discarded critic pass is 15 agent-minutes re-spent for want of a findings file).
          if [ "$RC" -eq 0 ]; then
            node scripts/pipeline-v2.mjs remap-coverage --slug "$SLUG" 2>&1 | tee "$RUNNER_TEMP/remap-out.txt"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              node scripts/pipeline-v2.mjs verify-failed --slug "$SLUG" --stage critic \
                --file "$RUNNER_TEMP/remap-out.txt" --branch "$BRANCH"
              exit 1
            fi
          fi
          # The schema gate runs HERE, not first at landing: a schema error surfacing only at
          # land is a dead end (all stages complete, nothing to retry) — at the critic it is a
          # normal stage failure with retained work and findings (canary scar: two facts.json
          # evidence strings over the 240-char cap reached the landing gate).
          if [ "$RC" -eq 0 ]; then
            npm run build 2>&1 | tee "$RUNNER_TEMP/build-out.txt" | tail -40
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              node scripts/pipeline-v2.mjs verify-failed --slug "$SLUG" --stage critic \
                --file "$RUNNER_TEMP/build-out.txt" --branch "$BRANCH"
              exit 1
            fi
          fi
          if [ "$RC" -eq 0 ]; then
            npm run verify -- --slug "$SLUG" 2>&1 | tee "$RUNNER_TEMP/verify-scorecard.txt"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              node scripts/pipeline-v2.mjs verify-failed --slug "$SLUG" --stage critic \
                --file "$RUNNER_TEMP/verify-scorecard.txt" --branch "$BRANCH"
              exit 1
            fi
          fi
          if [ "$RC" -eq 0 ]; then
            node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage critic --branch "$BRANCH"
          else
            node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage critic --class gate-failure \
              --detail "critic collection, process-memory, compose, or coverage remap failed" --branch "$BRANCH"
            exit 1
          fi

      - name: Record agent failure honestly
        if: (failure() || cancelled())
        working-directory: collect
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/pipeline-v2.mjs record-agent-failure --slug "$SLUG" --stage critic \
            --agent-conclusion "${{ steps.agent.conclusion }}" \
            --agent-log "$RUNNER_TEMP/agent-output.log" \
            --branch "$BRANCH"

      # BOUNDED AUTOMATIC REPAIR (reliability pass, 2026-08-22). This gate used to read one
      # ephemeral step output — `void == 'true'` — so the commonest repairable failure there is,
      # an ordinary deterministic gate failure, never reached the retry command at all. The
      # DURABLE run state now decides: the recorded failure class must be auto-retryable
      # (gate-failure/void-run only), actionable validator findings must exist for this
      # runId/stage, and the attempt + auto-retry budgets must both have room. `void_retry` is
      # still accepted as a workflow input for compatibility, but it is no longer consulted —
      # run.v2.json's own autoRetries counter is what bounds the loop across dispatches.
      - name: Bounded automatic repair retry (durable run state decides)
        # failure() and cancelled() are DISJOINT status functions: on a cancelled run failure()
        # is false, so gating on it alone skipped both this decision and the escalation below —
        # leaving `cancelled` recorded but silent, against the contract (Codex review B3). The
        # state machine still REFUSES cancelled; asking it is what produces the visible stop.
        if: failure() || cancelled()
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --stage critic --branch "$BRANCH"

      - name: Re-dispatch the repair attempt once
        if: failure() && steps.retry.outputs.allowed == 'true'
        id: redispatch
        continue-on-error: true
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104. The re-dispatch carries the SAME slug, so setup resumes the
        # SAME runId, branch, intake and landMode, and every completed stage is skipped.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f critic_effort="${{ inputs.critic_effort }}" -f void_retry=true

      # THE STOP IS VISIBLE (reliability pass). A run that will not repair itself files one
      # Actions error and, when the run knows its intake issue, one deduped issue comment naming
      # the stage, class, finding count, why no retry happened and the exact safe recovery.
      # A repair that was ELIGIBLE but whose re-dispatch failed is also a stop: the auto-retry
      # reservation is already durably consumed and no repair run exists, so skipping the notice
      # here would bypass the visible-stop contract on a control-plane failure (Codex review B2).
      - name: Escalate — this run stopped and needs a human
        if: (failure() || cancelled()) && (steps.retry.outputs.allowed != 'true' || steps.redispatch.outcome == 'failure')
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/pipeline-v2.mjs escalate --slug "$SLUG" --stage critic \
            --dispatch-failed "${{ steps.redispatch.outcome == 'failure' }}"

  # ── Land — always a draft PR while V2 is being proven ──────────────────────
  land:
    needs: [setup, critic]
    # needs.setup.result guards the canary-observed case: setup fails AFTER its budget step has
    # already emitted should_run=true (outputs of failed jobs remain readable), which used to
    # start a doomed landing job on a run that never routed.
    if: >-
      always() && needs.setup.result == 'success' && needs.setup.outputs.should_run == 'true' &&
      (needs.critic.result == 'success' || (needs.critic.result == 'skipped' && needs.setup.outputs.next == ''))
    runs-on: ubuntu-latest
    # issues:write exists for exactly one reason (correction pass): a product merge files the
    # vetoable "🚀 Auto-published" safety notice, and this job override used to drop the
    # permission the workflow level would have granted — every notice died silently behind
    # land-branch.sh's old `|| true`. The notice failure is now also recorded durably
    # (landing.announced=false) instead of swallowed.
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
      PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fail-closed artifact validation BEFORE landing: evidence, dispositions, saturation,
      # coverage. A malformed or missing artifact blocks here.
      - name: Validate V2 artifacts
        id: artifacts
        run: |
          SCOPED=()
          if [ -n "$SECTION" ]; then SCOPED=(--scoped); fi
          node scripts/pipeline-v2.mjs validate --slug "$SLUG" "${SCOPED[@]}"

      # The deterministic landing decision: auto ONLY when the run's durable record says product
      # intent AND every stage is complete AND landing-time PRODUCT AUTHORITY holds — this run is
      # on the default branch with the selector still "v2" RIGHT NOW. A feature-ref dispatch can
      # therefore never auto-merge its research branch into main (the previously possible
      # side-door), and revoking the selector mid-run downgrades the landing to a draft PR.
      - name: Determine the landing mode
        id: mode
        env:
          ENGINE: ${{ vars.WAYPOINT_RESEARCH_ENGINE }}
          ON_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          AUTHORITY=false
          if [ "$ON_DEFAULT" = "true" ] && [ "$ENGINE" = "v2" ]; then AUTHORITY=true; fi
          node scripts/pipeline-v2.mjs land-mode --slug "$SLUG" --product-authority "$AUTHORITY"

      # The REAL evidence gate (build + networked verify) runs inside `land --gate`; the
      # scorecard becomes the PR body. Mode pr (controlled/draft runs): never merges, never
      # publishes. Mode auto (product runs): the same evidence-gated publication path V1 uses,
      # as a TWO-PHASE transaction — the gate verdict rides the branch into the merge, and the
      # publication fact is finalized on the default branch only AFTER gh confirms the merge
      # (schema-refused any earlier). The --announce URL files the vetoable auto-published
      # notice on a real merge; a notice failure is recorded durably, never swallowed.
      - name: Land the branch
        id: evidence_gate
        env:
          LAND: ${{ steps.mode.outputs.land }}
        run: |
          node scripts/pipeline.mjs land --slug "$SLUG" \
            --branch "$BRANCH" --gate --land "$LAND" \
            --title "Research pass (V2): $SLUG" \
            --announce "${SITE_BASE_URL}/guides/${SLUG}/"

      # The land step exits 0 even when the gate FAILS (draft PR is the designed fallback), so
      # the record keys on the emitted gate verdict, never on step success — the canary's first
      # landing recorded a pass the gate never earned by conflating the two. A MERGED product
      # landing is skipped here: its gate verdict rode the merge commit (phase 1) and its
      # publication record was finalized on the default branch after the confirmed merge
      # (phase 2, inside `land`); its branch is gone — pushing a post-record would only
      # resurrect a zombie branch.
      - name: Record the real landing gate verdict
        if: success() && steps.evidence_gate.outputs.outcome != 'merged'
        run: |
          if [ "${{ steps.evidence_gate.outputs.gate }}" = "passed" ]; then
            node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status passed --branch "$BRANCH"
          else
            node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status failed \
              --detail "evidence gate failed (build or configured network verify) — landed as a draft PR only" --branch "$BRANCH"
          fi

      # RESEARCH-GATE TRUTH AND LANDING TRUTH ARE SEPARATE (hardening pass). This crash handler
      # used to rewrite a legitimate gate PASS into gate FAIL whenever a LATER GitHub operation
      # (merge auth/API error, post-merge finalization) crashed the land step — and, worse, its
      # push recreated the just-deleted research branch on the merged-but-finalization-failed
      # path. It now keys on the emitted gate verdict (the land CLI emits it on every path,
      # including hard landing failures): a passed gate is never rewritten — the landing failure
      # is already recorded durably as landing.outcome=failed by the CLI — and a MERGED outcome
      # records nothing here at all (the branch is gone; finalize-landing is the retry).
      - name: Record the landing gate failure (step crashed)
        if: failure() && steps.evidence_gate.outputs.gate != 'passed'
        run: |
          node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status failed \
            --detail "artifact, build, or configured network evidence gate failed" --branch "$BRANCH" || true

      - name: Preserve the passed gate verdict after a landing-side crash
        if: failure() && steps.evidence_gate.outputs.gate == 'passed' && steps.evidence_gate.outputs.outcome != 'merged'
        run: |
          # The gate PASSED and the failure was landing-side (recorded by the CLI as
          # landing.outcome=failed). Make sure the durable gate verdict says PASS — on pr-mode
          # landings phase 1 never wrote it — without ever touching a merged run's gone branch.
          node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status passed --branch "$BRANCH" || true

  # ── questions: surface, never gate (I01 — V1's product-communication contract) ──────────────
  # The traveler sees what was assumed on their behalf. always(): a run cut off mid-stage still
  # asks what it managed to. The issue number comes from the run's DURABLE record (set at init by
  # /new's dispatch), never from this dispatch's inputs — so a resume/retry, which carries no
  # issue input, still reports to the right thread. Deduped by question id inside `questions`.
  questions:
    needs: [setup, land]
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The run's ledger lives on the research branch while it exists. A merged product landing
      # DELETES that branch and the merge lands after this workflow's dispatch SHA — so the
      # default checkout above can predate the merge (correction pass: it used to be read as-is
      # and could miss the merged ledger entirely). Explicitly fetch whichever home is current:
      # the branch when it survives, the LATEST default branch otherwise. The branch can also
      # vanish between the existence check and the fetch (the merge races this job) — that
      # falls through to the default-branch fetch rather than failing.
      - name: Check out the run's current home (branch, or post-merge default branch)
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1 \
             && git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git fetch origin "$BASE"
            git checkout -B "$BASE" FETCH_HEAD
          fi
      # Non-gating for research quality, but delivery failure is OBSERVABLE: the surfacer prints
      # a ::warning:: annotation when it cannot post, instead of pretending delivery succeeded.
      - name: Surface traveler questions on the intake issue
        continue-on-error: true
        run: |
          ISSUE=$(node -e 'try { console.log(require(`./guides-intake/${process.env.SLUG}/run.v2.json`).issue || "") } catch { console.log("") }')
          if [ -n "$ISSUE" ]; then
            node scripts/pipeline.mjs questions --slug "$SLUG" --issue "$ISSUE"
          else
            echo "no intake issue recorded on this run — nothing to surface (manual dispatch)."
          fi
