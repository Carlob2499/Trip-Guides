          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage critic \
            --model "${{ inputs.critic_model || 'claude-opus-5' }}" \
            --effort "${{ inputs.critic_effort || inputs.effort || 'medium' }}" --branch "$BRANCH"

      - name: Stage retry feedback (validator data, this stage only)
