name: Research pass (V2)

# PIPELINE V2 — the manual, draft-only research pipeline being proven beside V1.
# (docs/pipeline v2/DECISIONS.md is the authority; docs/pipeline v2/IMPLEMENTATION_STATE.md the
# build record.) Differences from research-pass.yml that are the POINT of this workflow:
#
#   · ONE JOB PER STAGE. The workflow — never the agent — validates each stage's owed artifact,
#     commits it, and checkpoints run.v2.json (begin-stage before the agent, finish-stage after).
#     A stage that produced nothing durable is a recorded VOID failure with one bounded
#     auto-retry; any other agent failure is recorded honestly as `agent-failure` and the branch
#     stays manually resumable (usage-limit failures are not reliably identifiable from here, so
#     they are never guessed at).
#   · MECHANICAL PASS-B ISOLATION. The passB job checks out the run's recorded BASELINE commit
#     (fetch-depth 1): Pass A's outputs are absent from its world, not merely forbidden. The
#     collect step then checks out the run branch separately, validates passB.v2.json
#     (fail-closed schema + origin/reconciliation rules) and transfers it.
#   · MECHANICAL CRITIC BLINDNESS. The critic input excludes evidence/run state and its fetch
#     permissions name only pre-verified source domains. Every agent runs in a pinned container
#     that mounts only /workspace; a fresh host checkout collects only stage-owned artifacts.
#   · NO PUBLICATION. Landing always opens a DRAFT PR (--land pr) with the real evidence-gate
#     scorecard as its body. V2 does not remove `draft`, does not auto-merge, and V1 dispatch
#     (new-guide.yml → research-pass.yml) is untouched.
#
# Resumable: run.v2.json records per-stage status and the resume point; each stage job is
# skipped when routing says it is already complete, so a re-dispatch continues, never restarts.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Guide slug (must already be scaffolded — V2 researches an existing scaffold)."
        required: true
        type: string
      section:
        description: "Section focus for a scoped pass. Leave blank for a full pass."
        required: false
        type: string
        default: ""
      model:
        description: "Model for Pass A + reconcile (Pass B is always Sonnet)."
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-5
        default: claude-sonnet-5
      effort:
        description: "Reasoning effort for every agent."
        required: false
        type: choice
        options:
          - high
          - xhigh
          - medium
        default: high
      critic_model:
        description: "Model for the fresh-context critic."
        required: false
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
        default: claude-opus-5
      void_retry:
        description: "Internal — set by the bounded auto-retry. Leave false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # the bounded auto-retry re-dispatches this workflow

env:
  WAYPOINT_PIPELINE_V2: "1"
  SLUG: ${{ inputs.slug }}
  SECTION: ${{ inputs.section }}

# SAME guide-<slug> group as V1 research AND the change lifecycle, deliberately: any two runs
# on one slug — V1 research, V2 research, or a change — queue behind each other instead of
# interleaving (M6's exclusion boundary).
concurrency:
  group: guide-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  # ── setup: branch, init/resume, budget, route ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      branch: ${{ steps.branch.outputs.name }}
      should_run: ${{ steps.budget.outputs.should_run }}
      next: ${{ steps.route.outputs.next }}
      baseline: ${{ steps.route.outputs.baseline }}
      run_id: ${{ steps.route.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
    steps:
      # Phase-4 runtime guard: even if the REAL workflow file ever lands on the default branch,
      # a dispatch on that ref cannot start research (and spends nothing). The escape hatch is a
      # deliberate repository variable — the cutover switch, set only after independent review.
      - name: Guard — research never starts from the default branch
        if: github.ref_name == github.event.repository.default_branch && vars.WAYPOINT_V2_ON_DEFAULT != 'true'
        run: |
          echo "::error::research-pass-v2 was dispatched on the default branch. The default-branch copy of this workflow is an inert registration stub; run the real pipeline from its feature branch, or set the WAYPOINT_V2_ON_DEFAULT repository variable after an accepted cutover. No research was started and nothing was spent."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resume or start the V2 research branch
        id: branch
        run: node scripts/pipeline.mjs branch --slug "$SLUG" --prefix research-v2

      - name: Init or resume the V2 run
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          node scripts/pipeline-v2.mjs init --slug "$SLUG" --section "$SECTION" --branch "$BRANCH" \
            --model "${{ inputs.model || 'claude-sonnet-5' }}" --effort "${{ inputs.effort || 'high' }}" \
            --critic-model "${{ inputs.critic_model || 'claude-opus-5' }}"

      - name: Attempt budget (bounded)
        id: budget
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline-v2.mjs budget --slug "$SLUG" --branch "$BRANCH"

      - name: File the stuck issue past the cap
        if: steps.budget.outputs.should_run == 'false'
        run: node scripts/pipeline.mjs gate stuck --slug "$SLUG"

      - name: Preflight — check intake for contradictions
        if: steps.budget.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline.mjs gate preflight --slug "$SLUG" --branch "$BRANCH"

      - name: Route to next stage
        id: route
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline-v2.mjs route --slug "$SLUG"

  # ── Pass A ─────────────────────────────────────────────────────────────────
  passA:
    needs: setup
    if: needs.setup.outputs.should_run == 'true' && needs.setup.outputs.next == 'passA'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkpoint stage start
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage passA \
            --model "${{ inputs.model || 'claude-sonnet-5' }}" \
            --effort "${{ inputs.effort || 'high' }}" \
            --branch "$BRANCH"

      - name: Remove repository credentials before untrusted research input is read
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage passA

      - name: Generate the machine-contract capsule
        id: contract
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage passA

      - name: Compose Pass A prompt
        id: prompt
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_SECTION: ${{ inputs.section || 'full pass — all sections' }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-passA-v2.md > /dev/null

      - name: Replace repository history with an unprivileged local workspace
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Pass A
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          WP_EFFORT: ${{ inputs.effort || 'high' }}
          WP_TOOLS: Read(//workspace/**),Edit(//workspace/**),Glob,Grep,WebSearch,WebFetch
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**),WebFetch(domain:r.jina.ai),WebFetch(domain:webcache.googleusercontent.com),WebFetch(domain:cachedview.nl),WebFetch(domain:12ft.io),WebFetch(domain:web.archive.org),WebFetch(domain:translate.googleusercontent.com)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      - name: Checkout a fresh control-plane copy after Pass A
        if: always()
        id: collect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      # Validate the owed artifact, commit the work, checkpoint completion — or record the
      # failure (void → one bounded auto-retry below).
      # set +e: a failed collection must still reach finish-stage, which records the failure
      # (with the validator's field-level findings as durable retry feedback) and pushes it —
      # aborting on collect left the stage "running" and the feedback unpushed (canary attempt 2).
      - name: Validate, commit, checkpoint
        id: finish
        working-directory: collect
        run: |
          npm ci
          git config user.name "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          node scripts/pipeline-v2.mjs collect-stage --slug "$SLUG" --stage passA --from "$GITHUB_WORKSPACE" --branch "$BRANCH"
          COLLECT=$?
          SCOPED=()
          if [ -n "$SECTION" ]; then SCOPED=(--scoped); fi
          node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage passA \
            --branch "$BRANCH" "${SCOPED[@]}"
          FINISH=$?
          if [ "$COLLECT" -ne 0 ] || [ "$FINISH" -ne 0 ]; then exit 1; fi

      - name: Record agent failure honestly
        if: (failure() || cancelled()) && steps.collect.outcome == 'success' && steps.finish.conclusion != 'failure'
        working-directory: collect
        run: |
          CLASS=gate-failure
          DETAIL="control-plane step failed; branch resumes this stage"
          if [ "${{ steps.agent.conclusion }}" = "failure" ]; then CLASS=agent-failure; DETAIL="agent failed; branch resumes this stage"; fi
          if [ "${{ steps.agent.conclusion }}" = "cancelled" ]; then CLASS=cancelled; DETAIL="agent was cancelled; branch resumes this stage"; fi
          node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage passA \
            --class "$CLASS" --detail "$DETAIL" \
            --branch "$BRANCH"

      - name: Bounded auto-retry after a void stage
        if: failure() && steps.finish.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --branch "$BRANCH"

      - name: Re-dispatch once
        if: failure() && steps.retry.outputs.allowed == 'true'
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f void_retry=true

  # ── Pass B — mechanically isolated ─────────────────────────────────────────
  passB:
    needs: [setup, passA]
    # Runs when routing says passB is next, whether passA ran this dispatch or a previous one.
    if: >-
      always() && needs.setup.outputs.should_run == 'true' &&
      (needs.passA.result == 'success' || (needs.passA.result == 'skipped' && needs.setup.outputs.next == 'passB'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      # Control-plane world, used ONLY to checkpoint stage start; deleted before the agent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: .control
      # No `cache: npm` here: this job's first checkout lands in .control/, so there is no
      # package-lock.json at the workspace root and the cache resolver would fail the job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Checkpoint stage start (control-plane checkout)
        working-directory: .control
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage passB \
            --model claude-sonnet-5 --effort "${{ inputs.effort || 'high' }}" \
            --branch "$BRANCH"
      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        working-directory: .control
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage passB

      - name: Generate the machine-contract capsule
        id: contract
        working-directory: .control
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage passB

      - name: Remove the control-plane world before the agent
        run: rm -rf .control

      # THE ISOLATION: the agent's entire world is the baseline commit — Pass A's outputs are
      # not in the tree and (fetch-depth 1) not in history either.
      - name: Checkout the clean baseline workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.baseline }}
          fetch-depth: 1
          persist-credentials: false
      - run: npm ci
      - name: Verify the prepared workspace excludes Pass-A outputs
        run: node scripts/pipeline-v2.mjs verify-passb-workspace --slug "$SLUG" --dest .

      - name: Compose Pass B prompt
        id: prompt
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_RUN_ID: ${{ needs.setup.outputs.run_id }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-passB-v2.md > /dev/null

      - name: Replace git history with a local-only sandbox repository
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Pass B (isolated)
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: claude-sonnet-5
          WP_EFFORT: ${{ inputs.effort || 'high' }}
          WP_TOOLS: Read(//workspace/**),Edit(//workspace/**),Glob,Grep,WebSearch,WebFetch
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**),WebFetch(domain:github.com),WebFetch(domain:api.github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:githubusercontent.com),WebFetch(domain:r.jina.ai),WebFetch(domain:webcache.googleusercontent.com),WebFetch(domain:cachedview.nl),WebFetch(domain:12ft.io),WebFetch(domain:web.archive.org),WebFetch(domain:translate.googleusercontent.com)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      # The workflow — not Pass B — validates and transfers the artifact, then commits. The
      # control-plane checkout happens AFTER the agent (always(), so failure recording has a
      # world to write to even when the agent step failed).
      - name: Checkout the run branch for collection
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      - name: Transfer the Pass B artifact
        id: transfer
        working-directory: collect
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          node scripts/pipeline-v2.mjs collect-passb --slug "$SLUG" --from "$GITHUB_WORKSPACE" --branch "$BRANCH"
          COLLECT=$?
          node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage passB --branch "$BRANCH"
          FINISH=$?
          if [ "$COLLECT" -ne 0 ] || [ "$FINISH" -ne 0 ]; then exit 1; fi

      - name: Record agent failure honestly
        if: (failure() || cancelled()) && steps.transfer.conclusion != 'failure'
        working-directory: collect
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLASS=gate-failure
          DETAIL="control-plane step failed; branch resumes this stage"
          if [ "${{ steps.agent.conclusion }}" = "failure" ]; then CLASS=agent-failure; DETAIL="agent failed; branch resumes this stage"; fi
          if [ "${{ steps.agent.conclusion }}" = "cancelled" ]; then CLASS=cancelled; DETAIL="agent was cancelled; branch resumes this stage"; fi
          node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage passB \
            --class "$CLASS" --detail "$DETAIL" \
            --branch "$BRANCH"

      - name: Bounded auto-retry after a void stage
        if: failure() && steps.transfer.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --branch "$BRANCH"

      - name: Re-dispatch once
        if: failure() && steps.retry.outputs.allowed == 'true'
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f void_retry=true

  # ── Reconcile ──────────────────────────────────────────────────────────────
  reconcile:
    needs: [setup, passB]
    if: >-
      always() && needs.setup.outputs.should_run == 'true' &&
      (needs.passB.result == 'success' || (needs.passB.result == 'skipped' && needs.setup.outputs.next == 'reconcile'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkpoint stage start
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage reconcile \
            --model "${{ inputs.model || 'claude-sonnet-5' }}" \
            --effort "${{ inputs.effort || 'high' }}" --branch "$BRANCH"

      - name: Remove repository credentials before untrusted research input is read
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage reconcile

      - name: Generate the machine-contract capsule
        id: contract
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage reconcile

      - name: Compose reconcile prompt
        id: prompt
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_SECTION: ${{ inputs.section || 'full pass — all sections' }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-reconcile-v2.md > /dev/null

      - name: Replace repository history with an unprivileged local workspace
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Reconcile
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          WP_EFFORT: ${{ inputs.effort || 'high' }}
          WP_TOOLS: Read(//workspace/**),Edit(//workspace/**),Glob,Grep,WebSearch,WebFetch
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**),WebFetch(domain:r.jina.ai),WebFetch(domain:webcache.googleusercontent.com),WebFetch(domain:cachedview.nl),WebFetch(domain:12ft.io),WebFetch(domain:web.archive.org),WebFetch(domain:translate.googleusercontent.com)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      - name: Checkout a fresh control-plane copy after reconcile
        if: always()
        id: collect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      # A failed collection still reaches finish-stage so the validator's findings become
      # durable, pushed retry feedback (the canary-attempt-2 lesson). An offline-verify failure
      # keeps the old semantics: the stage stays running and re-runs.
      - name: Collect, verify offline, checkpoint
        id: finish
        working-directory: collect
        run: |
          npm ci
          git config user.name "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          node scripts/pipeline-v2.mjs collect-stage --slug "$SLUG" --stage reconcile --from "$GITHUB_WORKSPACE" --branch "$BRANCH"
          COLLECT=$?
          if [ "$COLLECT" -eq 0 ]; then
            npm run verify -- --slug "$SLUG" || exit 1
          fi
          SCOPED=()
          if [ -n "$SECTION" ]; then SCOPED=(--scoped); fi
          node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage reconcile \
            --branch "$BRANCH" "${SCOPED[@]}"
          FINISH=$?
          if [ "$COLLECT" -ne 0 ] || [ "$FINISH" -ne 0 ]; then exit 1; fi

      - name: Record agent failure honestly
        if: (failure() || cancelled()) && steps.collect.outcome == 'success' && steps.finish.conclusion != 'failure'
        working-directory: collect
        run: |
          CLASS=gate-failure
          DETAIL="control-plane step failed; branch resumes this stage"
          if [ "${{ steps.agent.conclusion }}" = "failure" ]; then CLASS=agent-failure; DETAIL="agent failed; branch resumes this stage"; fi
          if [ "${{ steps.agent.conclusion }}" = "cancelled" ]; then CLASS=cancelled; DETAIL="agent was cancelled; branch resumes this stage"; fi
          node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage reconcile \
            --class "$CLASS" --detail "$DETAIL" \
            --branch "$BRANCH"

      - name: Bounded auto-retry after a void stage
        if: failure() && steps.finish.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --branch "$BRANCH"

      - name: Re-dispatch once
        if: failure() && steps.retry.outputs.allowed == 'true'
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f void_retry=true

  # ── Deterministic geocoding (blocker 1D) — after Reconcile, before the Critic ──
  # No agent runs in this job; PLACES_API_KEY is scoped to the single lookup step and research
  # agents never see it. Idempotent: complete items are skipped, refusals stay honest blanks,
  # and the attempt report distinguishes "attempted but unresolved" from "never attempted".
  geocode:
    needs: [setup, reconcile]
    if: >-
      always() && needs.setup.outputs.should_run == 'true' &&
      (needs.reconcile.result == 'success' || (needs.reconcile.result == 'skipped' && needs.setup.outputs.next == 'critic'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deterministic geocode pass (Places key scoped to THIS step only)
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          if [ -z "$PLACES_API_KEY" ]; then
            echo "PLACES_API_KEY is not configured — geocoding NOT attempted (the absent report says so honestly)."
            exit 0
          fi
          node scripts/geocode-venues.mjs --slug "$SLUG" --write --report "guides-intake/$SLUG/geocode.v2.json"

      - name: Commit applied coordinates + attempt report
        run: |
          git add "src/content/guides/$SLUG" || true
          git add "guides-intake/$SLUG/geocode.v2.json" || true
          if ! git diff --cached --quiet; then
            git commit -m "research-v2($SLUG): deterministic geocode pass"
            git push origin "HEAD:$BRANCH"
          else
            echo "geocode pass changed nothing to commit."
          fi

  # ── Critic — mechanically blind ────────────────────────────────────────────
  critic:
    needs: [setup, geocode]
    if: >-
      always() && needs.setup.outputs.should_run == 'true' &&
      (needs.geocode.result == 'success' || (needs.geocode.result == 'skipped' && needs.setup.outputs.next == 'critic'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
    steps:
      # fetch-depth 1: prior git history is mechanically absent from the critic's world.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkpoint stage start
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          node scripts/pipeline-v2.mjs begin-stage --slug "$SLUG" --stage critic \
            --model "${{ inputs.critic_model || 'claude-opus-5' }}" \
            --effort "${{ inputs.effort || 'high' }}" --branch "$BRANCH"

      - name: Stage retry feedback (validator data, this stage only)
        id: feedback
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage critic

      - name: Generate the machine-contract capsule
        id: contract
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage critic

      - name: Build the critic's source-domain fetch policy
        id: fetch_policy
        run: node scripts/pipeline-v2.mjs critic-fetch-tools --slug "$SLUG"

      - name: Prepare the critic's blind input
        run: node scripts/pipeline-v2.mjs prepare-critic --slug "$SLUG"

      - name: Remove repository credentials before the blind critic runs
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Compose critic prompt
        id: prompt
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_FEEDBACK: ${{ steps.feedback.outputs.findings }}
          WP_CONTRACT: ${{ steps.contract.outputs.capsule }}
        run: node scripts/pipeline.mjs prompt prompts/research-critic-v2.md > /dev/null

      - name: Replace git history with a local-only sandbox repository
        run: |
          rm -rf .git
          git init
          git config user.name "waypoint-agent-sandbox"
          git config user.email "sandbox@invalid"
          git add -A
          git commit -m "sandbox baseline"

      - name: Run research agent — Critic
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_PROMPT: ${{ steps.prompt.outputs.text }}
          WP_MODEL: ${{ inputs.critic_model || 'claude-opus-5' }}
          WP_EFFORT: ${{ inputs.effort || 'high' }}
          WP_TOOLS: ${{ steps.fetch_policy.outputs.tools }}
          WP_DENY: Read(//proc/**),Read(//sys/**),Read(//dev/**),Edit(//proc/**),Edit(//sys/**),Edit(//dev/**)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            --workdir /workspace -e HOME=/tmp -e CLAUDE_CODE_OAUTH_TOKEN -e WP_PROMPT -e WP_MODEL -e WP_EFFORT -e WP_TOOLS -e WP_DENY \
            node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 \
            sh -lc 'npx --yes @anthropic-ai/claude-code@2.1.233 --safe-mode --no-session-persistence -p "$WP_PROMPT" --model "$WP_MODEL" --effort "$WP_EFFORT" --allowedTools "$WP_TOOLS" --disallowedTools "$WP_DENY"'

      - name: Checkout a fresh control-plane copy after the critic
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          path: collect

      # Deterministic tail the V1 critic used to run itself: palette + composition are code.
      - name: Collect allowed output, compose, validate, commit, checkpoint
        id: finish
        working-directory: collect
        run: |
          set +e
          npm ci
          RC=$?
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$RC" -eq 0 ]; then rsync -a --delete "$GITHUB_WORKSPACE/src/content/guides/$SLUG/" "src/content/guides/$SLUG/"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then cp "$GITHUB_WORKSPACE/guides-intake/$SLUG/ledger.md" "guides-intake/$SLUG/ledger.md"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then cp "$GITHUB_WORKSPACE/guides-intake/$SLUG/pipeline-patterns.fragment.md" "guides-intake/$SLUG/pipeline-patterns.fragment.md"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then node scripts/pipeline-v2.mjs compound-patterns --slug "$SLUG"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then npm run extract-palette -- --slug "$SLUG"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then node scripts/compose-guide.mjs --slug "$SLUG" --write; RC=$?; fi
          if [ "$RC" -eq 0 ]; then npm run verify -- --slug "$SLUG"; RC=$?; fi
          if [ "$RC" -eq 0 ]; then
            node scripts/pipeline-v2.mjs finish-stage --slug "$SLUG" --stage critic --branch "$BRANCH"
          else
            node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage critic --class gate-failure \
              --detail "critic collection, process-memory, compose, or offline verification failed" --branch "$BRANCH"
            exit 1
          fi

      - name: Record agent failure honestly
        if: (failure() || cancelled())
        working-directory: collect
        run: |
          npm ci
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLASS=gate-failure
          DETAIL="control-plane step failed; branch resumes this stage"
          if [ "${{ steps.agent.conclusion }}" = "failure" ]; then CLASS=agent-failure; DETAIL="agent failed; branch resumes this stage"; fi
          if [ "${{ steps.agent.conclusion }}" = "cancelled" ]; then CLASS=cancelled; DETAIL="agent was cancelled; branch resumes this stage"; fi
          node scripts/pipeline-v2.mjs fail-stage --slug "$SLUG" --stage critic \
            --class "$CLASS" --detail "$DETAIL" \
            --branch "$BRANCH"

      - name: Bounded auto-retry after a void stage
        if: failure() && steps.finish.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        id: retry
        working-directory: collect
        run: node scripts/pipeline-v2.mjs auto-retry --slug "$SLUG" --branch "$BRANCH"

      - name: Re-dispatch once
        if: failure() && steps.retry.outputs.allowed == 'true'
        # working-directory: the workspace root's .git was replaced by the agent sandbox (no
        # remotes), so gh cannot resolve the repo there. --ref: without it gh dispatches the
        # DEFAULT branch's copy — the inert stub — instead of this run's own ref. Both observed
        # on canary run 32260514104.
        working-directory: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research-pass-v2.yml --ref "${{ github.ref_name }}" -f slug="$SLUG" \
            -f section="$SECTION" -f model="${{ inputs.model }}" \
            -f effort="${{ inputs.effort }}" -f critic_model="${{ inputs.critic_model }}" \
            -f void_retry=true

  # ── Land — always a draft PR while V2 is being proven ──────────────────────
  land:
    needs: [setup, critic]
    # needs.setup.result guards the canary-observed case: setup fails AFTER its budget step has
    # already emitted should_run=true (outputs of failed jobs remain readable), which used to
    # start a doomed landing job on a run that never routed.
    if: >-
      always() && needs.setup.result == 'success' && needs.setup.outputs.should_run == 'true' &&
      (needs.critic.result == 'success' || (needs.critic.result == 'skipped' && needs.setup.outputs.next == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ inputs.slug }}
      BRANCH: ${{ needs.setup.outputs.branch }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
      PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research-v2[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fail-closed artifact validation BEFORE landing: evidence, dispositions, saturation,
      # coverage. A malformed or missing artifact blocks here.
      - name: Validate V2 artifacts
        id: artifacts
        run: |
          SCOPED=()
          if [ -n "$SECTION" ]; then SCOPED=(--scoped); fi
          node scripts/pipeline-v2.mjs validate --slug "$SLUG" "${SCOPED[@]}"

      # The REAL evidence gate (build + networked verify) runs inside `land --gate`; the
      # scorecard becomes the PR body. --land pr: a V2 run NEVER auto-merges or publishes.
      - name: Land as a draft PR
        id: evidence_gate
        run: |
          node scripts/pipeline.mjs land --slug "$SLUG" \
            --branch "$BRANCH" --gate --land pr \
            --title "Research pass (V2): $SLUG"

      - name: Record the real landing gate PASS
        if: success()
        run: node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status passed --branch "$BRANCH"

      - name: Record the real landing gate failure
        if: failure()
        run: |
          node scripts/pipeline-v2.mjs landing-gate --slug "$SLUG" --status failed \
            --detail "artifact, build, or configured network evidence gate failed" --branch "$BRANCH" || true
