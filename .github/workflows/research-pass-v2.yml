        if: steps.begin.outputs.replay != 'true'
        run: node scripts/pipeline-v2.mjs stage-feedback --slug "$SLUG" --stage critic

      - name: Generate the machine-contract capsule
        id: contract
        if: steps.begin.outputs.replay != 'true'
        run: node scripts/pipeline-v2.mjs contract --slug "$SLUG" --stage critic

      - name: Build the critic's source-domain fetch policy
        id: fetch_policy
        if: steps.begin.outputs.replay != 'true'
        run: node scripts/pipeline-v2.mjs critic-fetch-tools --slug "$SLUG"

