name: One-time design consolidation CI repair

on:
  push:
    branches:
      - claude/waypoint-design-routing-rex0vr
    paths:
      - .github/workflows/one-time-consolidation-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Carlob2499/Trip-Guides'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repair consolidation fallout
        shell: bash
        run: |
          set -euo pipefail

          # Preserve the machine-facing drift gate without restoring the deleted human design handoff.
          git show b37fe92a12e56a01e795d5bb84c5f38c99aa439e:docs/design-handoff/enforcement/check-drift.mjs > scripts/check-design-drift.mjs

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "scripts/drift-real.mjs",
              "`docs/design-handoff/enforcement/check-drift.mjs` is a vendored kit tool.",
              "`scripts/check-design-drift.mjs` is the preserved machine-facing drift checker."
          )
          replace(
              "scripts/drift-real.mjs",
              'const CHECKER = "docs/design-handoff/enforcement/check-drift.mjs";',
              'const CHECKER = "scripts/check-design-drift.mjs";'
          )
          replace("scripts/drift-real.mjs", "docs/reference/motion.md", "docs/reference/design-system.md")
          replace("scripts/compose-guide.mjs", "docs/reference/visual-redesign.md", "docs/reference/design-system.md")
          replace("scripts/__tests__/compose-guide.test.mjs", "docs/archive/visual-redesign-history.md", "docs/reference/design-system.md")
          replace("scripts/extract-palette.mjs", "docs/reference/motion.md", "docs/reference/design-system.md")

          skill_old = """This skill owns presentation, not destination truth.\n\n- Preserve factual guide values verbatim during presentation work.\n- Creating/correcting/verifying prices, hours, venues, transit, events, itineraries or recommendations belongs to `waypoint-guide-author`."""
          skill_new = """This skill owns presentation-only work, not destination truth.\n\n- Preserve every fact value verbatim during presentation-only work.\n- Creating, correcting, or verifying destination facts—including prices, hours, venues, transit, events, itineraries, or recommendations—belongs to `waypoint-guide-author`."""
          for skill in [".agents/skills/waypoint-design/SKILL.md", ".claude/skills/waypoint-design/SKILL.md"]:
              replace(skill, skill_old, skill_new)

          inv = Path("scripts/check-project-invariants.mjs")
          text = inv.read_text()
          retired = {
              '"docs/reference/motion.md"': '["docs", "reference", "motion.md"].join("/")',
              '"docs/reference/motion-anchors.md"': '["docs", "reference", "motion-anchors.md"].join("/")',
              '"docs/reference/search-ui-final.md"': '["docs", "reference", "search-ui-final.md"].join("/")',
              '"docs/reference/sos-ui-final.md"': '["docs", "reference", "sos-ui-final.md"].join("/")',
              '"docs/reference/visual-redesign.md"': '["docs", "reference", "visual-redesign.md"].join("/")',
              '"docs/research/waypoint-design-reference-packet.md"': '["docs", "research", "waypoint-design-reference-packet.md"].join("/")',
              '"docs/archive/visual-redesign-history.md"': '["docs", "archive", "visual-redesign-history.md"].join("/")',
          }
          for old, new in retired.items():
              if old not in text:
                  raise SystemExit(f"expected invariant retired path missing: {old}")
              text = text.replace(old, new)
          inv.write_text(text)
          PY

          git config user.name "Waypoint CI repair"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/check-design-drift.mjs scripts/drift-real.mjs scripts/compose-guide.mjs scripts/__tests__/compose-guide.test.mjs scripts/extract-palette.mjs scripts/check-project-invariants.mjs .agents/skills/waypoint-design/SKILL.md .claude/skills/waypoint-design/SKILL.md
          git commit -m "fix(design): close consolidation CI debt"
          git push origin HEAD:claude/waypoint-design-routing-rex0vr
