name: Ensure repo labels

# Guarantees the labels the automation depends on actually exist. GitHub issue templates can only
# APPLY labels that already exist — they never create them — so without this the New-guide form
# would silently fail to trigger its workflow.
#
# There are no *-approved labels. Every request here is the creator's own, filed through the
# creator's own template: a second label saying "yes, really" was a gate that always opened. The
# request label IS the trigger. What survives is the one gate that isn't ceremony — needs-decision,
# which a run applies to itself when it hits a fork only the creator can settle.
#
# Runs on setup (the first push adding this file matches the path filter) and on demand from the
# Actions tab. Idempotent via `gh label create --force`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ensure-labels.yml
      - .github/ISSUE_TEMPLATE/new-guide.yml
      - .github/ISSUE_TEMPLATE/modify-guide.yml
      - .github/ISSUE_TEMPLATE/revise-guide.yml
      - .github/workflows/research-pass.yml
      - .github/workflows/change.yml
      - .github/workflows/recert.yml
      - .github/workflows/feedback-export.yml
      - .github/workflows/deploy.yml
      - .github/workflows/pretrip-check.yml

# Label management lives under the issues API — that's all this needs.
permissions:
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # --force creates the label if missing, updates colour/description if present.
        run: |
          gh label create new-guide \
            --color 0E8A16 \
            --description "Triggers the new-guide scaffold workflow" \
            --force
          gh label create content-audit \
            --color FBCA04 \
            --description "Automated weekly content-audit tracking issue" \
            --force
          gh label create modify-request \
            --color 0E8A16 \
            --description "Runs a scoped content edit on a guide (change.yml, source: request)" \
            --force
          gh label create revision-request \
            --color 0E8A16 \
            --description "Runs a MAJOR revision — broader than a scoped edit (change.yml, source: request)" \
            --force
          gh label create revision-auto-filed \
            --color C5DEF5 \
            --description "Proposed by the feedback-synthesis pass — inert until the owner adds revision-request" \
            --force
          gh label create needs-decision \
            --color D93F0B \
            --description "A run paused on a fork only the owner can settle — answer in the thread, then re-run" \
            --force
          gh label create stuck \
            --color D93F0B \
            --description "An automated run hit its attempt cap without reaching a clean finish" \
            --force
          gh label create deploy-verification \
            --color B60205 \
            --description "Post-deploy verify-live check found a published guide missing from the live site" \
            --force
          gh label create auto-published \
            --color 5319E7 \
            --description "A guide auto-published (verified) with no human approval — a vetoable heads-up" \
            --force
          gh label create pretrip-check \
            --color FBCA04 \
            --description "The daily pre-trip tracking issue — guides entering their T-7 departure window with stale facts" \
            --force
          gh label create stabilization \
            --color 1D76DB \
            --description "September feature-freeze exception: bounded stabilization work, not a new feature" \
            --force
          gh label create release-blocker \
            --color B60205 \
            --description "September code-freeze exception: correctness/security/data-integrity/release blocker" \
            --force
          gh label create freeze-waiver \
            --color 5319E7 \
            --description "Explicit owner waiver for an otherwise frozen September engineering change" \
            --force
