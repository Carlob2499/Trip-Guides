name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # P5: gate the deploy on typecheck too — previously only test.yml (a parallel, non-required
      # check) ran it, so the pipeline could push straight to a main deploy regardless of
      # typecheck's result.
      - run: npm run typecheck
      # Refresh public-holiday data (Nager.Date) before building. The script is
      # self-healing: on any fetch error it keeps the committed JSON, so the build
      # always proceeds with last-good data.
      - run: node scripts/fetch-holidays.mjs
      # Google Maps browser key (optional). When the repo secret exists, guides
      # build with the Google Maps provider; when absent, the keyless
      # OpenStreetMap iframe embedded in each map section stands as the map
      # (src/features/maps/ never boots). The key is a PUBLIC browser key —
      # restrict it by HTTP referrer + API in Google Cloud Console; the secret
      # only keeps it out of the repo.
      - run: npm run build
        env:
          PUBLIC_GMAPS_KEY: ${{ secrets.PUBLIC_GMAPS_KEY }}
          PUBLIC_GMAPS_MAP_ID: ${{ secrets.PUBLIC_GMAPS_MAP_ID }}
      # Performance budget — fail the deploy if bundles bloat past budget.
      - run: node scripts/check-perf-budget.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ONE attempt, with a timeout that outlasts the Pages queue.
      #
      # The retry chain that used to live here (2026-08-06) was written for a
      # DIFFERENT failure — "Deployment failed, try again later", a genuine
      # Pages-side transient. Against the failure this repo actually hits it was
      # not just useless but harmful, because deploy-pages CANCELS the deployment
      # it created when it times out, and the deployment ID *is* the commit SHA:
      #
      #   Timeout reached, aborting! / Canceling Pages deployment...
      #   Canceled deployment with ID e0c787f…
      #   (retry) Created deployment for e0c787f…, ID: e0c787f…
      #   (retry) ##[error]Deployment cancelled.     ← 5 seconds later, always
      #
      # A retry re-submits the same ID and is handed back the record the previous
      # attempt just cancelled, so it can never succeed. Worse, it left the
      # deployment half-alive and the NEXT push failed on "due to in progress
      # deployment. Please cancel <prev sha> first" — four consecutive red runs
      # (43a05fa, f2f7fad, 5f3e52f, e0c787f) while the site itself was fine.
      #
      # The real failure was simply a slow Pages queue: deployments sat in
      # `deployment_queued` for ~12.5 min against the action's 10-min default and
      # landed a minute after the workflow gave up. So: wait longer, once.
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          timeout: 900000 # 15 min (ms) — default is 10, observed queue was ~12.5

  # "Did it actually land?" — the check whose absence let a finished guide sit invisible
  # for a day (every internal gate was green; nobody confirmed the live page). This runs
  # AFTER deploy against the real production URL: it fetches each guide the repo says is
  # published and confirms it's both reachable and linked from the homepage. verify-live.mjs
  # retries internally for CDN propagation lag, so a transient miss self-heals; a persistent
  # one turns this run red AND files an issue, so a missing guide can never go unnoticed again.
  #
  # It runs even when `deploy` reports failure. On 2026-08-06 the deploy job went red four
  # times while the site was in fact live and correct — and because this job was gated on
  # deploy succeeding, it SKIPPED on all four, so the one check that could have said "the
  # site is fine" stayed silent exactly when it was needed. A red deploy is a claim about
  # the deploy step; only this job is a claim about the site. Gated on `build` instead: no
  # artifact means there was nothing to land and nothing to verify.
  verify-live:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm ci needed — verify-live.mjs uses only Node built-ins + global fetch.
      - id: check
        run: node scripts/verify-live.mjs
      # On a real, sustained failure: open (or update) a single tracking issue so it's
      # impossible to miss. The red X above is the primary signal; this is the paper trail.
      - name: File a live-site mismatch issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "🚨 Live site does not match what the repo says is published";
            const body = [
              "`verify-live` failed after a deploy: a guide is marked published in the repo but is not",
              "actually reachable and linked on the live site.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Reproduce locally: `npm run verify-live`",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "deploy-verification",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["deploy-verification"],
              });
            }
