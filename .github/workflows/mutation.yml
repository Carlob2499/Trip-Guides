name: Mutation testing

# Deliberately break the source, one small change at a time, and check whether any test notices.
# A green suite proves the tests RAN; this proves they would CATCH something — the difference
# between a test that guards behaviour and one that merely asserts a shape.
#
# WEEKLY, not per-push, and NON-BLOCKING on purpose. It takes ~3 minutes locally over 6000
# mutants and the number is meant to be read, not enforced: a mutation score is a map of the thin
# ice, not a grade, and gating on it would push people to write tests that satisfy the metric.
# The output is docs/generated/where-the-tests-are-blind.md, which is the thing worth reading.
#
# Scope is stryker.config.json: the pure model logic (src/features/*/model, src/lib) where a
# silently wrong answer is possible and expensive. UI and build scripts are excluded — their real
# failures are geometry and integration, which the visual specs and the CLAUDE.md boundary checks
# cover instead.
# De-cronned 2026-08-14 (workflow-noise cleanup): mutation runs are a diagnostic you
# ask for, not a weekly bill. Dispatch it after meaningful model/lib changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The config file is named rather than left to discovery (CLAUDE.md boundary check 4: the
      # repo already lost a deploy to a stray config winning a resolution race). Stryker takes it
      # as a POSITIONAL argument — there is no --config flag, and passing one exits 1 in a second.
      - run: npx stryker run stryker.config.json
      - run: node scripts/mutation-report.mjs
      - name: Commit the report if it moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/where-the-tests-are-blind.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(tests): refresh the mutation-testing report"
          # A weekly job can land on a main that moved since checkout; rebase rather than fail
          # the run over a docs commit.
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
