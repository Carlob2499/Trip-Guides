name: Model smoke test

# Boundary check #3 (CLAUDE.md): smoke the real integration the moment it exists. ONE tiny
# headless claude-code-action invocation against a chosen model id — exists to answer, in
# ~2 minutes and a few hundred tokens, whether a model (first target: claude-fable-5) is
# available to this action headless, before a multi-hour research pass bets a whole stage
# on it. No repo writes, no side effects; the step's success/failure IS the result.
#
# Usage: Actions → Model smoke test → Run workflow → pick the model id.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to smoke-test headless"
        required: false
        type: string
        default: claude-fable-5

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Invoke model headless
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model || 'claude-fable-5' }}
            --allowedTools Read
          prompt: |
            This is a model-availability smoke test. Reply with exactly one line:
            SMOKE OK — model: <the model id you are actually running as>
            Do not read files, do not run tools, do not change anything. Stop after that line.

      - name: Result
        run: echo "::notice::Model '${{ inputs.model || 'claude-fable-5' }}' answered headless — smoke PASS (a failed previous step means the model id was rejected)."
