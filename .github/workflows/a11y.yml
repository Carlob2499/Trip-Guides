name: Accessibility

# Post-merge/manual browser safety diagnostic. Pull-request enforcement lives in Required gate so
# the same build + Playwright matrix is not paid twice on every code PR. Push-to-main remains as a
# deployment-adjacent regression signal.
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, learnings/**, guides-intake/**, "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # scripts/fetch-media.mjs downloads the guides' photographs into the build so no reader
      # ever hotlinks Wikimedia. Without a cache every CI run re-downloads all of them, which
      # is slow here and rude to Commons — the exact rate-limit concern that made the old code
      # hotlink at read time in the first place. Keyed on the guide content, so the fetch runs
      # again only when a guide actually changes a photograph.
      - name: Cache guide photographs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .media-cache
          key: media-${{ hashFiles('src/content/guides/**/*.json') }}
          restore-keys: |
            media-
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright test tests/visual/a11y.spec.ts tests/visual/resilience.spec.ts tests/visual/offline-sync.spec.ts
      # D5 gallery baselines — the PR-blocking copy of this step lives in required-gate.yml
      # (this workflow no longer runs on pull_request; see the header above).
      - name: Gallery screenshot baselines
        run: npm run baselines
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gallery-baseline-diffs
          path: test-results/
          retention-days: 7
