name: Accessibility

# Browser safety gate — hub + both guides. Axe owns semantic accessibility; the companion
# resilience spec owns 320px reflow and hostile-content geometry. Both use the same built site
# and Chromium install so one workflow pays the setup cost once.
on:
  pull_request:
    paths-ignore: [docs/**, learnings/**, guides-intake/**, "**.md"]
  push:
    branches: [main]
    paths-ignore: [docs/**, learnings/**, guides-intake/**, "**.md"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright test tests/visual/a11y.spec.ts tests/visual/resilience.spec.ts tests/visual/offline-sync.spec.ts
