name: Accessibility

# Post-merge/manual browser safety diagnostic. Pull-request enforcement lives in Required gate so
# the same build + Playwright matrix is not paid twice on every code PR. Push-to-main remains as a
# deployment-adjacent regression signal.
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, learnings/**, guides-intake/**, "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright test tests/visual/a11y.spec.ts tests/visual/resilience.spec.ts tests/visual/offline-sync.spec.ts
      # D5 gallery baselines — separate step so a visual-regression red is named as such, not
      # buried in the a11y run. Intentional design changes update via `npm run baselines:update`.
      - name: Gallery screenshot baselines
        run: npm run baselines
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-baseline-diffs
          path: test-results/
          retention-days: 7
