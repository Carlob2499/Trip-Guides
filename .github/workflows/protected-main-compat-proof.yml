name: Protected-main bot PR proof

# TEMPORARY release-governance proof for issue #130. It runs once when this file lands on main,
# creates a disposable PR using the repository GITHUB_TOKEN (the exact actor whose recursive PR
# events are suppressed), explicitly dispatches Required gate on that branch, proves the check is
# attached to the exact branch head and succeeds, then closes the PR and deletes the branch.
# No model, guide, selector, publication, or acceptance state is touched.
on:
  push:
    branches: [main]
    paths: [.github/workflows/protected-main-compat-proof.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create disposable automation PR
        id: pr
        run: |
          set -euo pipefail
          branch="proof/protected-main-${GITHUB_RUN_ID}"
          marker="docs/generated/protected-main-proof-${GITHUB_RUN_ID}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          printf '# Protected-main compatibility probe\n\nDisposable marker for workflow run %s.\n' "$GITHUB_RUN_ID" > "$marker"
          git add "$marker"
          git commit -m "test: protected-main automation PR probe"
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "test: protected-main automation PR probe" --body "Disposable zero-Claude compatibility probe for issue #130. Do not merge.")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Dispatch always-reporting required gate
        run: gh workflow run required-gate.yml --ref "${{ steps.pr.outputs.branch }}" -f base=main

      - name: Wait for exact-head required gate
        run: |
          set -euo pipefail
          branch='${{ steps.pr.outputs.branch }}'
          head_sha='${{ steps.pr.outputs.head_sha }}'
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow required-gate.yml --branch "$branch" --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "No workflow_dispatch Required gate found for exact head $head_sha" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
          conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
          [ "$conclusion" = success ] || { echo "Required gate conclusion: $conclusion" >&2; exit 1; }
          pr_head="$(gh pr view '${{ steps.pr.outputs.pr_url }}' --json headRefOid --jq .headRefOid)"
          [ "$pr_head" = "$head_sha" ] || { echo "PR head moved: expected $head_sha, got $pr_head" >&2; exit 1; }

      - name: Clean disposable PR and branch
        if: always()
        run: |
          pr_url='${{ steps.pr.outputs.pr_url }}'
          branch='${{ steps.pr.outputs.branch }}'
          if [ -n "$pr_url" ]; then gh pr close "$pr_url" || true; fi
          if [ -n "$branch" ]; then git push origin --delete "$branch" || true; fi
