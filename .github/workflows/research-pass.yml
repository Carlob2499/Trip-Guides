name: Research pass

# Autonomous research pass: up to SIX Claude Code agents research one guide via the dual-pass
# procedure (Agent 1: Pass A canonical/verified → Agent 2: Pass B local/authentic/crowd-aware,
# STRUCTURALLY BLIND to Pass A → Agent 3: reconcile + verify loop → Agent 4 [vibe_pass]:
# Fable vibe critic, judgment-only findings → Agent 5 [if findings]: Opus vibe executor →
# Agent 6: fresh-context rubric critic + auto-graduate). Each agent is a separate invocation —
# Pass B cannot read Pass A's guide output, and the critics cannot see the research process,
# only the finished product + intake spec. This enforces independence at the infrastructure
# level (P2/F3: Japan proved prompt-only independence is not a guarantee; P3/R8: the critic
# catches what researchers can't see from inside the process).
# MODEL MAP: Pass B is always Sonnet; the `model` input governs A + reconcile; `critic_model`
# (default Opus — judgment work per research-efficiency.md) governs the rubric critic; the
# vibe critic is pinned Fable and its executor pinned Opus (critique high, execute strong).
# The vibe pair is EXPERIMENTAL and gated by `vibe_pass`; the Fable model id has not yet been
# proven available to this action headless, so that step is continue-on-error by design —
# if it fails, an IDENTICAL Opus 5 vibe critic runs as the fallback (creator's call,
# 2026-07-30: degrade the model, never the pass). Only a double failure skips the vibe pass.
#
# SINGLE SOURCE OF TRUTH (2026-07-30): agent prompts here are POINTERS — each carries only its
# stage's I/O contract (paths, checkpoints, forbidden reads, stop conditions) and instructs the
# agent to read .claude/skills/waypoint-guide-author/ (SKILL.md + references/, incl.
# pipeline-roles.md for the vibe lens / critic protocol / question emitter). Editing the skill
# edits the pipeline; never restate skill doctrine in a prompt. The "Critic artifact gate" step
# hard-fails any run whose critic ended without `## Critic findings` + `## Citation audit`.
#
# Auto-graduation: the verify PASS is the evidence gate (see scripts/graduate-guide.mjs --slug);
# a guide that passes goes live on the next Pages deploy with ZERO further action. Only a guide
# that DIDN'T reach verify PASS lands as a draft PR for human triage. Trigger via workflow_dispatch.
#
# RESUMABLE (pipeline P2): a full dual pass is long and can be cut off by the Action wall-clock or
# your Max usage window. The agent commits + checkpoints (guides-intake/<slug>.state.json) after
# EACH stage, and this job resumes the research/<slug> branch — so a re-run picks up at the next
# un-done stage (`npm run pipeline -- --slug <slug> --status`) instead of restarting.
#
# ENFORCED, not merely asked (P1 — the first real run proved a prompt mandate is not a guarantee):
#   · pipeline.mjs's --checkpoint REFUSES a stage whose predecessor is not committed at HEAD, so
#     batching stages fails at the moment it is attempted, not in a post-mortem.
#   · the "Run-integrity gate" step below audits what this run actually did — no durable output at
#     all (VOID), or stages recorded in one burst — and fails the workflow either way.
#
# Runs on your Claude MAX subscription (not a pay-per-use API key), so a headless run costs ~$0
# marginal against your plan. Prerequisites:
#   - CLAUDE_CODE_OAUTH_TOKEN secret set in repo Settings → Secrets → Actions.
#     Generate it once locally with `claude setup-token` (Pro/Max only) and paste the value.
#   - The guide's scaffold exists at src/content/guides/<slug>/ (_guide.json + NN-*.json)
#
# Usage: Actions → Research pass → Run workflow → enter slug (and optionally section)
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Guide slug (e.g. japan, sweden). Must match src/content/guides/<slug>/"
        required: true
        type: string
      section:
        description: "Section key to focus on (e.g. food, sights). Leave blank for a full pass."
        required: false
        type: string
        default: ""
      model:
        description: "Model for the research agent. Sonnet is the default (research is Sonnet work — see references/research-efficiency.md); pick Opus only for a genuinely contested reconcile."
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-5
        default: claude-sonnet-5
      # Boundary check #4 (CLAUDE.md): explicit over ambient. Effort used to be
      # whatever the runner defaulted to — an unnamed knob that silently changes
      # search depth when the environment changes. Default is HIGH for every agent
      # (creator's ruling, 2026-07-30: high, not xhigh — the QA trial showed xhigh's
      # extra depth wasn't buying verification quality, just tokens); xhigh stays a
      # dispatchable option for a deliberately exhaustive one-off. low/medium make
      # the model scope work DOWN to the literal ask — wrong for a full pass.
      effort:
        description: "Reasoning effort. high is the default for every agent; xhigh only for a deliberately exhaustive one-off pass."
        required: false
        type: choice
        options:
          - high
          - xhigh
          - medium
          - max
        default: high
      # Judgment work is Opus work (research-efficiency.md model economy; HANDOFF operating
      # rules) — so the rubric critic gets its own knob instead of riding the research
      # model. Research stays Sonnet-cheap while the final gate thinks harder.
      critic_model:
        description: "Model for the fresh-context rubric critic (Agent 6). Opus is the doctrine default for judgment work; Sonnet for a cheap re-run; Fable to experiment."
        required: false
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-fable-5
        default: claude-opus-5
      # EXPERIMENTAL (creator, 2026-07-30): a Fable "vibe" critic — common-sense/flow
      # judgment only, no edits — whose findings a pinned-Opus executor implements under
      # full verification discipline. Off = the proven 4-agent chain, untouched.
      vibe_pass:
        description: "Run the experimental Fable vibe critic + Opus executor between verify and the rubric critic."
        required: false
        type: boolean
        default: true
      # P1/F2: set ONLY by this workflow's own auto-retry dispatch after a VOID run (an agent
      # session that produced no durable output at all). It exists to make the retry strictly
      # once — a second void run with this already true files the stuck issue instead of
      # re-dispatching forever. Humans should never set it.
      void_retry:
        description: "Internal — set by the auto-retry after a void run. Leave false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# M0/B3: rapid re-dispatches (or two dispatches for the same slug) would otherwise race the
# same research/<slug> branch — each bump-commit-push cycle able to collide with the other's.
concurrency:
  group: research-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # A4: job-level so it's in scope for every step INCLUDING the agent action below (whose
    # own bash tool calls inherit the job's environment) — was hardcoded identically here,
    # in graduate-guide.yml, new-guide.yml, astro.config.mjs, and verify-live.mjs.
    # M0/B3: GH_TOKEN here too — land-branch.sh and the prompt's own `gh issue`/`gh pr` calls
    # run inside the agent's Bash tool, which inherits this job's environment; unset, `gh`
    # inside the agent has no credential and every gh call in the prompt would fail unproven.
    env:
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # S3: inputs.slug becomes a branch name, a path segment, and a bash/agent-prompt
      # string in every step below — validate it here, first, via env: (never
      # interpolated straight into a shell string) so an invalid slug never reaches any
      # of those sinks.
      - name: Validate slug input
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          node --input-type=module -e "
            import { isValidSlug } from './scripts/lib/slug.mjs';
            if (!isValidSlug(process.env.SLUG)) { console.error('Invalid slug:', process.env.SLUG); process.exit(1); }
          "

      # Resume the research branch if a prior (cut-off) run created it, so the agent starts with the
      # committed partial progress + checkpoint state in the working tree; otherwise start it fresh.
      # P1: this MUST happen before any state-file mutation below — bumping the attempt count on
      # `main` first, then checking out this branch, made `git checkout` abort on the modified
      # state file (every resumed run went red before the agent even started).
      - name: Resume or start the research branch
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          BR="research/${SLUG}"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            git fetch origin "$BR" && git checkout "$BR"
            echo "Resumed $BR"
          else
            git checkout -b "$BR"
            echo "Started $BR"
          fi

      # Circuit breaker (docs/PIPELINE.md P2 spine): a headless run that keeps getting cut off
      # before reaching `verified` should eventually stop and ask a human instead of silently
      # resuming forever. Runs BEFORE the agent so a stuck guide never spends agent tokens.
      # P2: attempts are read/bumped and COMMITTED on THIS branch (research/<slug>), not on
      # main — previously the bump only ever landed on main via a later merge that a failing
      # guide never reaches, so main's copy of the state file stayed at attempts: 0 forever and
      # the circuit breaker could never trip. Committing here, on the branch, right after the
      # bump, is what makes the cap real.
      - name: Attempt budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          NEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status --json | jq -r '.nextStage')
          if [ "$NEXT" = "null" ]; then
            echo "[budget] $SLUG already reached verified — nothing to do."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ATTEMPTS=$(node scripts/pipeline.mjs --slug "$SLUG" --bump-attempt --json | jq -r '.attempts')

          # Persist the bumped attempt count on THIS branch now, so it survives even if this run
          # is cut off before the agent commits anything else — the circuit breaker's memory
          # must not depend on the agent ever reaching a commit step.
          if ! git diff --quiet -- "guides-intake/${SLUG}.state.json"; then
            git add "guides-intake/${SLUG}.state.json"
            git commit -m "chore(pipeline): attempt ${ATTEMPTS}"
            git push origin "HEAD:research/${SLUG}"
          fi

          # M0/B9: trips the run AFTER the cap-th attempt (attempts > CAP), so the message names
          # the actual triggering count, not CAP itself — "cap: 5" read as "stops after 5" when
          # it stops after 6.
          CAP=5
          if [ "$ATTEMPTS" -gt "$CAP" ]; then
            echo "[budget] $SLUG has been attempted $ATTEMPTS times without reaching verified (exceeds cap of $CAP) — flagging instead of continuing."
            TITLE="Research stuck: $SLUG"
            STATUS_TEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status)
            BODY=$(printf 'Automated research has run **%s** times for `%s` without reaching `verified`.\n\nCurrent status:\n```\n%s\n```\n\nThis destination may be genuinely hard to source (bot-blocked, sparse coverage) or stuck on one fact. Check `guides-intake/%s.md` and the `research/%s` branch, then either finish it by hand or re-run this workflow to keep trying — the attempt count only resets if `guides-intake/%s.state.json` is edited directly (git-tracked, so that is a deliberate act, not automatic).' "$ATTEMPTS" "$SLUG" "$STATUS_TEXT" "$SLUG" "$SLUG" "$SLUG")
            EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "stuck"
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "[budget] $SLUG — attempt $ATTEMPTS of $CAP, proceeding."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      # Social-leads aide (skill references/research-efficiency.md, "Social & video lead
      # sourcing"): yt-dlp lets Pass B pull YouTube
      # TRANSCRIPTS (never media) as T2 leads. Best-effort BY DESIGN — transcripts are an aide,
      # not a dependency: if this install fails, or YouTube blocks the runner's IP at pull time,
      # the pass runs identically without them (the skill's bot-blocked doctrine). That is why
      # continue-on-error is correct here and nothing downstream checks this step's outcome.
      - name: Install yt-dlp (transcript lead sourcing — best-effort)
        if: steps.budget.outputs.should_run == 'true'
        continue-on-error: true
        run: python3 -m pip install --upgrade yt-dlp

      # P1 (F1/F2): the "before" half of the run-integrity gate. Captured AFTER the attempt-budget
      # step's own commit, so the agent's own output is the only thing that can move these numbers.
      - name: Pre-agent snapshot
        id: pre
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: node scripts/check-run-integrity.mjs --slug "$SLUG" --snapshot

      # P2 (F3/R5/R6/R16): the dual-pass research is now THREE separate agent invocations so
      # Pass B is structurally blind to Pass A's findings — not merely asked to ignore them.
      # Route steps between agents check the pipeline status and skip agents whose stage is
      # already cleared (resume-safe). Pass B always runs Sonnet (cheap, parallel-capable later).
      #
      # Shared env/auth for all agent steps — factored into the YAML anchors below.

      - name: Route to next stage
        id: route
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          NEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status --json | jq -r '.nextStage')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "[route] next stage: $NEXT"

      # ── AGENT 1: Pass A (scaffold + passA + Living Atlas duties) ──────────────
      - name: Run research agent — Pass A
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'scaffold' || steps.route.outputs.next == 'passA')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Guide slug: ${{ inputs.slug }}
            Section focus: ${{ inputs.section || 'full pass — all sections' }}

            YOU ARE THE PASS A AGENT — the skill's "Pass A — canonical & verified". This is ONE
            of the pipeline's agent steps (A → B → Reconcile → critics); you handle scaffold +
            passA ONLY. A SEPARATE agent handles Pass B (it cannot see your work), and a third
            reconciles both into the final guide.

            THE LAW — the skill is the single source of truth; this prompt carries only your
            stage contract. Read and follow EXACTLY:
              .claude/skills/waypoint-guide-author/SKILL.md — the spine: Pass A (anchor event
                against a T0 source FIRST, then the backbone; ledger as you go; lookup-tz.mjs in
                the SAME step as coords, tz set explicitly on EVERY guide), fact discipline, the
                Living Atlas duties, the deterministic lookup scripts.
              references/verification-rules.md — source tiers, ≈/⚠ legal states, ship/flag/omit.
              references/research-efficiency.md — the BINDING search budget, fetch discipline,
                and the reserved duty budgets (phrases card ≥3, footage scout ≥2 — the run
                report states what each duty actually used).
              references/block-types.md — section types, tab budget, guide-level typed features,
                voice standard, facets, cover rules.
              references/pipeline-roles.md — "Traveler questions": the emitter you use when
                research hits a real fork (then proceed on the assumption; never block).
            The CLAUDE.md accuracy standard (auto-loaded) is also binding.

            STAGE CONTRACT:
            - Target: the DIRECTORY src/content/guides/${{ inputs.slug }}/ — _guide.json + one
              NN-<group>.json per tab group. NEVER create a flat
              src/content/guides/${{ inputs.slug }}.json (it silently shadows the directory).
            ${{ inputs.section != '' && format('- Scope this pass to the "{0}" section only; leave all other sections as-is.', inputs.section) || '' }}
            - RESUMABLE: start with `npm run pipeline -- --slug ${{ inputs.slug }} --status`;
              do ONLY the un-done stages up to and including passA. Never redo a cleared stage.
            - The Living Atlas duties (SKILL.md's four — facets, descriptors, cover, footage
              scout; mechanics in block-types.md) are part of your passA commit — no separate
              checkpoint.
            - When done, checkpoint and commit:
                npm run pipeline -- --slug ${{ inputs.slug }} --checkpoint passA
                && git add -A && git commit -m "research(${{ inputs.slug }}): Pass A" && git push
            - STOP after passA — Pass B and reconcile belong to separate agents. If you run low
              on wall-clock or usage, stop at a clean committed checkpoint rather than leaving a
              half-done uncommitted stage.
            - Never touch any guide other than src/content/guides/${{ inputs.slug }}/ and its
              guides-intake/${{ inputs.slug }}.md + .state.json.

      # ── Route after Pass A ───────────────────────────────────────────────────
      - name: Route after Pass A
        id: route2
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          NEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status --json | jq -r '.nextStage')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "[route] after Pass A, next stage: $NEXT"

      # ── AGENT 2: Pass B (independent, A-blind, always Sonnet) ────────────────
      # P2/F3/R6: Pass B is a SEPARATE agent invocation that receives ONLY the intake spec
      # and the scaffold's original section list — never the guide content Pass A wrote.
      # This makes independence structural, not prompt-only (Japan proved prompt-only fails).
      # Findings go to guides-intake/<slug>.passB.json; the reconcile agent reads both sources.
      - name: Run research agent — Pass B (independent)
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'passB' || steps.route2.outputs.next == 'passB')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          # P2: Pass B always runs Sonnet (cheap, parallel-capable later) regardless of
          # the model input — the model input governs Pass A and Reconcile only.
          claude_args: |
            --model claude-sonnet-5
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Guide slug: ${{ inputs.slug }}

            YOU ARE THE PASS B AGENT — the skill's "Pass B — local, authentic, crowd-aware".
            You are STRUCTURALLY INDEPENDENT of Pass A: you must NOT read, open, or reference
            ANY file under src/content/guides/${{ inputs.slug }}/. Your findings go to a
            separate file that the reconcile agent (a third agent) merges with Pass A's guide.

            THE LAW — the skill is the single source of truth; this prompt carries only your
            stage contract. Read and follow EXACTLY:
              .claude/skills/waypoint-guide-author/SKILL.md — Pass B: the resident/blog/forum/
                reddit angle, the different questions you ask (off-peak reality, tourist-trap
                alternatives, the non-obvious neighborhood, authentic local dining), and the
                rule that every find is a T2 LEAD verified against a primary source (T0/T1)
                before recording — no primary source, stays out.
              references/verification-rules.md — the tier ladder your leads must climb.
              references/research-efficiency.md — the BINDING search budget + reserved duty
                budget (resident phrases/slang ≥2 searches), and "Social & video lead
                sourcing": yt-dlp is installed best-effort on this runner (transcripts only,
                ~4 max, a failed install or pull is bot-blocked — mark and move on, never
                retry-loop); TikTok/IG via web-indexed roundups ONLY; viral = a crowd warning,
                never a citation; "locals" phrasing needs ≥2 independent sources.
            The CLAUDE.md accuracy standard (auto-loaded) is also binding.

            STAGE CONTRACT:
            - Read ONLY: guides-intake/${{ inputs.slug }}.md (the intake spec — priorities,
              dates, anchor) + the skill files above. Never the guide directory, never Pass A's
              work.
            - Write findings to guides-intake/${{ inputs.slug }}.passB.json as a JSON array:
              [
                {
                  "item": "Sight / restaurant / tip name",
                  "category": "crowd | alternative | timing | novel | food | transit | language",
                  "finding": "What you found (the traveler-facing insight)",
                  "source_url": "https://...",
                  "verified_on": "YYYY-MM-DD",
                  "replaces": "optional — name of the obvious/generic pick this replaces, if any"
                }
              ]
              Each entry MUST have a source_url and verified_on. Omit entries you could not verify.
            - Checkpoint and commit:
                npm run pipeline -- --slug ${{ inputs.slug }} --checkpoint passB
                && git add -A && git commit -m "research(${{ inputs.slug }}): Pass B" && git push
            - STOP there. Do NOT edit the guide, reconcile, or verify — a separate agent handles
              that. If you run low on wall-clock, commit what you have.

      # ── Route after Pass B ───────────────────────────────────────────────────
      - name: Route after Pass B
        id: route3
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          NEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status --json | jq -r '.nextStage')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "[route] after Pass B, next stage: $NEXT"

      # ── AGENT 3: Reconcile + Verify (stops before graduation) ────────────────
      - name: Run research agent — Reconcile & verify
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'reconcile' || steps.route.outputs.next == 'verified' ||
           steps.route2.outputs.next == 'reconcile' || steps.route2.outputs.next == 'verified' ||
           steps.route3.outputs.next == 'reconcile' || steps.route3.outputs.next == 'verified')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Guide slug: ${{ inputs.slug }}
            Section focus: ${{ inputs.section || 'full pass — all sections' }}

            YOU ARE THE RECONCILE & VERIFY AGENT — the skill's "Reconcile → ONE guide, with a
            ledger" plus the self-correction loop. You merge two independent research passes
            into one guide, then drive it through verification. You do NOT graduate.

            THE LAW — the skill is the single source of truth; this prompt carries only your
            stage contract. Read and follow EXACTLY:
              .claude/skills/waypoint-guide-author/SKILL.md — Reconcile (AGREE / A-only /
                B-only / CONFLICT + the `## Research reconciliation` ledger + `## Amendments`),
                authenticity woven into existing bodies (crowd + best-time notes, no new tabs),
                fact discipline, and done-gate step 1 (the self-correction loop).
              references/verification-rules.md, references/research-efficiency.md,
                references/block-types.md — binding as everywhere.
              references/pipeline-roles.md — "Traveler questions" for any real fork
                reconciliation reveals (proceed on the assumption; never block).
            The CLAUDE.md accuracy standard (auto-loaded) is also binding.

            STAGE CONTRACT:
            - Target: the DIRECTORY src/content/guides/${{ inputs.slug }}/ — never a flat
              src/content/guides/${{ inputs.slug }}.json.
            - RESUMABLE: `npm run pipeline -- --slug ${{ inputs.slug }} --status` first; do ONLY
              the un-done stages (reconcile and/or verified). Never redo a cleared stage.
            - TWO SOURCES TO RECONCILE: Pass A's guide (already in the guide directory, with its
              verification ledger) and Pass B's findings
              (guides-intake/${{ inputs.slug }}.passB.json — independent, each entry
              primary-source verified).
            - After reconciling, checkpoint and commit:
                npm run pipeline -- --slug ${{ inputs.slug }} --checkpoint reconcile
                && git add -A && git commit -m "research(${{ inputs.slug }}): reconcile" && git push
            - SELF-CORRECTION LOOP (the `verified` stage) — the skill's done-gate step 1,
              iterate, never one-shot: offline rounds first (`npm run verify -- --slug
              ${{ inputs.slug }}` + `npm run build`; fix each blocking ⚠ by re-researching that
              fact against a T0 source — never silence a flag you cannot source; up to 4
              rounds), THEN the FINAL NETWORK GATE, the only gate that checks links + Commons
              photos: `npm run verify -- --slug ${{ inputs.slug }} --network`.
              · content FAIL → fix each finding (dead link → re-source the fact from a live
                primary; missing photo → correct via search-commons.mjs or omit) and re-run the
                SAME networked verify — never fall back to the offline command from here on.
              · UNVERIFIABLE (a checker outage — NOT the same as "checked, found nothing") →
                wait 60s, retry ONCE; still UNVERIFIABLE → do NOT proceed: commit as-is, write
                the outage into the scorecard, and let landing take the draft-PR path.
            - STOP once the networked verify PASSes — commit and push, then hand off:
                git add -A && git commit -m "research(${{ inputs.slug }}): verify PASS — awaiting critic" && git push
              Separate critic agents run next in fresh contexts and own graduation.
            - If the 4-round cap ends still NEEDS WORK: commit and push whatever fix attempts
              you made (check `git status --short` first; skip if nothing), so the remote
              reflects your actual last state:
                git add -A && git commit -m "research(${{ inputs.slug }}): NEEDS WORK after 4 rounds" && git push
            - Never touch any guide other than src/content/guides/${{ inputs.slug }}/ and its
              guides-intake/${{ inputs.slug }}.md + .state.json.

      # ── Route after Reconcile & Verify ─────────────────────────────────────
      - name: Route after Reconcile
        id: route4
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          NEXT=$(node scripts/pipeline.mjs --slug "$SLUG" --status --json | jq -r '.nextStage')
          # The critic runs when the guide passes mechanical verification. We check the exit
          # code of verify (0 = PASS) rather than parsing JSON, which is more robust.
          set +e
          node scripts/verify-guide.mjs --slug "$SLUG" > /dev/null 2>&1
          VERIFY_EXIT=$?
          set -e
          VERIFIED=false; [ "$VERIFY_EXIT" -eq 0 ] && VERIFIED=true
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "[route] after Reconcile, next=$NEXT, verified=$VERIFIED"

      # ── AGENT 4 (vibe_pass): Fable vibe critic — judgment only, edits nothing ──
      # EXPERIMENTAL: reads the finished guide as a well-travelled friend would — pacing,
      # geography, meals, tone, plain common sense — and records findings for a separate
      # executor. It never edits the guide, so its judgment can be bold without its context
      # carrying execution discipline. continue-on-error is DELIBERATE: the Fable model id
      # is unproven on this action headless — on failure the Opus fallback step below runs
      # the SAME critique, so the pass degrades in model, never in coverage. The rubric
      # critic still audits everything last.
      - name: Run research agent — Vibe critic (Fable)
        id: vibefable
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          steps.route4.outputs.verified == 'true' &&
          format('{0}', inputs.vibe_pass) != 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          # Read-and-judge, not exhaustive search — high, never xhigh.
          claude_args: |
            --model claude-fable-5
            --effort high
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
          prompt: |
            Guide slug: ${{ inputs.slug }}

            YOU ARE THE VIBE CRITIC. THE LAW — read and execute EXACTLY:
              .claude/skills/waypoint-guide-author/references/pipeline-roles.md — "The vibe
              lens": your inputs (and what you are forbidden to read), the five judgments,
              the `## Vibe findings` output format, and the exact clean-pass sentinel.

            STAGE CONTRACT:
            - Findings go in guides-intake/${{ inputs.slug }}.md ONLY. Commit and push exactly
              that file:
                git add guides-intake/${{ inputs.slug }}.md
                git commit -m "research(${{ inputs.slug }}): vibe findings" && git push
            - Touch NOTHING else. Do not edit guide files. Do not graduate.

      # ── Vibe critic FALLBACK (Opus 5) — runs ONLY if the Fable step failed ─────
      # Degrade the model, never the pass (creator's ruling). With continue-on-error,
      # `outcome` records the real failure while `conclusion` stays green — so this
      # triggers on outcome. continue-on-error here too: a double failure skips the
      # vibe pass (the findings gate then finds nothing) instead of blocking graduation.
      # Both vibe steps share ONE prompt that is a thin pointer to pipeline-roles.md "The
      # vibe lens" — the lens itself lives in the skill, so the two copies below stay
      # trivially identical and carry no content that can drift.
      - name: Run research agent — Vibe critic fallback (Opus)
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          steps.route4.outputs.verified == 'true' &&
          format('{0}', inputs.vibe_pass) != 'false' &&
          steps.vibefable.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model claude-opus-5
            --effort high
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
          prompt: |
            Guide slug: ${{ inputs.slug }}

            YOU ARE THE VIBE CRITIC. THE LAW — read and execute EXACTLY:
              .claude/skills/waypoint-guide-author/references/pipeline-roles.md — "The vibe
              lens": your inputs (and what you are forbidden to read), the five judgments,
              the `## Vibe findings` output format, and the exact clean-pass sentinel.

            STAGE CONTRACT:
            - Findings go in guides-intake/${{ inputs.slug }}.md ONLY. Commit and push exactly
              that file:
                git add guides-intake/${{ inputs.slug }}.md
                git commit -m "research(${{ inputs.slug }}): vibe findings" && git push
            - Touch NOTHING else. Do not edit guide files. Do not graduate.

      # Findings gate — spawn the Opus executor only when there is real work for it.
      - name: Route after vibe critic
        id: vibe
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          steps.route4.outputs.verified == 'true' &&
          format('{0}', inputs.vibe_pass) != 'false'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          F="guides-intake/${SLUG}.md"
          HAS=false
          if grep -q "^## Vibe findings" "$F" && \
             ! grep -A2 "^## Vibe findings" "$F" | grep -qi "^None"; then HAS=true; fi
          echo "has_findings=$HAS" >> "$GITHUB_OUTPUT"
          echo "[route] vibe findings present: $HAS"

      # ── AGENT 5 (if findings): Opus vibe executor — implements, never graduates ──
      - name: Run research agent — Vibe executor (Opus)
        if: steps.vibe.outputs.has_findings == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model claude-opus-5
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Guide slug: ${{ inputs.slug }}

            YOU ARE THE VIBE EXECUTOR. THE LAW — read and execute EXACTLY:
              .claude/skills/waypoint-guide-author/references/pipeline-roles.md — "The vibe
                executor": implement the `## Vibe findings` recorded in
                guides-intake/${{ inputs.slug }}.md under full discipline; anything NEW is
                verified against a primary (T0) source before it ships; a finding you judge
                wrong gets a one-line rebuttal in the intake doc instead of an edit —
                disagreement is allowed, silence is not.
              .claude/skills/waypoint-guide-author/SKILL.md + references/ — the full fact
                discipline your edits run under (ledger, provenance, ≈/⚠ states, continuity
                sweep). Vibe never lowers the bar.

            STAGE CONTRACT:
            - Edit only the guide DIRECTORY src/content/guides/${{ inputs.slug }}/ and the
              intake doc guides-intake/${{ inputs.slug }}.md.
            - Re-run `npm run verify -- --slug ${{ inputs.slug }}` and `npm run build` until
              both are clean (≤3 rounds), then commit and push:
                git add -A && git commit -m "research(${{ inputs.slug }}): vibe findings executed" && git push
            - Do NOT graduate and do NOT land the branch — the rubric critic runs next with
              fresh eyes, audits your work, and owns graduation.

      # HARD GATE (continuity doctrine → gate, creator's ruling 2026-07-30): if the vibe
      # executor edited the guide, its edits must carry a recorded continuity sweep
      # (pipeline-roles.md, "The vibe executor"). Fails BEFORE the rubric critic — an edit
      # with no recorded sweep must not reach graduation. A barrier by design.
      - name: Continuity artifact gate — executor sweep record
        if: steps.vibe.outputs.has_findings == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if ! grep -q "^#### Continuity sweep — vibe execution" "guides-intake/${SLUG}.md"; then
            echo "::error::Vibe executor ran but left no '#### Continuity sweep — vibe execution' record in guides-intake/${SLUG}.md — the continuity doctrine requires the artifact."
            exit 1
          fi
          echo "[gate] executor continuity sweep record present"

      # ── AGENT 6: Fresh-context rubric Critic + Graduate ──────────────────────
      # P3/R8/R9: a SEPARATE agent invocation with fresh context — it sees ONLY the intake
      # spec and the finished guide, not the research process or intermediate findings. This
      # is the bar test: "Could a generic AI have written this from training data alone,
      # without research and without knowing this traveler?" Runs on `critic_model`
      # (default Opus — judgment is Opus work), independent of the research model, and
      # deliberately LAST: when the vibe pair ran, their edits get audited here too.
      - name: Run research agent — Critic & graduate
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          steps.route4.outputs.verified == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.critic_model || 'claude-opus-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Guide slug: ${{ inputs.slug }}

            YOU ARE THE CRITIC AGENT — the fresh-context quality gate, run AFTER all mechanical
            verification. You have NO knowledge of how the research was done; you see only the
            finished product and the original spec, and you own graduation.

            THE LAW — the skill is the single source of truth; this prompt carries only your
            stage contract. Read and execute EXACTLY:
              .claude/skills/waypoint-guide-author/references/pipeline-roles.md — "The
                fresh-context critic": your inputs (and the files you are FORBIDDEN to read),
                the four scans, the `## Critic findings` format (researched replacements
                REQUIRED — "consider adding" is never sufficient; exact clean-pass sentinel),
                and the CITATION AUDIT (`## Citation audit` table) you MUST record — the
                workflow hard-gates on both artifacts after you finish.
              .claude/skills/waypoint-guide-author/SKILL.md + references/verification-rules.md
                + references/block-types.md — the standards you enforce and edit under.
              docs/GUIDE_RUBRIC.md — the rows you score against.
            The CLAUDE.md accuracy standard (auto-loaded) is also binding.

            STAGE CONTRACT — after findings are recorded AND resolved in the guide (edit the
            group files, extend the ledger, re-run `npm run verify -- --slug ${{ inputs.slug }}`
            + `npm run build` until clean, ≤3 rounds), and the `## Citation audit` is written:

            GRADUATION:
              a. Extract the identity palette:
                 npm run extract-palette -- --slug ${{ inputs.slug }}
                 (writes src/data/palettes/${{ inputs.slug }}.json — commit it; skips harmlessly
                 if no photo)
              b. Compose tabs while the guide is STILL a draft:
                 node scripts/compose-guide.mjs --slug ${{ inputs.slug }} --write
                 A compose ERROR is a real finding: fix the cause (usually a ⚠-flagged unit
                 stranded in a thin group — source it or move it deliberately, or raise tabBudget
                 in _guide.json with a one-line justification), then re-run verify + compose.
              c. Auto-graduate:
                 node scripts/graduate-guide.mjs --slug ${{ inputs.slug }}
                 && npm run pipeline -- --slug ${{ inputs.slug }} --checkpoint verified
                 && git add -A && git commit -m "research(${{ inputs.slug }}): critic clear — auto-graduated" && git push

            LANDING THE BRANCH — however the above ended, hand landing to the shared script:

              set +e
              npm run verify -- --slug ${{ inputs.slug }} --markdown --network > /tmp/scorecard.md
              VERIFY_EXIT=$?
              set -e
              NEXT=$(node scripts/pipeline.mjs --slug ${{ inputs.slug }} --status --json | jq -r '.nextStage')
              PASSED=false; [ "$NEXT" = "null" ] && [ "$VERIFY_EXIT" -eq 0 ] && PASSED=true
              bash scripts/land-branch.sh "research/${{ inputs.slug }}" main \
                "Research pass: ${{ inputs.slug }}${{ inputs.section != '' && format(' ({0})', inputs.section) || '' }}" \
                /tmp/scorecard.md "$PASSED" \
                "$SITE_BASE_URL/guides/${{ inputs.slug }}/"

            It prints exactly one line — read it, don't guess what happened:
            - **`merged:<n>`** — the guide landed on `main` ALREADY graduated. It goes live on
              the next Pages deploy. land-branch.sh auto-files a "🚀 Auto-published" heads-up
              issue; the deploy workflow's `verify-live` job confirms it's reachable.
            - **`draft:<n>`** — verify didn't reach PASS or auto-merge hit a conflict. PR #<n>
              is where a human triages it.

            Never touch any guide other than
            src/content/guides/${{ inputs.slug }}/ and its
            guides-intake/${{ inputs.slug }}.md + .state.json + src/data/palettes/${{ inputs.slug }}.json.

            FINALLY, write a short run report to `run-report.md` (repo root, gitignored — do NOT
            commit it): a `## Run report` heading then 3-5 bullets — outcome (published / draft /
            stuck), critic findings count and what was caught, the citation-audit result, and any
            place the skill or its references were unclear. This feeds the monthly skill-retro;
            be concrete.

      # HARD GATE (creator's ruling, 2026-07-30): the critic's two required artifacts are not
      # advisory. A critic run that ended without recording `## Critic findings` AND the
      # `## Citation audit` table did not do its job, even if everything else looks green —
      # fail the run loudly so it can never read as a clean pass. This runs after landing by
      # necessity (the critic itself writes the artifacts), so it is an alarm, not a barrier:
      # a missing artifact means a human looks at the run, not that a good guide is blocked.
      - name: Critic artifact gate — findings + citation audit are REQUIRED
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          steps.route4.outputs.verified == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          F="guides-intake/${SLUG}.md"
          MISSING=""
          grep -q "^## Critic findings" "$F" || MISSING="$MISSING '## Critic findings'"
          grep -q "^## Citation audit" "$F" || MISSING="$MISSING '## Citation audit'"
          if [ -n "$MISSING" ]; then
            echo "::error::Critic run ended without required artifact(s):$MISSING in $F — pipeline-roles.md's critic protocol / the skill's done-gate citation audit was not completed."
            exit 1
          fi
          echo "[gate] critic artifacts present: findings + citation audit"

      # P1 — RUN INTEGRITY (QA findings F1/F2). Two things the old workflow could not see:
      #   · a VOID run — the agent burned a full session, exited `success`, and left NOTHING
      #     durable behind (no commit, no checkpoint). This happened on attempt 1 of the very
      #     first real run and cost $11+ with no way to tell after the fact.
      #   · a run that CLAIMED staged progress it never made. Japan's commit labelled "Pass A"
      #     already contained passA, passB and reconcile — the two commits after it introduced no
      #     stage state at all, so `git log` narrated a resumable run that never existed.
      # --report-only keeps this step green so the remediation steps below still run; the final
      # "Enforce run integrity" step is what actually fails the workflow.
      - name: Run-integrity gate
        id: integrity
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          node scripts/check-run-integrity.mjs --slug "$SLUG" \
            --pre-head "${{ steps.pre.outputs.head }}" \
            --pre-stages "${{ steps.pre.outputs.stages }}" \
            --report-only

      # F2 remediation: a void run gets exactly ONE automatic retry. Re-dispatching the workflow
      # (rather than duplicating the agent step) keeps the 200-line research prompt in ONE place —
      # two copies would drift — and reuses the existing attempt budget, so the circuit breaker
      # still caps the total. `void_retry: true` is what makes it once-only.
      - name: Auto-retry once after a void run
        if: steps.integrity.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          echo "[run-integrity] VOID run — re-dispatching once with void_retry=true." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run research-pass.yml \
            -f slug="$SLUG" \
            -f section="${{ inputs.section }}" \
            -f model="${{ inputs.model || 'claude-sonnet-5' }}" \
            -f effort="${{ inputs.effort || 'high' }}" \
            -f void_retry=true

      # A second void in a row is not a flake — the run is stuck in a way retrying cannot fix.
      - name: File a stuck issue after a second void run
        if: steps.integrity.outputs.void == 'true' && format('{0}', inputs.void_retry) == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Research stuck: $SLUG"
          BODY=$(printf 'Two consecutive research runs for `%s` produced **no durable output** — no commit, no checkpoint advance — while reporting success. The auto-retry has been spent.\n\nThis is QA finding F2: a green agent step is not evidence of work. Check the run log (`show_full_output` is on) before dispatching again.\n\nLatest run: %s\n' "$SLUG" "$RUN_URL")
          EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY";
          else gh issue create --title "$TITLE" --body "$BODY" --label "stuck"; fi

      # W3: deposit a run report on the pipeline ledger issue regardless of how the agent finished,
      # so the skill-retro proposer has evidence to reason over. `|| true` — the ledger never fails
      # the run.
      # R6 — the Composer rides every research pass: research emits tagged units,
      # deterministic code assembles the tabs (scripts/compose-guide.mjs; rules + tests
      # there). The auto-APPLY lives inside the agent's step (d), after the networked
      # verify PASS and BEFORE graduation — the one moment the guide is both complete and
      # still a draft. This step deliberately never writes: on the PASS path the guide has
      # already graduated + merged (a --write here would land on a spent branch and read
      # the guide as live anyway), and on a cut-off run the draft is half-researched — a
      # --write would fold empty scaffolding into Plan/Days and mangle the shape the
      # resume expects. So: exit 0 = composed (the normal PASS outcome, since step (d)
      # just ran); exit 2 = a standing proposal, surfaced in the job summary for the
      # creator (--write --creator-signed) or for the next resumed pass to absorb; any
      # other nonzero (the ⚠-relocation guard, unit loss) fails this run loudly.
      - name: Compose check — verify composed, surface proposals, guard errors
        if: steps.budget.outputs.should_run == 'true'
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set +e
          OUT=$(node scripts/compose-guide.mjs --slug "$SLUG" --check 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          { echo "### Composer"; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -eq 2 ]; then
            echo "Standing proposal — composition applies inside the next research pass (drafts) or via --write --creator-signed (live)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi

      # The actual verdict. Runs after remediation so a void run still gets its retry dispatched
      # and a stuck issue filed before the workflow goes red — but it DOES go red: a run that
      # produced nothing, or that faked its staging, is a failed run no matter what merged.
      - name: Enforce run integrity
        if: always() && steps.budget.outputs.should_run == 'true'
        run: |
          VOID="${{ steps.integrity.outputs.void }}"
          VIOLATIONS="${{ steps.integrity.outputs.violations }}"
          if [ "$VOID" = "true" ]; then
            echo "::error::Void run — the agent produced no durable output (QA finding F2). Remediation dispatched above."
            exit 1
          fi
          if [ -n "$VIOLATIONS" ] && [ "$VIOLATIONS" != "0" ]; then
            echo "::error::Checkpoint discipline violated — $VIOLATIONS finding(s), kinds: ${{ steps.integrity.outputs.kinds }}. The stages this run cleared are not resumable (QA finding F1)."
            exit 1
          fi
          echo "[run-integrity] clean."

      - name: Append run report to the ledger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: research-pass
          SLUG: ${{ inputs.slug }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTE_FILE: run-report.md
        run: node scripts/append-run-report.mjs || true
