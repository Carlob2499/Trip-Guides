name: Research pass

# The RESEARCH lifecycle: four Claude Code agents build one guide — Pass A (canonical/verified) →
# Pass B (local/authentic/crowd-aware, structurally blind to Pass A) → Reconcile + verify → a
# fresh-context critic. Each is a separate action invocation, so independence is enforced by the
# infrastructure rather than asked for in a prompt.
#
# This file is ORCHESTRATION ONLY. Every prompt lives in prompts/ (composed by
# `pipeline prompt`, which fails loudly on an unresolved placeholder) and every decision lives in
# scripts/pipeline.mjs. If you are about to add a `run: |` block with logic in it, it belongs in
# one of those two places instead.
#
# Resumable: the agents commit + checkpoint after EACH stage, and this job resumes the
# research/<slug> branch, so a run cut off by the wall-clock or a usage window picks up at the
# next un-done stage. `pipeline gate integrity` audits whether that actually happened — a run
# that produced nothing durable, or recorded several stages in one burst, fails.
#
# Publishing is automatic: a guide that clears every stage AND passes the networked verify has
# its draft flag removed by the landing step and goes live on the next Pages deploy. Anything
# less lands as a draft PR for a human. There is no separate approval event.
#
# Runs on the Claude MAX subscription (CLAUDE_CODE_OAUTH_TOKEN secret, from `claude setup-token`).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Guide slug (e.g. japan, sweden). Must match src/content/guides/<slug>/"
        required: true
        type: string
      section:
        description: "Section key to focus on (e.g. food, sights). Leave blank for a full pass."
        required: false
        type: string
        default: ""
      model:
        description: "Model for Pass A + reconcile. Research is Sonnet work; Opus only for a genuinely contested reconcile."
        required: false
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-5
        default: claude-sonnet-5
      effort:
        description: "Reasoning effort. high is the default for every agent; xhigh only for a deliberately exhaustive one-off pass."
        required: false
        type: choice
        options:
          - high
          - xhigh
          - medium
          - max
        default: high
      critic_model:
        description: "Model for the fresh-context critic. Opus is the doctrine default for judgment work."
        required: false
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-fable-5
        default: claude-opus-5
      issue:
        description: "Intake issue number to post traveler questions to (set automatically by new-guide.yml)."
        required: false
        type: string
        default: ""
      void_retry:
        description: "Internal — set by the auto-retry after a void run. Leave false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # the void auto-retry re-dispatches this workflow

# ONE guide-<slug> group across research (V1 + V2) AND change: two dispatches for the same slug
# would race the same branch, and a research run and a change run interleaving on one guide
# could land conflicting edits (M6 — they share an exclusion boundary now).
concurrency:
  group: guide-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # Job-level so the agent action's own Bash tool (which inherits this environment) has the
    # same credentials the steps do.
    env:
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://carlob2499.github.io/Trip-Guides' }}
      GH_TOKEN: ${{ github.token }}
      PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      GOOGLE_ROUTES_KEY: ${{ secrets.GOOGLE_ROUTES_KEY }}
      # Every workflow input the `run:` blocks below need, bound ONCE as environment DATA. A
      # `${{ }}` expression written into a `run:` body is text spliced into the shell script
      # before bash parses it, so a value carrying a quote or `$(…)` would be code — and `slug`
      # and `section` come from a dispatch anyone with write access (or the Worker) can shape.
      # Read them as "$SLUG" / "$SECTION"; never re-inline them.
      SLUG: ${{ inputs.slug }}
      SECTION: ${{ inputs.section }}
      ISSUE: ${{ inputs.issue }}
      MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
      EFFORT: ${{ inputs.effort || 'high' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name  "waypoint-research[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Validates the slug (it becomes a branch name, a path segment and a prompt value below)
      # and resumes the branch if a prior cut-off run created it. Must run before any state
      # mutation: bumping the attempt count on main first made `git checkout` abort on the
      # modified state file.
      - name: Resume or start the research branch
        id: branch
        run: node scripts/pipeline.mjs branch --slug "$SLUG" --prefix research

      # Circuit breaker: a headless run that keeps getting cut off eventually stops and asks a
      # human. Runs BEFORE the agents so a stuck guide never spends agent tokens, and commits the
      # bumped count on this branch so the breaker's memory survives a run that dies early.
      - name: Attempt budget
        id: budget
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline.mjs gate budget --slug "$SLUG" --branch "$BRANCH"

      - name: Preflight — check intake for contradictions
        if: steps.budget.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: node scripts/pipeline.mjs gate preflight --slug "$SLUG" --branch "$BRANCH"

      # Transcript lead sourcing for Pass B. Best-effort BY DESIGN — transcripts are an aide, not
      # a dependency, so nothing downstream checks this step's outcome.
      - name: Install yt-dlp (best-effort)
        if: steps.budget.outputs.should_run == 'true'
        continue-on-error: true
        run: python3 -m pip install --upgrade yt-dlp

      - name: Pre-agent snapshot
        id: pre
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/check-run-integrity.mjs --slug "$SLUG" --snapshot

      - name: Route to next stage
        id: route
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline.mjs route --slug "$SLUG"

      # ── AGENT 1: Pass A ──────────────────────────────────────────────────────
      - name: Compose Pass A prompt
        id: p1
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'scaffold' || steps.route.outputs.next == 'passA')
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_SECTION: ${{ inputs.section || 'full pass — all sections' }}
        run: node scripts/pipeline.mjs prompt prompts/research-passA.md > /dev/null

      # Each agent step keys off its own compose step's conclusion: a skipped compose means the
      # stage is already cleared, so the agent is skipped too. One condition, not two copies.
      - name: Run research agent — Pass A
        if: steps.p1.conclusion == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: ${{ steps.p1.outputs.text }}

      - name: Route after Pass A
        id: route2
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline.mjs route --slug "$SLUG"

      # ── AGENT 2: Pass B (independent, A-blind, always Sonnet) ─────────────────
      # A SEPARATE invocation that receives only the intake spec — never the guide content Pass A
      # wrote. Independence is structural here, not prompt-only.
      - name: Compose Pass B prompt
        id: p2
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'passB' || steps.route2.outputs.next == 'passB')
        env:
          WP_SLUG: ${{ inputs.slug }}
        run: node scripts/pipeline.mjs prompt prompts/research-passB.md > /dev/null

      - name: Run research agent — Pass B (independent)
        if: steps.p2.conclusion == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          # Pass B is always Sonnet regardless of the model input — that input governs Pass A and
          # reconcile only.
          claude_args: |
            --model claude-sonnet-5
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: ${{ steps.p2.outputs.text }}

      - name: Route after Pass B
        id: route3
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline.mjs route --slug "$SLUG"

      # ── AGENT 3: Reconcile + verify ──────────────────────────────────────────
      - name: Compose reconcile prompt
        id: p3
        if: >-
          steps.budget.outputs.should_run == 'true' &&
          (steps.route.outputs.next == 'reconcile' || steps.route.outputs.next == 'verified' ||
           steps.route2.outputs.next == 'reconcile' || steps.route2.outputs.next == 'verified' ||
           steps.route3.outputs.next == 'reconcile' || steps.route3.outputs.next == 'verified')
        env:
          WP_SLUG: ${{ inputs.slug }}
          WP_SECTION: ${{ inputs.section || 'full pass — all sections' }}
        run: node scripts/pipeline.mjs prompt prompts/research-reconcile.md > /dev/null

      - name: Run research agent — Reconcile & verify
        if: steps.p3.conclusion == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: ${{ steps.p3.outputs.text }}

      - name: Route after reconcile
        id: route4
        if: steps.budget.outputs.should_run == 'true'
        run: node scripts/pipeline.mjs route --slug "$SLUG" --verify

      # HARD GATE: Pass A and B are independent, but ONE agent merges them and no later critic can
      # see what the merge silently dropped — they judge the product, not what is missing from it.
      # Every passB.json entry must carry a written verdict in the ledger. Fails BEFORE the critic
      # spends tokens; the quantitative floors bite only on a full pass.
      - name: Pass B coverage gate
        if: steps.budget.outputs.should_run == 'true' && steps.route4.outputs.verified == 'true'
        run: |
          # The full-pass flag is decided in bash from "$SECTION", not appended as expression text.
          FLOORS=()
          if [ -z "$SECTION" ]; then FLOORS=(--floors); fi
          node scripts/pipeline.mjs gate coverage --slug "$SLUG" "${FLOORS[@]}"

      # ── AGENT 4: fresh-context critic ────────────────────────────────────────
      - name: Compose critic prompt
        id: p4
        if: steps.budget.outputs.should_run == 'true' && steps.route4.outputs.verified == 'true'
        env:
          WP_SLUG: ${{ inputs.slug }}
        run: node scripts/pipeline.mjs prompt prompts/research-critic.md > /dev/null

      - name: Run research agent — Critic
        if: steps.p4.conclusion == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          show_full_output: true
          claude_args: |
            --model ${{ inputs.critic_model || 'claude-opus-5' }}
            --effort ${{ inputs.effort || 'high' }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
          prompt: ${{ steps.p4.outputs.text }}

      # An alarm, not a barrier — it necessarily runs after the critic, since the critic is what
      # writes the artifacts. A missing record means a human looks at the run.
      - name: Critic artifact gate
        if: steps.budget.outputs.should_run == 'true' && steps.route4.outputs.verified == 'true'
        run: node scripts/pipeline.mjs gate artifacts --slug "$SLUG" --stage critic

      # Integrity, remediation and compose all run BEFORE landing, so their verdicts can gate the
      # merge. Report-only here keeps the step green so remediation (the void auto-retry, the
      # stuck issue) still runs; the landing step reads these outputs to decide auto vs draft, and
      # the final enforce step is what turns the run red.
      - name: Run-integrity gate
        id: integrity
        if: steps.budget.outputs.should_run == 'true'
        env:
          PRE_HEAD: ${{ steps.pre.outputs.head }}
          PRE_STAGES: ${{ steps.pre.outputs.stages }}
        run: |
          node scripts/pipeline.mjs gate integrity --slug "$SLUG" \
            --pre-head "$PRE_HEAD" --pre-stages "$PRE_STAGES"

      # A void run gets exactly ONE automatic retry. Re-dispatching (rather than repeating the
      # agent steps) reuses the attempt budget, so the circuit breaker still caps the total.
      - name: Auto-retry once after a void run
        if: steps.integrity.outputs.void == 'true' && format('{0}', inputs.void_retry) != 'true'
        run: |
          gh workflow run research-pass.yml -f slug="$SLUG" -f section="$SECTION" \
            -f model="$MODEL" -f effort="$EFFORT" \
            -f issue="$ISSUE" -f void_retry=true

      - name: File a stuck issue after a second void run
        if: steps.integrity.outputs.void == 'true' && format('{0}', inputs.void_retry) == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/pipeline.mjs gate stuck --slug "$SLUG" \
            --run-url "$RUN_URL"

      # continue-on-error so a compose failure DOWNGRADES the landing to a draft PR rather than
      # skipping the landing entirely (a draft PR is the human-triage surface — losing it would
      # hide the failure, not surface it). The enforce step below still turns the run red.
      - name: Compose check
        id: compose
        if: steps.budget.outputs.should_run == 'true'
        continue-on-error: true
        run: node scripts/pipeline.mjs gate compose --slug "$SLUG"

      # THE EVIDENCE GATE AND THE LANDING, in code: runs the REAL evidence gate itself (build +
      # networked verify), writes the scorecard as the PR body, removes the draft flag when the
      # guide passed every stage AND every pre-landing gate, and opens or merges the PR.
      # A void run, a checkpoint-discipline violation or a compose failure forces --land pr: the
      # work still surfaces as a draft PR, but nothing auto-merges past a failed gate.
      # --announce makes land-branch.sh file the vetoable "auto-published" notice, so a
      # self-publish is still something a human can catch and roll back.
      - name: Land the branch
        if: steps.budget.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          VOID: ${{ steps.integrity.outputs.void }}
          VIOLATIONS: ${{ steps.integrity.outputs.violations }}
          COMPOSE_OUTCOME: ${{ steps.compose.outcome }}
        run: |
          TITLE="Research pass: $SLUG"
          if [ -n "$SECTION" ]; then TITLE="$TITLE ($SECTION)"; fi
          LAND=auto
          if [ "$VOID" = "true" ] || [ "${VIOLATIONS:-0}" != "0" ] || [ "$COMPOSE_OUTCOME" = "failure" ]; then
            LAND=pr
          fi
          node scripts/pipeline.mjs land --slug "$SLUG" \
            --branch "$BRANCH" --gate --require-verified \
            --land "$LAND" \
            --title "$TITLE" \
            --announce "${SITE_BASE_URL}/guides/${SLUG}/"

      # Runs after remediation and landing so a void run still gets its retry, its stuck issue
      # and its draft PR before the workflow goes red — but it does go red.
      - name: Enforce run integrity
        if: always() && steps.budget.outputs.should_run == 'true'
        env:
          VOID: ${{ steps.integrity.outputs.void }}
          VIOLATIONS: ${{ steps.integrity.outputs.violations }}
          KINDS: ${{ steps.integrity.outputs.kinds }}
          COMPOSE_OUTCOME: ${{ steps.compose.outcome }}
        run: |
          node scripts/pipeline.mjs gate enforce --slug "$SLUG" \
            --void "$VOID" \
            --violations "$VIOLATIONS" \
            --kinds "$KINDS" \
            --compose "$COMPOSE_OUTCOME"

      # Surface, never gate: the traveler sees what was assumed on their behalf. always() so a
      # cut-off run still asks what it managed to; skipped silently on a manual dispatch.
      - name: Surface traveler questions on the intake issue
        if: always() && inputs.issue != ''
        continue-on-error: true
        run: node scripts/pipeline.mjs questions --slug "$SLUG" --issue "$ISSUE"
