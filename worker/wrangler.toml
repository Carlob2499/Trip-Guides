# Cloudflare Worker config for the site's backend (W5 intake proxy, widened in batch 3 to the
# change/answer/approve endpoints and now the V2 run-note endpoint). Deployed by
# .github/workflows/deploy-worker.yml (cloudflare/wrangler-action), never by hand.
name = "waypoint-intake"
main = "note-entry.mjs"
compatibility_date = "2024-11-01"

# Non-secret config. The two secrets (GH_TOKEN, OWNER_KEY) are set separately with
# `npx wrangler secret put <NAME>` — never committed.
[vars]
REPO = "Carlob2499/Trip-Guides"
ALLOWED_ORIGIN = "https://carlob2499.github.io"
AUTO_CAP = "3"
# Explicit over ambient (CLAUDE.md Boundary Check #4): name the ref and the workflow file the
# owner endpoints dispatch, rather than letting the API resolve a default that can change.
DISPATCH_REF = "main"
CHANGE_WORKFLOW = "change.yml"

# Per-IP weekly rate limiting. Created 2026-08-15 with `npx wrangler kv namespace create RATE`.
# Without this binding the Worker still runs, but an intake is UNMEASURED and so fails safe:
# the issue is filed without the auto-run label and research never starts on its own.
[[kv_namespaces]]
binding = "RATE"
id = "0377d2a631634212a7afd188c1e6c0de"

# Short-lived shared cache for authored Route Matrix responses and severe-weather alerts.
# Exact-location routes and Places operational fields are deliberately never stored here.
[[kv_namespaces]]
binding = "LIVE_CACHE"
id = "440cd73a4c474d11a1593753b5e34fc5"

# Cost guard for paid runtime providers. Google Cloud per-API quotas/budgets remain the hard cap.
[[ratelimits]]
name = "RUNTIME_LIMITER"
namespace_id = "21001"
  [ratelimits.simple]
  limit = 30
  period = 60
